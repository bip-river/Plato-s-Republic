ow and keep it caged in your own; the part of us that longs to weep and wail is watered and nourished, and then it is there, waiting, when the loss is ours.\n\nAnd the same goes for laughter, and for sex, and for anger: what we would be ashamed to do, we watch, and enjoy watching, and become.\n\nSo: crown him, anoint him with myrrh, and escort him with honour to the border of another city.\n\nThere is an ancient quarrel, he says, between philosophy and poetry \u2014 and he quotes the abuse the poets have thrown at philosophers for centuries, and clearly enjoys it. And he adds, quietly, that if poetry can produce a defence of herself, in lyric or any other metre, showing that she is not only pleasant but <em>useful</em> to cities and to human life, we shall be delighted to hear it \u2014 for we are very conscious of her charm, and we know what it is to be under her spell.\n\nBut until then, he says, we shall chant this argument to ourselves like a charm, to keep from falling back in love.", stage: "<p><strong>Notice that he gives poetry a right of reply, and then writes it himself, and does not sign it.</strong> The Republic is a work of literature. It is stuffed with myths, images, invented cities and dying men. It ends in a fairy tale about the afterlife. It defeats the poets with two metaphors ([[ship_of_state|the ship]] and [[great_beast|the beast]]) and an allegory ([[the_cave|the cave]]) which is the most successful piece of imaginative writing in the history of philosophy.</p><p>The ancient gossip \u2014 unverifiable, and irresistible \u2014 says that the young Plato wrote tragedies, and burned them the day he met [[socrates|Socrates]].</p><p><strong>And the emotional argument is better than the metaphysical one, and Plato knows it.</strong> The three-removes theory is easy to attack (Aristotle demolished it within a generation). The claim that <em>watching someone else's grief teaches you how to have your own</em> is not easy to attack at all. It is a claim about what art <em>does to people</em>, and every censor and every defender of art since has been fighting on this ground.</p>", turns: "<p><strong>What turns here is the book's opinion of itself, and it does not resolve it.</strong> A book of philosophy that works entirely by images has just banned working by images. Either Plato is blind to this \u2014 which is not plausible \u2014 or the ban is aimed at something narrower than it sounds, or the whole passage is a test the reader is meant to fail and then notice failing.</p><p><strong>The moment to watch for:</strong> <em>we know what it is to be under her spell.</em> It is the most personal sentence in the Republic. The man expelling [[homer|Homer]] loves Homer, quotes him constantly, knows him by heart, and is telling you that he must repeat the argument to himself like an incantation to stop himself going back.</p><p><strong>And Aristotle's reply, twenty years later, is the one that stuck:</strong> tragedy does not water the passions, it <em>drains</em> them \u2014 pity and fear, roused and then purged. Two men, the same school, the same texts, and diametrically opposite accounts of what happens to you in a theatre. Nobody has settled it since, and every argument about whether violent films make violent people is a rerun.</p>"},
  {bk: "Book 10", g: "the last word", h: "The Myth of Er", s: "And then Socrates says: I have one more thing to tell you \u2014 not a tale of Alcinous, but the tale of a brave man.\n\nEr, the son of Armenius, a Pamphylian, was killed in battle. Ten days later, when the bodies were collected, his was found undecayed. He was carried home. And on the twelfth day, lying on the funeral pyre, he came back to life \u2014 and told them what he had seen.\n\nHis soul, he said, had left him and travelled with many others to a strange place, where there were two openings in the earth, side by side, and two in the sky above them. Between them sat <strong>judges</strong>. The just were sent up, to the right, through the opening in the sky, with a token of their judgement fastened on the front of them. The unjust were sent down, to the left, with their tokens behind.\n\nAnd from the other openings, souls were <em>arriving</em>: some coming up out of the earth, filthy and dusty; some coming down from the sky, clean. And they camped in the meadow like a festival crowd, and greeted each other, and asked for news \u2014 the ones from below weeping as they remembered a thousand years underground, the ones from above telling of unimaginable beauty.\n\nEr does not soften the arithmetic. Every wrong is paid for tenfold, in units of a hundred years. And there is a passage \u2014 a man asking after a great tyrant, and being told that he did not come, and would not come, and how the worst of them were seized at the very mouth of the exit by fiery men who bound them and flayed them and dragged them away over thorns \u2014 that Plato writes without one word of relish, and we shall not add any.\n\nThen the souls travel four days to a place where they see, stretched through heaven and earth, a shaft of light like a rainbow but brighter, and from its ends the <strong>spindle of Necessity</strong>, on which all the heavens turn. Necessity's three daughters sit around it, in white, with garlands, singing \u2014 Lachesis of the past, Clotho of the present, Atropos of what is to come.\n\nAnd an official takes lots and patterns of lives from the lap of Lachesis, and climbs onto a high platform, and says:\n\n<em>Souls of a day. Here begins another circuit of mortal life. Your daemon will not be allotted to you: you will choose your daemon. Let him who draws the first lot choose first the life to which he will be bound of necessity. Virtue has no master; each will have more or less of her as he honours or dishonours her. <strong>The responsibility is the chooser's. God is blameless.</strong></em>\n\nAnd he scatters the lots, and each soul picks up the one that falls beside it. And then the patterns of lives are laid out on the ground \u2014 far more of them than there are souls \u2014 every kind of animal, every kind of human life: tyrannies, some lasting to the end and some collapsing halfway; lives of famous men, and lives famous for beauty or strength or birth; lives of obscure men; lives of women.\n\nAnd here, says Socrates, is the whole risk of being human.\n\nAnd the man who drew the <strong>first lot</strong> came forward, and immediately chose the greatest tyranny \u2014 grasping and glutting at it, and not examining it properly \u2014 and did not notice that it contained, written into it, the eating of his own children, and other horrors. And when he looked at it at his leisure, he beat his breast, and wailed, and blamed chance and the gods and everything except himself.\n\nHe was one of those who had come down <em>from the sky</em>. He had lived his previous life in a well-ordered city and been good \u2014 by habit, without philosophy.\n\nAnd Socrates says: it was mostly the ones from heaven who chose badly, because they had never been trained by suffering. The ones who came up out of the earth, who had been punished and who had watched others punished, took their time.\n\nOdysseus drew the very last lot of all. And the memory of his former labours had cured him of ambition, and he went about for a long time looking for the life of a private man who minded his own business \u2014 and had trouble finding it, because it was lying neglected in a corner, ignored by everyone else. And when he saw it he said that he would have done the same if he had drawn the first lot, and chose it gladly.\n\nThen they went to Lachesis, and each was given the daemon he had chosen, to be the guardian of his life. And they passed under the throne of Necessity, and camped by the River of Forgetfulness, on the Plain of Oblivion, in terrible burning heat, with no trees and nothing growing; and in the evening they were all made to drink a measure of the water, and those without the sense to be careful drank more than the measure, and as they drank they forgot everything.\n\nAnd in the middle of the night there was thunder and an earthquake, and they were all swept up and away, like shooting stars, to be born.\n\nEr was not allowed to drink. And he did not know how, or by what way, he returned to his body \u2014 but he suddenly opened his eyes at dawn, and he was lying on the pyre.\n\nAnd so, [[glaucon|Glaucon]], the story was saved and not lost. And it can save us too, if we believe it \u2014 and we shall cross the River of Forgetfulness well, and not defile our souls.\n\nIf we are persuaded by me, and hold that the soul is immortal and able to bear all evil and all good, we shall always keep to the upward road, and practise [[justice|justice]] with intelligence in every way \u2014 so that we may be friends to ourselves and to the gods, both while we remain here, and when we receive our rewards, like the winners going round to collect them.\n\nAnd so, both here and on that thousand-year journey we have been describing, it shall be well with us.", stage: "<p><strong>The Republic ends with a poem.</strong> One page after [[censorship|escorting Homer out of the city]] for telling untrue stories about the afterlife, Plato has Socrates tell an untrue story about the afterlife \u2014 with fiery men, and a spindle, and singing Fates \u2014 and end the book on it. He is not being careless. Whatever the ban on poetry was, it was not a ban on <em>this</em>.</p><p>The best account is that the difference is in the <em>direction</em>. Homer's afterlife makes men afraid to die and teaches them that the gods are capricious. Er's afterlife says one thing over and over: <strong>the responsibility is the chooser's</strong>. It is a myth designed to make you take yourself seriously, told by a man who has just spent a book explaining that myths make you what you are.</p><p>Note also the shape of the ending. It is a myth <em>and</em> an argument: Socrates has just proved, a few pages earlier, that the soul is immortal, and the myth is the reward for having sat through the proof. Plato gives you the geometry, then the story. He knows which one you will remember.</p>", turns: "<p><strong>Here is the trap, and it is the last thing the book does to you.</strong></p><p>[[glaucon|Glaucon]] made one condition, in Book 2, and made it absolutely: prove that [[justice|justice]] is worth having <em>with all the rewards stripped off</em>. No reputation. No honours. No payment from gods or men. Just the thing itself, in a man being tortured to death with everyone believing him wicked.</p><p>Socrates accepted the terms. And he kept them for eight books.</p><p>And then, on the last pages, he says: <em>and now let us give justice back its wages</em> \u2014 and hands over the reputation, the honours, the prizes from the gods, and a thousand-year payout in the afterlife, with interest.</p><p>Either this is a cheat, and the book pays its bill in a currency it swore not to use \u2014 or the debt was already settled in Book 9 (the just soul is happy <em>in itself</em>, and this is a bonus, and everybody knows it is a bonus, and Plato is allowed a curtain call).</p><p><strong>The moment to watch for, and it is the finest thing in the book:</strong> the man with the first pick who chooses the tyranny. He was <em>good</em>. He came down from heaven. He had lived a decent life in a well-run city \u2014 and he had been good <strong>by habit, without philosophy</strong>, and so, when the whole of eternity was laid out in front of him and he had first choice, he grabbed the shiniest thing on the table and it contained the eating of his own children.</p><p>That is Plato's last word, and it is aimed at the reader: <em>being a nice person who was brought up properly is not enough. You have to actually think about it.</em> It is why the book exists. It is what happened to Athens. And it is the answer, at last, to the man on the road who would not let Socrates go home.</p>"}
];

<script id="app">
/* ============================ RENDER ============================ */
var app = document.getElementById("app");
var pop = document.getElementById("pop");
var scrollMem = {};

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

/* ---- the single linkify pass. every prose surface goes through this. ---- */
function linkify(txt){
  if (txt === undefined || txt === null) return "";
  return String(txt).replace(/\[\[([a-z0-9_]+)\|([^\]]+)\]\]/g, function(m, id, label){
    if (!BYID[id]) return '<span class="lk broken">' + label + " [?" + id + "]</span>";
    return '<a class="lk" data-lk="' + id + '" href="#entity/' + id + '">' + label + "</a>";
  });
}
function paras(txt){
  return String(txt || "").split("\n\n").map(function(p){ return "<p>" + linkify(p) + "</p>"; }).join("");
}
function panelBody(html){ return linkify(html); }
function lede(txt){ return '<p class="lede">' + linkify(txt) + "</p>"; }

function divider(){
  return '<svg class="div" width="150" height="14" viewBox="0 0 150 14" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'
    + '<rect x="0" y="6" width="52" height="1" fill="#332b23"/>'
    + '<rect x="98" y="6" width="52" height="1" fill="#332b23"/>'
    + '<path d="M75 1 C79 5 81 7 81 9.2 C81 11.6 78.3 13 75 13 C71.7 13 69 11.6 69 9.2 C69 7 71 5 75 1 Z" fill="#d97b34"/>'
    + '<path d="M75 5.5 C77 7.6 77.8 8.6 77.8 9.8 C77.8 11.1 76.5 12 75 12 C73.5 12 72.2 11.1 72.2 9.8 C72.2 8.6 73 7.6 75 5.5 Z" fill="#e9c877"/>'
    + "</svg>";
}
function metalTag(t){
  if (t==="major") return '<span class="tag gold">gold</span>';
  if (t==="supporting") return '<span class="tag silver">silver</span>';
  return '<span class="tag bronze">bronze</span>';
}
function det(title, plain, body){
  return "<details><summary>" + esc(title) + (plain ? ' <span class="plain">' + esc(plain) + "</span>" : "")
    + '</summary><div class="dbody">' + body + "</div></details>";
}
function verdictBlock(vs){
  if (!vs) return "";
  var h = '<div class="verdicts"><div class="vh">Three verdicts</div>';
  for (var i=0;i<vs.length;i++){
    h += '<div class="v"><span class="vn">' + esc(vs[i].v) + '</span><span class="vw">' + esc(vs[i].w) + "</span>"
       + '<div class="vt">' + linkify(vs[i].t) + "</div></div>";
  }
  return h + "</div>";
}
function entityCard(e){
  return '<button class="card" data-go="#entity/' + e.id + '">'
    + '<div class="n">' + esc(e.name) + (e.pron ? "<em>" + esc(e.pron) + "</em>" : "") + metalTag(e.tier)
    + (e.stub ? '<span class="stub">stub</span>' : "")
    + '</div><div class="e">' + linkify(e.essence) + "</div></button>";
}

/* ---------------- views ---------------- */
var VIEWS = {};

VIEWS.home = function(){
  return '<div class="orient">'
    + '<p class="kicker">Start here</p>'
    + "<h1>A dinner party that would not end</h1>"
    + '<p class="lede">Under a minute. Then go in anywhere.</p>'
    + divider()

    + "<h2>What this is</h2>"
    + paras("The Republic was written by [[plato|Plato]] (PLAY-toe) in Athens, around 375 BC. It is a conversation \u2014 one night, ten books, no narrator but the speaker himself \u2014 in which his old teacher [[socrates|Socrates]] (SOCK-ruh-teez) is cornered by a room full of clever young men and made to prove that being a good person is worth it.")

    + "<h2>The situation</h2>"
    + paras("Socrates walks down to [[the_piraeus|the port]] to see [[bendis|a foreign goddess's new festival]], is jokingly kidnapped by friends on the road home, and ends up arguing in the house of an arms manufacturer. By dawn he has defined [[justice|justice]], built an imaginary city from nothing, cut the human soul into three, banned poetry, put women in the army, abolished the family, and described how civilisations die.")

    + "<h2>The backstory the book assumes</h2>"
    + paras("Athens has just lost [[peloponnesian_war|a twenty-seven-year war]]. Its democracy has been overthrown by [[thirty_tyrants|a junta of murderers]] \u2014 led, awkwardly, by Plato's own cousin and uncle \u2014 and then restored. And in 399 BC, some years after this dinner party but decades before the book was written, [[trial_of_socrates|that restored democracy will try Socrates and put him to death]].\n\nSo: Plato is writing about justice, in the voice of a man his own city killed, in a house belonging to a man his own family killed. Nothing in the book is neutral.")

    + "<h2>The challenge</h2>"
    + paras("[[glaucon|Glaucon]] (GLAW-kon) \u2014 Plato's actual brother \u2014 refuses to accept the easy answer. He tells a story about [[ring_of_gyges|a ring that makes you invisible]], and asks: strip away every reward, every reputation; torture the just man and crown the unjust one; now tell me which life you would choose. Everything after that is Socrates trying to answer.")

    + "<h2>Why it lasts</h2>"
    + paras("To answer, he builds a city \u2014 and [[kallipolis|the city he builds]] is luminous and monstrous in the same breath. It contains [[the_cave|the most beautiful image in philosophy]] and [[community_children|proposals that read like a blueprint for a police state]]. Twenty-four centuries later nobody has agreed on whether he meant it. That argument is the book's afterlife, and this app stages it rather than settling it.")

    + "<h2>How to use this</h2>"
    + paras("Pick any way in. <strong>The Proof</strong> follows the argument itself, move by move. <strong>The Room</strong> is who is present, and what became of them. <strong>The City</strong> is the thing Socrates builds, laid out as a built object. <strong>Index</strong> is everything, A to Z.\n\nTap any highlighted name for who they are and how to say it. Where the book is genuinely contested you will see <strong>three verdicts</strong> \u2014 Diagram, Blueprint, Warning \u2014 and no tiebreaker.")
    + divider()
    + '<p class="small muted">' + linkify("Spine build. One entity ([[glaucon|Glaucon]]) and three beats are written in full; everything else is an essence-stub, so every lens populates and the feel can be judged before the rest is authored.") + "</p>"
    + "</div>";
};

VIEWS.proof = function(){
  var h = '<p class="kicker">Way in &mdash; the argument</p><h1>The Proof</h1>'
    + lede("The book has a spine, and it is not the ten books \u2014 it is a single argument: a challenge thrown down in Book 2 and paid off, or not, nine books later. Twenty-one moves. Watch it happen.")
    + divider();
  for (var i=0;i<BEATS.length;i++){
    var b = BEATS[i];
    var full = !b.stub;
    h += '<div class="beat' + (full ? " lit" : "") + '">'
      + '<div class="bk">' + esc(b.bk) + "</div>"
      + '<div class="bh">' + esc(b.h) + "</div>"
      + '<div class="bg">' + esc(b.g) + "</div>"
      + '<div class="bs">' + paras(b.s) + "</div>";
    if (b.stage) h += det("How Plato Argues It", "the craft", panelBody(b.stage));
    if (b.turns) h += det("What Turns Here", "the stakes", panelBody(b.turns));
    h += "</div>";
  }
  return h;
};

VIEWS.room = function(){
  var order = ["socrates","glaucon","adeimantus","thrasymachus","polemarchus","cephalus","cleitophon","lysias","niceratus"];
  var h = '<p class="kicker">Way in &mdash; the cast</p><h1>The Room</h1>'
    + lede("One house in the port, one night, eleven or so men. Within twenty-five years the [[thirty_tyrants|junta]] will have killed the host, and the democracy will have killed the guest of honour. Plato knew all of that when he chose the guest list.");
  h += divider() + '<div class="room">';

  h += "</div>" + divider()
    + '<h2>Not in the room, and everywhere in the book</h2><div class="room">'
    + entityCard(BYID.plato) + entityCard(BYID.thirty_tyrants) + entityCard(BYID.trial_of_socrates)
    + entityCard(BYID.athenian_democracy) + entityCard(BYID.the_piraeus)
    + "</div>";
  return h;
};

VIEWS.city = function(){
  var h = '<p class="kicker">Way in &mdash; the artefact</p><h1>The City</h1>'
    + lede("Kallipolis (kah-LIP-oh-liss), the beautiful city, built in speech in a single night. Here it is as a built thing, with its costs shown. This is where the book is fought over \u2014 so this is where the three verdicts live.")
    + divider();
  for (var i=0;i<CITY.length;i++){
    var c = CITY[i];
    h += '<div class="beat lit"><div class="bh">' + esc(c.h) + "</div>"
      + '<div class="bg">' + esc(c.g) + "</div>"
      + '<div class="bs">' + paras(c.s) + "</div>"
      + verdictBlock(c.verdicts) + "</div>";
  }
  return h;
};

VIEWS.index = function(){
  var types = [["character","In the room"],["concept","Ideas and images"],["place","Places"],["object","Objects"],["world","The world around the book"]];
  var h = '<p class="kicker">Way in &mdash; everything</p><h1>Index</h1>'
    + '<p class="lede">Gold, silver, bronze mark how deep each entry goes \u2014 Plato\u2019s own metals, borrowed for the purpose.</p>' + divider();
  for (var t=0;t<types.length;t++){
    var group = ENTITIES.filter(function(e){ return e.type === types[t][0]; })
      .sort(function(a,b){ return a.name.localeCompare(b.name); });
    if (!group.length) continue;
    h += "<h2>" + esc(types[t][1]) + "</h2>";
    for (var i=0;i<group.length;i++) h += entityCard(group[i]);
  }
  return h;
};

VIEWS.entity = function(id){
  var e = BYID[id];
  if (!e) return "<h1>Not found</h1>";

  if (e.pron) h += '<p class="pron">' + esc(e.pron) + "</p>";

  h += '<p class="essence">' + linkify(e.essence) + "</p>";

  if (e.stub){
    h += divider() + '<p class="small muted">Essence-stub. Sections and depth panels are authored in the content batches \u2014 this entry exists so every lens populates and every cross-link resolves.</p>';
  }
  if (e.sections){
    h += divider();
    for (var i=0;i<e.sections.length;i++){
      var s = e.sections[i];

  if (e.verdicts) h += verdictBlock(e.verdicts);

  if (e.rels && e.rels.length){

    for (var r=0;r<e.rels.length;r++){

function showPop(el, id){

  pop.innerHTML = '<div class="pn">' + esc(e.name) + "</div>"
    + (e.pron ? '<div class="pp">' + esc(e.pron) + "</div>" : "")
    + '<div class="pe">' + esc(e.essence.replace(/\[\[[a-z0-9_]+\|([^\]]+)\]\]/g, "$1")) + "</div>"
    + '<button class="pb" data-go="#entity/' + e.id + '">Open ' + esc(e.name) + " &rarr;</button>";
  pop.style.display = "block";
  if (window.innerWidth > 640){
    var r = el.getBoundingClientRect();
    var top = window.scrollY + r.bottom + 8;
    var left = Math.min(window.scrollX + r.left, window.scrollX + window.innerWidth - 302);
    pop.style.top = top + "px";
    pop.style.left = Math.max(12, left) + "px";
  }
  popOpen = true;
}
function hidePop(){ pop.style.display = "none"; popOpen = false; }

/* dismiss consumes its own click, in the capture phase */
document.addEventListener("click", function(ev){
  if (!popOpen) return;
  if (pop.contains(ev.target)) return;
  hidePop();
  ev.stopPropagation();
  ev.preventDefault();
}, true);

document.addEventListener("click", function(ev){
  var lk = ev.target.closest(".lk");
  if (lk && lk.getAttribute("data-lk")){
    ev.preventDefault(); ev.stopPropagation();
    showPop(lk, lk.getAttribute("data-lk"));
    return;
  }
  var g = ev.target.closest("[data-go]");
  if (g){ ev.preventDefault(); ev.stopPropagation(); navTo(g.getAttribute("data-go")); return; }
  var back = ev.target.closest("[data-back]");
  if (back){ ev.preventDefault(); ev.stopPropagation(); navBack(); return; }
  var a = ev.target.closest('a[href^="#"]');
  if (a){ ev.preventDefault(); ev.stopPropagation(); navTo(a.getAttribute("href")); return; }
});
document.addEventListener("mouseover", function(ev){
  if (window.innerWidth <= 640) return;
  var lk = ev.target.closest && ev.target.closest(".lk");
  if (lk && lk.getAttribute("data-lk")) showPop(lk, lk.getAttribute("data-lk"));
});

/* ---------------- routing ----------------
   Self-contained router. Does NOT depend on location.hash: in a sandboxed
   artifact frame (about:srcdoc) hash navigation is a no-op, which silently
   killed every menu link. The URL is now decorative and best-effort only. */
var NAV = [["#home","Start Here"],["#proof","The Proof"],["#room","The Room"],["#city","The City"],["#index","Index"]];
var current = "#home";
var stack = [];

function renderNav(active){
  document.getElementById("nav").innerHTML = NAV.map(function(n){
    return '<a href="' + n[0] + '" data-go="' + n[0] + '" class="' + (active === n[0] ? "on" : "") + '">' + n[1] + "</a>";
  }).join("");
}
function render(hash){
  var parts = hash.replace(/^#/, "").split("/");
  var view = parts[0] || "home";
  var html;
  if (view === "entity") html = VIEWS.entity(parts[1]);
  else if (VIEWS[view]) html = VIEWS[view]();
  else { view = "home"; html = VIEWS.home(); }
  app.innerHTML = html;
  renderNav(view === "entity" ? "" : "#" + view);
}
function navTo(hash, isBack){
  if (!hash || hash === current) { hidePop(); return; }
  hidePop();
  scrollMem[current] = window.scrollY;
  if (!isBack) stack.push(current);
  current = hash;
  render(current);
  window.scrollTo(0, isBack ? (scrollMem[current] || 0) : 0);
  try { if (location.hash !== current) location.hash = current; } catch (err) {}
  try { localStorage.setItem("republic_last", current); } catch (err) {}
}
function navBack(){
  var prev = stack.pop();
  navTo(prev || "#home", true);
}
window.addEventListener("hashchange", function(){
  if (location.hash && location.hash !== current) navTo(location.hash);
});
render(current);
renderNav("#home");
</script>
</body>
</html>
