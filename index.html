    ], beneath: "<p>The deepest question is not <em>is it good?</em> but <em>is it possible?</em> \u2014 and Socrates keeps saying, with a straightness that is impossible to read, that it does not matter. What we are making is a model. If it never exists anywhere on earth, he says, that changes nothing about the argument; and at the very end of Book 9 he adds the line the whole fight turns on: perhaps it is <em>laid up in heaven</em> as a pattern for anyone who wants to look, and whether it exists or ever will exist is of no importance \u2014 for a man will live by the constitution of <em>that</em> city, and no other.</p><p>Read that as a philosopher writing about the soul and Kallipolis is a diagram. Read it as a political theorist writing about a state and it is a blueprint with an alibi. The sentence supports both, and Plato \u2014 who never appears in his own dialogues, and who arranged this entire book as one man's memory of one night \u2014 leaves you holding it.</p>", beyond: "<p>Plato was not content to leave it in heaven. Three times he sailed to Syracuse to try to make a philosopher out of a tyrant. It went catastrophically: intrigue, house arrest, a broken friendship, a war, and Plato lucky to get home alive. Late in life he wrote another, longer, drearier book \u2014 <em>the Laws</em> \u2014 which designs a city again, more practically, with a smaller ambition and a nastier legal code. It is the work of a man who did not think he had been writing fiction.</p><p>The city has been called the first utopia, and the word is a trap: More coined <em>Utopia</em> as a joke (it means <em>no-place</em>). What is undeniable is the shadow. Every designed society since \u2014 every commune, every model village, every five-year plan, every philosopher-king in fatigues \u2014 has been living in a shape that a man in a rented house in the Piraeus drew in one night, out loud, to answer a question about whether he ought to be good.</p>", verdicts: [
      {v: "Diagram", w: "the city-soul reading", t: "It is a magnifying glass, and he tells you so before he builds it. Every proposal is generated by the analogy; none of it is policy. Judge it as a picture of [[the_soul|a well-ordered mind]] and it is not monstrous at all."},
      {v: "Blueprint", w: "the plain reading", t: "Then why the marriage ages, the breeding festivals, the numerology, the exile at ten? Plato specifies. And when the book was done he got on a boat to Sicily and tried it."},
      {v: "Warning", w: "the ironic reading", t: "The philosopher does not <em>want</em> to rule; the city needs [[noble_lie|a lie]] to stand up; and it decays the moment it is finished. Perhaps Plato is showing what perfect unity would cost, so that you will refuse to pay it."}
    ], rels: [
      {id: "justice", label: "the thing it was built to make visible"},
      {id: "the_soul", label: "the small letters it enlarges"},
      {id: "guardians", label: "who rule it"},
      {id: "noble_lie", label: "the story holding it together"},
      {id: "five_regimes", label: "how it dies"},
      {id: "popper", label: "the charge laid against it"}
    ]},
  {id: "plato", name: "Plato", pron: "PLAY-toe", type: "world", tier: "major", themes: [
      "t_power",
      "t_art",
      "t_know"
    ], essence: "An aristocrat who meant to enter politics, watched his own relatives run a terror and his city kill his teacher, and spent the next fifty years writing dialogues instead \u2014 never once appearing in one.", aka: "Son of Ariston and Perictione", sections: [
      {h: "The Life He Did Not Have", body: "He was born about 427 BC into exactly the kind of family that expected to govern. His mother's people were among the oldest in Athens; his stepfather was a democrat; his cousin Critias and his uncle Charmides were aristocrats who would soon be something worse. He was a big, broad-shouldered young man \u2014 <em>Plato</em> may be a nickname meaning <em>broad</em>. He is said to have wrestled, and to have written tragedies, and to have burned them.\n\nAnd he tells us himself, in a late letter, what he had planned. He was young, he says, and full of the ordinary ambition: as soon as he was of age, he would go into politics.\n\nThen [[thirty_tyrants|the Thirty]] took power \u2014 with his own relatives at the head of them \u2014 and invited him in. He watched for a while, and what he saw made the old democracy look like gold. And then the junta ordered [[socrates|Socrates]] to help arrest an innocent man, in order to implicate him; and Socrates simply went home.\n\nThe democracy came back. And Plato thought about politics again. And then the restored democracy took the man he loved most in the world and put him on trial and killed him.\n\nHe was about twenty-eight. He says he was forced to conclude that all existing cities are badly governed, and that the human race would have no rest until either philosophers became kings or kings became philosophers. That sentence is not from the Republic. It is from a letter, about his own life."},
      {h: "What He Did Instead", body: "He travelled: Egypt, Italy, Sicily. In southern Italy he met the Pythagoreans, mathematicians and mystics who believed number was the key to everything, and he came back changed \u2014 half the metaphysics of the Republic has their fingerprints on it.\n\nAround 387 BC he founded [[the_academy|the Academy]], in an olive grove outside the walls, and ran it for forty years. Aristotle walked through the door at seventeen and stayed for twenty.\n\nAnd he tried to build the city. Three times he sailed to Syracuse to make a philosopher out of a tyrant \u2014 first the elder Dionysius, then his nephew Dion, then Dionysius the younger. It was a disaster every time: bored autocrats, palace intrigue, house arrest, a war, a murder. One ancient story has him sold into slavery on the way home from the first trip and ransomed by a stranger. He was in his sixties on the last attempt, and he knew it was hopeless, and he went anyway.\n\nHe wrote until he died at about eighty. The last thing he wrote, the <em>Laws</em>, is a second city \u2014 duller, harsher, more practical, with a real legal code and no [[philosopher_king|philosopher-kings]] in it at all. It is the work of a man who did not think he had been writing fiction the first time."},
      {h: "The Man Who Is Never There", body: "Here is the strangest thing about him, and it is easy to miss because it is a hole rather than a thing.\n\n<strong>Plato never speaks in his own books.</strong> Not once, in a lifetime of writing. Every idea in the entire corpus is in someone's mouth, in a room, on a particular afternoon, spoken to somebody who might disagree. He is named twice in all the dialogues: once as present at Socrates' trial, and once \u2014 in the account of the death \u2014 to say that <em>Plato was ill</em>, and was not there.\n\nSo we do not have Plato's philosophy. We have a very long series of conversations, written by a dramatist, in which a dead man is made to argue. And when you ask what Plato <em>believed</em> \u2014 about [[kallipolis|the city]], about [[noble_lie|the lie]], about the [[community_children|infants]] \u2014 you are asking a question the books are designed not to answer."}
    ], beneath: "<p><strong>Every dispute about the Republic is a dispute about the silence.</strong> If Plato were a treatise-writer, we could quote him. He is not. He is a man who spent fifty years arranging for other people to say things, and who put his own name in his own work exactly once, to note that he was absent.</p><p>Which makes two opposite readings permanently available and permanently unresolvable. Either the dialogue form is a <em>vehicle</em> \u2014 [[socrates|Socrates]] is the mouthpiece, the doctrines are Plato's, and the irony is a rhetorical courtesy \u2014 or the dialogue form is <em>the point</em>: the arguments are put up to be tested, the reader is the third participant, and a man who never asserts anything in his own voice cannot be quoted as asserting it.</p><p><em>We are taking a position, and flagging it:</em> the second reading is more attractive than it is honest. Plato wrote the <em>Laws</em>. He got on the boat to Syracuse. Three times. A man who thought the ideal city was a thought experiment does not spend his sixties trying to install one.</p>", beyond: "<p><strong>He is the only major philosopher whose entire body of work survived.</strong> Every dialogue we know he wrote, we have. Aristotle's polished published works are almost all lost, and what we read are lecture notes; the Presocratics survive as fragments quoted by other people; whole schools have vanished. Plato came through complete, because he never stopped being copied.</p><p>And so the West has been arguing with the same primary text for twenty-four hundred years. Augustine christened him. The Arabic philosophers preserved and extended him while the Latin West forgot him. Renaissance Florence rediscovered him and started a cult. Nietzsche called Christianity <em>Platonism for the masses</em> and meant it as an insult to both. [[popper|Popper]] prosecuted him for the twentieth century's crimes.</p><p>Whitehead's line is famous, and unfair, and mostly right: the European philosophical tradition is a series of footnotes to Plato. A great many of the footnotes are furious.</p>", rels: [
      {id: "socrates", label: "his teacher, and his mouthpiece"},
      {id: "thirty_tyrants", label: "run by his cousin and his uncle"},
      {id: "trial_of_socrates", label: "the event the whole corpus answers"},
      {id: "glaucon", label: "his brother, given the best speech in the book"},
      {id: "the_academy", label: "the school he founded and ran for forty years"},
      {id: "socratic_dialogue", label: "the form he invented and hid inside"}
    ]},
  {id: "the_republic_book", name: "The Book Itself", pron: "", type: "world", tier: "supporting", themes: [
      "t_art",
      "t_justice"
    ], essence: "Ten books, one night, one continuous conversation reported from memory \u2014 and the Greek title is not <em>Republic</em> at all, but <em>Politeia</em>, which means something closer to <em>the constitution of a soul</em>.", sections: [
      {h: "The Object", body: "It was written somewhere around 375 BC, in Plato's middle age, decades after the conversation it describes and decades after every man in the room was dead.\n\nThe division into ten <em>books</em> is not Plato's \u2014 it is a papyrus-roll length, an accident of the technology, and it cuts the argument in places it has no business cutting. Do not use it as a map. [[socrates|Socrates]] narrates the whole thing himself, in the first person, from memory, the day after.\n\nAnd the title is a mistranslation with consequences. The Greek is <em>Politeia</em>: not a form of government but the whole arrangement of a community and the way of life that goes with it \u2014 its constitution in the sense a <em>person</em> has a constitution. Cicero rendered it into Latin as <em>De Re Publica</em>, and we have been calling it <em>The Republic</em> ever since, and the word has been quietly telling readers for two thousand years that this is a book about the state.\n\nIt is a book about a man, that uses a state to see him."}
    ], beneath: "<p>The title is the first thing that misleads you and the [[kallipolis|city]] is the second. Both point at politics. And the actual question, asked on page one and never withdrawn, is: <em>is it worth being a good person?</em> \u2014 which is not a political question at all.</p><p>Read the whole thing as an answer to [[glaucon|Glaucon]], and the political apparatus is a means. Read it as a treatise on the state, and Glaucon's question becomes a charming framing device. The book supports both, and the English title has been putting a thumb on one side of the scale since the sixteenth century.</p>", rels: [
      {id: "socratic_dialogue", label: "the form it is written in"},
      {id: "kallipolis", label: "the city it is not, in fact, about"},
      {id: "glaucon", label: "the man whose question it answers"}
    ]},
  {id: "trial_of_socrates", name: "The Trial of Socrates", pron: "", type: "world", tier: "major", themes: [
      "t_death",
      "t_justice"
    ], essence: "In 399 BC a jury of five hundred and one Athenians condemned [[socrates|Socrates]] for impiety and corrupting the young, and he drank the hemlock rather than leave \u2014 the fact underneath every page of this book.", sections: [
      {h: "The Charge", body: "The indictment, sworn by a man called Meletus and backed by two others, said this: Socrates does wrong by not recognising the gods the city recognises, and by introducing other new divinities; and he does wrong by corrupting the young. The penalty demanded was death.\n\nThe prosecution was almost certainly not about theology. Four years earlier, Athens had come out of a civil war. [[thirty_tyrants|The Thirty]] had murdered fifteen hundred citizens, and the men who led them \u2014 Critias above all \u2014 had spent their youth in Socrates' circle. So had Alcibiades, the glamorous traitor who had defected to Sparta and lost Athens a fleet. The restored democracy had passed an amnesty and could not prosecute anyone for politics.\n\nSo they prosecuted him for religion.\n\nHe was seventy. He had lived in the city all his life, fought in its wars, and refused to break its laws under both regimes. Two hundred and eighty jurors voted to convict, two hundred and twenty-one to acquit \u2014 a majority of about thirty men."},
      {h: "The Sentence He Asked For", body: "Athenian law let the convicted man propose his own penalty, and any sensible defendant proposed exile. Everyone expected it. It is likely the city wanted it \u2014 there is a strong argument that the prosecution's real aim was to get him to leave.\n\nHe told the court that what he actually deserved, for a life spent trying to make his fellow citizens care about their souls, was <em>free meals at public expense in the town hall for the rest of his life</em> \u2014 the honour given to Olympic victors.\n\nThen, prompted by his friends, he offered a fine.\n\nThe jury voted for death by a wider margin than it had voted to convict. He had annoyed men into killing him.\n\nHe spent a month in prison, because a sacred ship was away at Delos and no execution could take place until it returned. His friends bribed the guard and arranged the escape and he refused to go: he had lived under the city's laws for seventy years and taken their protection, and he would not break them the moment they turned on him.\n\nHe drank the hemlock in the evening, with his friends around him, and talked until his legs went numb, and told them not to make a noise, because a man should die in silence.\n\n[[plato|Plato]] was in his twenties, and he was not there. He was ill."}
    ], beneath: "<p><strong>This is the wound the Republic is dressing, and the dressing is very strange.</strong> A city killed a good man for asking questions. And the answer Plato gives, in his greatest book, is [[kallipolis|a city]] in which no one may ask them: the stories are [[censorship|censored]], the foundation is [[noble_lie|a lie]], and [[dialectic|the art of refutation]] is withheld from the young because it makes them believe nothing they were taught.</p><p>That last clause is the charge sheet. It is the prosecution's case against Socrates, restated as policy, in Socrates' own mouth, by the man who loved him most.</p><p><em>We are taking a position:</em> that is not an accident and it is not hypocrisy. It is Plato conceding \u2014 privately, structurally, without ever saying it \u2014 that the Athenians were not simply mad. That a man who teaches clever young men to question everything really might produce a Critias. That his teacher really was dangerous, and was worth it, and that a city which could not survive him was the thing that needed rebuilding.</p><p>Nobody in the Republic says any of this. The book just quietly arranges it, and moves on.</p>", beyond: "<p>We have two contemporary defences \u2014 [[plato|Plato's]] <em>Apology</em> and Xenophon's \u2014 and they do not agree, and both were written by men who adored him. We have no record from the prosecution. We do not know what was actually said in that court.</p><p>What we have instead is one of the founding scenes of Western culture: the good man, condemned by his own people, refusing to save himself, calm at the end. It has been painted (David's <em>Death of Socrates</em>, with the raised finger and the untouched cup), staged, and endlessly rewritten \u2014 and it has been read, unavoidably, alongside another execution of an inconvenient teacher by a nervous establishment, three and a half centuries later.</p><p>And it is the same man [[glaucon|Glaucon]] described in Book 2, as a hypothetical, before the trial had happened in the book's own chronology: the perfectly just man, stripped of his reputation, believed by everyone to be wicked, going to his death. Plato wrote that scene knowing exactly what he was doing.</p>", rels: [
      {id: "socrates", label: "the man they killed"},
      {id: "athenian_democracy", label: "the jury of five hundred and one"},
      {id: "thirty_tyrants", label: "the real charge, which could not be brought"},
      {id: "the_cave", label: "where he predicts it, and moves on"},
      {id: "dialectic", label: "the charge, restated as policy"}
    ]},
  {id: "athenian_democracy", name: "Athenian Democracy", pron: "", type: "world", tier: "major", themes: [
      "t_power"
    ], essence: "Direct rule by several thousand citizen men \u2014 offices filled by lottery, juries in the hundreds, no politicians and no professionals \u2014 the most radical political experiment of the ancient world, and Plato hated it.", sections: [
      {h: "How It Actually Worked", body: "It is nothing like what we call democracy, and the differences all cut the same way.\n\nThere were no elections for most offices. There was a <strong>lottery</strong>. The council that set the agenda, the magistrates, the officials \u2014 chosen by lot from anyone who put his name forward, on the principle that any citizen is competent to govern and that election favours the rich and the famous. (Generals were elected. The Athenians were radical, not suicidal.)\n\nThere were no professional judges and no lawyers. Cases were decided by juries of several hundred ordinary men \u2014 501 at Socrates' trial \u2014 who heard the speeches, voted immediately, and went home. There was no appeal.\n\nAnd the Assembly \u2014 several thousand men on a hillside, meeting forty times a year \u2014 decided war, peace, taxation and the fate of cities by show of hands, on the day, after a debate.\n\nAnd it was ferociously exclusive. Women: no. [[metics|Resident foreigners]] \u2014 including everyone in the house where the Republic is set: no. Slaves, who may have been a third of the population: no. It was the widest political franchise in the ancient world and it was perhaps a sixth of the people living in Attica."},
      {h: "Why He Hated It", body: "Because he watched it do things.\n\nIn 406 BC, after a naval victory, a storm prevented the Athenian generals from recovering the bodies of their own dead. The Assembly \u2014 furious, grieving, in one sitting \u2014 voted to try all six of them together, which was illegal, and executed them. [[socrates|Socrates]] happened to be presiding that day and refused to put the motion. The city regretted it almost immediately.\n\nIn 415 BC the Assembly was talked into invading Sicily by a brilliant young aristocrat, and lost an entire fleet and army, and effectively lost [[peloponnesian_war|the war]].\n\nAnd in 399 BC, five hundred and one of them [[trial_of_socrates|killed his teacher]].\n\nSo when the Republic describes [[ship_of_state|sailors drugging the captain]] and fighting over the tiller, or [[great_beast|a keeper studying the moods of a great animal]] and calling it a science \u2014 the readers knew which ship, and which animal."}
    ], beneath: "<p><strong>Plato's case is not that the crowd is stupid. It is that ruling is a <em>craft</em> \u2014 and that we would not let a show of hands set a broken bone.</strong> Everything in the Republic's politics follows from that analogy, and the analogy is doing all the work.</p><p><strong>The reply he never considers, and which we should put in for him:</strong> the case for democracy was never that the many are wise. It is that <em>nobody can be trusted with power</em>, and that a system in which you can remove bad rulers without bloodshed is worth more than a system that installs the right rulers forever. The Athenians knew perfectly well that assemblies make terrible decisions \u2014 they had a word for the regret. What they would not do is hand the tiller to a man who could not be removed.</p><p>[[kallipolis|Kallipolis]] has no mechanism for removing anybody. That is not a detail. It is the whole argument, and Plato does not answer it because he never asks it.</p>", beyond: "<p><strong>Nearly everything we know about Athenian democracy comes to us through people who despised it.</strong> Plato, Xenophon, Aristotle, Thucydides and the anonymous pamphleteer known as the Old Oligarch were all, in varying degrees, hostile. The democracy's own defence survives in fragments \u2014 a funeral speech, some court oratory, a comedy or two.</p><p>Which is why, for two thousand years, <em>democracy</em> was a term of abuse in European political thought, and why the American founders were at pains to say they were building a republic and not a democracy. The word only became respectable in the nineteenth century. Plato won that argument for a very long time, and he won it partly by outliving the other side's paperwork.</p>", rels: [
      {id: "trial_of_socrates", label: "what it did to him"},
      {id: "five_regimes", label: "where Plato places it: fourth of five"},
      {id: "ship_of_state", label: "the image he made of it"},
      {id: "great_beast", label: "the other image, and the crueller one"},
      {id: "thirty_tyrants", label: "what replaced it, briefly, and worse"}
    ]},
  {id: "thirty_tyrants", name: "The Thirty Tyrants", pron: "", type: "world", tier: "major", themes: [
      "t_power",
      "t_death"
    ], essence: "The junta that ran Athens for eight months in 404 BC, murdered some fifteen hundred people for their property, and was led by [[plato|Plato's]] cousin and his uncle \u2014 and one of their victims owned the house this dialogue is set in.", sections: [
      {h: "Eight Months", body: "Athens surrendered in 404 BC. Sparta pulled down the long walls to the music of flute-girls, and installed thirty men to write a new constitution.\n\nThey did not write one. They began by executing informers and men everyone agreed were scoundrels, and the city was pleased. Then they got a Spartan garrison onto the Acropolis, and disarmed everyone except three thousand approved citizens, and stopped bothering with pretexts.\n\nThey killed, on the usual estimate, around <strong>fifteen hundred people</strong> in eight months \u2014 something like five per cent of the citizen body \u2014 and many of them for no reason except money. When the treasury ran short, they resolved to seize the estates of the wealthy [[metics|resident foreigners]], and each of the Thirty was told to arrest one. The rich metic families of [[the_piraeus|the Piraeus]] were on the list. [[polemarchus|Polemarchus]], in whose house this entire book takes place, was arrested in the street, given no trial, and handed hemlock. They took his factory, his houses, and the earrings out of his wife's ears.\n\nThe leader of the Thirty was <strong>Critias</strong>. He had been a poet and a member of [[socrates|Socrates']] circle. He was [[plato|Plato's]] first cousin once removed. <strong>Charmides</strong>, who ran the Piraeus for them, was Plato's uncle. Both are title characters of Plato's own dialogues.\n\nThe democrats came back over the border in the winter, fought them at the Piraeus, and killed Critias and Charmides in the battle."},
      {h: "What Plato Did About It", body: "He tells us himself, in a letter written half a century later, and it is the most revealing paragraph he ever wrote in his own voice.\n\nHe was a young man. The Thirty were his family and his class, and they invited him in \u2014 and he thought, at first, that they were going to lead the city out of an unjust life into a right way of living, and he watched them eagerly.\n\nAnd within a very short time he found that they made the old democracy look like a golden age.\n\nThe thing that broke it, he says, was Socrates. The Thirty ordered him, along with four others, to go to Salamis and arrest a man named Leon so that he could be executed and they could all be implicated in the killing. Socrates said nothing, and went home. If the regime had not fallen a few weeks later, he would have died for it.\n\nAnd Plato \u2014 who had been about to enter politics \u2014 did not."}
    ], beneath: "<p><strong>Hold the two facts together, because Plato arranged for you to be able to and then never mentioned it.</strong></p><p>The house in which [[socrates|Socrates]] spends this long night proving that it is never right to harm anyone, and that [[justice|justice]] is the health of a soul, belonged to a man whom Plato's own cousin and uncle would murder for his money. Plato <em>chose</em> that house. He chose [[polemarchus|that host]], and [[lysias|his brother]], and [[niceratus|Niceratus]], and he knew what happened to all of them. He wrote the dialogue decades after they were dead.</p><p>And there is not one word about it in the Republic.</p><p>This is the strongest single argument against reading Plato as a naive authoritarian. He had <em>seen</em> rule by a self-appointed aristocracy of the enlightened. It was run by his relatives. It murdered his friends. Whatever [[kallipolis|the beautiful city]] is, it is not written by a man who has never met the alternative \u2014 and the fact that he built it anyway, knowing all this, is either the deepest thing about the book or the most frightening.</p>", beyond: "<p>The Thirty are the reason [[trial_of_socrates|Socrates was killed]], and everyone knew it. The restored democracy passed an amnesty forbidding prosecutions for anything done under the junta, so no one could put Socrates on trial for having taught Critias. They put him on trial for religion instead, and the jury heard the other charge perfectly well.</p><p>They are also the reason the Republic has been read the way it has since 1945. When [[popper|Popper]] accuses Plato of laying the foundations of totalitarianism, the sharpest form of the charge is not that he anticipated something he could not have imagined. It is that he had <em>watched it happen</em>, at close range, in his own family \u2014 and then wrote a book proposing that a small, philosophically trained, unaccountable elite should hold absolute power over a population fed a founding myth.</p><p>The best reply, and it is not nothing: Plato's rulers own no property, take no money, have no families, cannot enrich anyone, and do not want the job. Critias and Charmides wanted the job very much.</p>", rels: [
      {id: "plato", label: "whose cousin and uncle led them"},
      {id: "polemarchus", label: "whom they murdered, in this house"},
      {id: "socrates", label: "who refused their orders and went home"},
      {id: "athenian_democracy", label: "which they overthrew, and which returned"},
      {id: "popper", label: "who says Plato learned nothing from them"}
    ]},
  {id: "peloponnesian_war", name: "The Peloponnesian War", pron: "pell-uh-puh-NEE-zhun", type: "world", tier: "supporting", themes: [
      "t_power",
      "t_death"
    ], essence: "Twenty-seven years of war with Sparta that ended with Athens starved, its walls pulled down to the sound of flutes, and its confidence in itself permanently gone.", sections: [
      {h: "The Long Defeat", body: "It ran from 431 to 404 BC \u2014 the whole of Plato's childhood and youth, and the last third of Socrates' life. Everybody in the room where the Republic is set has lived through it, and most of them are in it.\n\nA plague in the second year killed perhaps a quarter of the population, including Pericles. A truce broke down. In 415 the Assembly was talked into invading Sicily by [[socrates|Socrates']] most brilliant and least trustworthy young friend, Alcibiades \u2014 who then defected to Sparta \u2014 and the entire expedition was destroyed: the fleet burned, the army massacred or worked to death in the quarries. [[niceratus|Niceratus's]] father commanded it and was executed there.\n\nThucydides, who fought in it and wrote it, watched the language itself come apart: words changed their meanings, he says; recklessness was called courage, and prudence was called cowardice, and moderation was called a cloak for cowardice. Whole cities were put to death by vote.\n\nIt ended with a blockade, a famine, and a surrender. The long walls came down to the music of flute-girls, and men said the day was the beginning of freedom for Greece. Then [[thirty_tyrants|the Thirty]] took power."}
    ], beyond: "<p><strong>This is the weather in which every idea in the Republic was formed, and it explains the book's central obsession.</strong> Plato is not writing about how to make a city <em>better</em>. He is writing about how to stop a city <em>tearing itself apart</em> \u2014 and every strange, cold, authoritarian proposal in the book is aimed at <em>faction</em>: the enemy within, the two cities inside one wall, the men who would rather win the argument than save the state.</p><p>He watched a democracy vote itself into a catastrophe, watched an oligarchy murder its way through the survivors, and watched the restored democracy execute the one man he thought was good. He did not conclude that we need better politics. He concluded that politics, as practised by human beings who have not been rebuilt from childhood, is a disease.</p><p>Thucydides drew the same picture and reached the opposite conclusion: that this is simply what human beings are, and that anyone promising to fix it is the next tyrant. Read them together. They are the two possible responses to the same catastrophe, and we have been choosing between them ever since.</p>", rels: [
      {id: "athenian_democracy", label: "which lost it"},
      {id: "thirty_tyrants", label: "what the defeat produced"},
      {id: "the_piraeus", label: "the port that fed the city, and starved"}
    ]},
  {id: "the_piraeus", name: "The Piraeus", pron: "pie-REE-us", type: "place", tier: "supporting", themes: [
      "t_power",
      "t_death"
    ], essence: "Athens' port, five miles downhill: sailors, foreigners, arms factories and imported gods \u2014 and the first word of the Republic is <em>I went down</em>.", sections: [
      {h: "Down There", body: "It is not Athens. It is the place Athens gets its money from, and it feels entirely different: a grid of streets laid out by a town planner, a naval base with three harbours, warehouses, banks, brothels, shipyards, and the largest concentration of [[metics|resident foreigners]] in the Greek world \u2014 Phoenicians, Egyptians, Thracians, Syrians \u2014 with their own gods, their own festivals, and no political rights whatever.\n\nIt was also the beating heart of [[athenian_democracy|the democracy]]. The fleet was rowed by the poorest citizens, and the fleet was what made Athens an empire, and so the poor had a claim on the city that no aristocrat could argue away. The port was the democratic party made of stone. When [[thirty_tyrants|the Thirty]] fell, they fell in a battle <em>at the Piraeus</em>, against democrats coming back over the border.\n\nAnd [[socrates|Socrates]], on the first page, goes <em>down</em> to it \u2014 and the Greek verb is the one used for descending into the land of the dead, and it is the same descent [[the_cave|the philosopher makes back into the cave]], and Plato has chosen it deliberately."}
    ], beneath: "<p>Every detail of the setting is an argument. The definitive Athenian conversation about the perfect state takes place <em>outside the city</em>, in the port, at night, during a festival for a <em>foreign goddess</em>, in the house of a man who is not allowed to own Athenian land \u2014 and it is attended by no one who could vote on any of it.</p><p>And [[the_soul|Leontius]], the man who could not stop himself staring at the executed corpses, was <em>coming up from the Piraeus</em> when it happened, along the outside of the north wall. Plato put the [[the_cave|cave]] at the bottom of a road, and he put a real road under it.</p>", rels: [
      {id: "polemarchus", label: "whose house is here"},
      {id: "metics", label: "the foreigners who made it work"},
      {id: "the_cave", label: "the descent it rhymes with"},
      {id: "bendis", label: "the new goddess whose festival brought them down"}
    ]},
  {id: "bendis", name: "The Festival of Bendis", pron: "BEN-diss", type: "world", tier: "minor", themes: [
      "t_art",
      "t_power"
    ], essence: "A Thracian goddess getting her first Athenian festival \u2014 with a horseback relay race passing torches hand to hand in the dark \u2014 which is the only reason anybody is in the port at all.", sections: [
      {h: "The New Goddess", body: "Bendis was a hunting goddess from Thrace, brought to Athens by the Thracian community in [[the_piraeus|the port]], and the state had recently and quite deliberately granted her cult official status \u2014 partly, most likely, because Athens wanted Thracian allies in [[peloponnesian_war|the war]].\n\nSo the festival Socrates walks down to see is <em>brand new</em>, and half foreign, and he says so: he thought the Athenian procession was fine, and adds, drily, that the Thracians' was no worse.\n\nAnd the thing that makes them stay is the promise of the <strong>torch race on horseback</strong> \u2014 riders galloping in relay through the dark, passing fire from hand to hand without dropping it. Nobody had seen it before.\n\nThe irony is quiet and it is not an accident: the book that will [[censorship|police every story a child hears]] and [[trial_of_socrates|whose hero will be executed for introducing new gods]] opens at a party for an imported deity that Athens has just voted in."}
    ], rels: [
      {id: "the_piraeus", label: "where her festival is held"},
      {id: "trial_of_socrates", label: "the charge: introducing new divinities"}
    ]},
  {id: "metics", name: "Metics and Slaves", pron: "MET-icks", type: "world", tier: "supporting", themes: [
      "t_power",
      "t_justice"
    ], essence: "The resident foreigners who paid Athenian taxes, fought in Athenian wars, could own no Athenian land, and could be killed by an Athenian government that wanted their money \u2014 and slaves, who were perhaps a third of everybody.", sections: [
      {h: "Present, and Not Counted", body: "A <em>metic</em> was a free foreigner living permanently in Athens. He paid a special poll tax, served in the army, needed a citizen sponsor to appear in court, and could never own land or a house outright \u2014 which is why metic money went into workshops and banking and trade, and why the richest of them were often richer than the citizens who despised them.\n\n[[cephalus|Cephalus's]] family were metics. Their money came from a shield factory in [[the_piraeus|the Piraeus]] employing something like a hundred and twenty slaves. They were, in every way but the legal one, Athenian aristocracy.\n\nAnd when [[thirty_tyrants|the Thirty]] needed cash, the metics were the obvious target, because killing them cost nothing. [[polemarchus|Polemarchus]] was given hemlock without a charge or a hearing. His brother [[lysias|Lysias]] escaped over a roof.\n\nAnd underneath everyone: <strong>the slaves</strong>. Perhaps a third of the people in Attica. The boy who grabs Socrates' cloak on the first page is one. They appear in the Republic as they appear in Athenian life \u2014 constantly, in passing, unremarked \u2014 and the book that spends ten books asking what [[justice|justice]] is never once asks whether they have any claim on it."}
    ], beneath: "<p><strong>Say the uncomfortable thing plainly: the Republic has slaves in it, and never notices.</strong> [[kallipolis|The beautiful city]] is described down to the marriage ages and the musical modes, and the question of whether human beings may be owned does not arise. Aristotle at least had the grace to construct an argument for it, and a bad one. Plato does not bother.</p><p>And the setting sharpens it into something almost unbearable. The men in this room are arguing, all night, about whether it is ever right to harm anyone \u2014 in a house built on a shield factory worked by slaves, owned by a family with no political rights, in a city that will shortly kill them for their money.</p><p>Nobody planned that irony. Plato simply chose the house, and the house came with everything in it.</p>", rels: [
      {id: "cephalus", label: "the metic whose house this is"},
      {id: "polemarchus", label: "killed for being one"},
      {id: "thirty_tyrants", label: "who killed him for it"},
      {id: "the_piraeus", label: "where they lived"}
    ]},
  {id: "the_sophists", name: "The Sophists", pron: "SOFF-ists", type: "world", tier: "supporting", themes: [
      "t_power",
      "t_know"
    ], essence: "Travelling professionals who sold the art of winning arguments to ambitious young men \u2014 Plato's lifelong enemies, and the reason [[thrasymachus|Thrasymachus]] demands his fee before he will say a word.", sections: [
      {h: "The Men Who Charged", body: "They were the first professional teachers in Europe, and they were a symptom of [[athenian_democracy|the democracy]]. In a city where anyone could speak in the Assembly and every man argued his own case in court, the ability to <em>persuade</em> was the ability to survive \u2014 and a whole industry grew up to sell it.\n\nThey taught rhetoric, argument, grammar, the analysis of poetry, and how to make the weaker case appear the stronger. They were often brilliant. Protagoras said that man is the measure of all things, and that he did not know whether the gods existed. Gorgias argued that nothing exists, and if it did we could not know it, and if we knew it we could not communicate it \u2014 possibly as a joke, and he was paid handsomely either way.\n\nAnd they took <strong>money</strong>, and this is the thing Plato cannot forgive. [[socrates|Socrates]] taught for nothing, in the street, and died poor. The sophist arrived in town, filled a hall, charged a fee, and left. To Plato that is not a difference in business model. It is the difference between someone who wants the truth and someone who is selling a weapon."}
    ], beneath: "<p><strong>We know them almost entirely through the man who hated them</strong>, which is a fact worth carrying. Their books are gone. What survives is a set of characters in Plato's dialogues \u2014 vain, greedy, easily flustered, and always defeated \u2014 and the word <em>sophist</em>, which has meant <em>cheat</em> in every European language ever since. It is the most complete character assassination in intellectual history.</p><p>The real charge underneath is a philosophical one, and it is the same charge the Republic runs on. If [[thrasymachus|Thrasymachus]] is right, and [[justice|justice]] is just what the powerful find convenient, then rhetoric is the only political skill there is, and the sophist is simply an honest technician. Everything Plato builds \u2014 [[the_forms|the Forms]], [[form_of_good|the Good]], the immortal soul \u2014 exists to establish that there is <em>something to be right about</em>. Take that away and the sophists win by default.</p><p>Which is why they are still here. Every argument about whether truth is anything more than the winning position is a rerun.</p>", rels: [
      {id: "thrasymachus", label: "the trade's most famous character"},
      {id: "great_beast", label: "what Plato says they actually teach"},
      {id: "socrates", label: "who did the same thing for free, and was killed for it"}
    ]},
  {id: "homer", name: "Homer's Authority", pron: "", type: "world", tier: "supporting", themes: [
      "t_art",
      "t_death"
    ], essence: "For a Greek, Homer was scripture, school, and national memory in one object \u2014 which is what makes [[censorship|throwing him out of the city]] not a literary judgement but a demolition.", sections: [
      {h: "What He Was", body: "Not a novelist. Not an author on a shelf. [[homer|Homer]] was the thing every Greek had in common.\n\nBoys learned to read on him, and memorised him \u2014 some of them the whole of it. Men quoted him in court to settle a point of law, the way an English lawyer once quoted the Bible. Cities cited him to prove their claims to territory. He was the closest thing the Greeks had to a common religion, since they had no church, no creed, and no priesthood: what everyone knew about the gods, they knew because Homer said it.\n\nAnd [[socrates|Socrates]] calls him \u2014 without irony, and with real love \u2014 the teacher and leader of Greece.\n\nAnd then he cuts him. Out go the gods at war, the gods who lie, the heroes who weep. Out, by name, goes the greatest thing ever said in Greek about death: Achilles in the underworld saying he would rather be a landless man's slave on earth than king of all the dead. It is true, and it is beautiful, and it will make soldiers afraid to die, and so it is the first thing on the fire."}
    ], beneath: "<p><strong>The quarrel is old and Plato says so \u2014 and he is on the losing side, and he knows it.</strong> He calls it the ancient quarrel between philosophy and poetry, quotes the abuse the poets have thrown at philosophers for generations, and clearly enjoys it. And then he says the most personal sentence in the Republic: if poetry can make a defence of herself, we shall gladly hear it, <em>for we are very conscious of her charm, and we know what it is to be under her spell</em>. And until then we must repeat this argument to ourselves like an incantation, to keep from falling back in love.</p><p>That is a man who knows Homer by heart, quotes him on every other page, and is arguing himself out of something he cannot stop wanting. The censorship is not the act of a man who is indifferent to poetry. It is the act of an addict.</p>", rels: [
      {id: "censorship", label: "the policy he is the victim of"},
      {id: "myth_of_er", label: "the poem Plato writes anyway, on the last page"},
      {id: "paideia", label: "the education he used to be"}
    ]},
  {id: "socratic_dialogue", name: "The Dialogue as a Form", pron: "", type: "world", tier: "supporting", themes: [
      "t_art",
      "t_know"
    ], essence: "Plato invented a genre in which the author never speaks, every idea belongs to a character, and the man himself can never be pinned down \u2014 which is exactly why we are still arguing about what he meant.", sections: [
      {h: "The Form, and the Hiding Place", body: "There is no narrator. There is no thesis paragraph. There is no author's voice. There is a room, and some men, and an afternoon, and an argument \u2014 and everything you are told, you are told by somebody with a temper and a stake.\n\nAnd it is not a decoration on the philosophy. It <em>is</em> the philosophy. Watch what the form does: it makes every idea answerable to a person who might reject it; it lets a bad argument be <em>felt</em> as bad by the reader before it is refuted; it makes the reader the third man in the room. You cannot skim a dialogue for its conclusion, because the conclusion is not where the work happened.\n\nThe Republic is a peculiar case even by Plato's standards. It is not a scene at all \u2014 it is [[socrates|Socrates]] narrating, the next day, from memory, in the first person, the entire ten-book conversation, including everyone else's defeats and his own jokes. You are inside his head for four hundred pages, and there is no way out."}
    ], beneath: "<p><strong>Every fight about the Republic is a fight about the form.</strong> If the dialogue is a <em>vehicle</em>, then [[socrates|Socrates]] is a mouthpiece and Plato is on record: he wants the [[noble_lie|lie]], the [[censorship|censorship]], and [[philosopher_king|the philosopher-king]]. If the dialogue is <em>the point</em>, then the arguments are put up to be tested, the reader is meant to resist, and quoting Plato as endorsing anything is a category error.</p><p>And [[plato|he never speaks in his own voice]]. Not once, in a lifetime of writing. He is named twice in the whole corpus, and the second time is to record that he was <em>not there</em> when Socrates died.</p><p>So the honest answer is that the form makes certainty impossible \u2014 and that this is either the most sophisticated thing about the book or the most convenient. It should be held against the ironic readers, who are usually the cleverest people in the room, that Plato also wrote the <em>Laws</em>, and got on the boat to Syracuse three times.</p>", rels: [
      {id: "plato", label: "the man who is never in it"},
      {id: "socrates", label: "the voice he speaks through"},
      {id: "censorship", label: "the poetry the form is made of"}
    ]},
  {id: "the_academy", name: "The Academy", pron: "", type: "world", tier: "supporting", themes: [
      "t_know"
    ], essence: "The school Plato founded in an olive grove outside the walls, which ran for nearly three centuries, taught Aristotle for twenty years, and is the ancestor of every university you have ever seen.", sections: [
      {h: "The Grove", body: "It took its name from the place: a public park about a mile outside the walls, sacred to a hero called Academus, with olive trees and a gymnasium. Plato bought land nearby around 387 BC and taught there for the rest of his life.\n\nWhat it actually did is less clear than we would like. There were no fees and no degrees. There was mathematics \u2014 a great deal of it, and the story that the door said <em>let no one ignorant of geometry enter</em> is late and probably false and entirely in character. There was [[dialectic|dialectic]], conducted as argument rather than lecture, which is what you would expect from a man who wrote nothing but conversations. There was, apparently, political consultancy: cities wrote to the Academy asking for constitutions and lawgivers, and it sent them.\n\nAristotle arrived at seventeen and stayed twenty years, until Plato died \u2014 and then left, and founded a rival, and spent the rest of his life disagreeing.\n\nIt survived, in various forms, for some nine hundred years, until the Emperor Justinian closed the philosophical schools of Athens in AD 529."}
    ], beyond: "<p>The word survived better than the thing: <em>academy</em>, <em>academic</em>, and \u2014 by a long and slightly comic route through the Renaissance \u2014 every institution that has ever put a laurel on a certificate.</p><p>What is genuinely traceable is the shape: a permanent community, outside the state, funded independently, teaching by argument rather than dictation, where mathematics is foundational and the point is to produce people who can think rather than people who can do a job. Every research university in the world is a descendant, and most of them would fail Plato's entrance requirement.</p>", rels: [
      {id: "plato", label: "who founded it and ran it for forty years"},
      {id: "dialectic", label: "what was actually done there"},
      {id: "transmission", label: "how the text survived long enough to reach us"}
    ]},
  {id: "popper", name: "The Charge Against Plato", pron: "", type: "world", tier: "major", themes: [
      "t_power"
    ], essence: "Writing in exile while Europe burned, Karl Popper named Plato the first totalitarian \u2014 and the fight over whether that is a slander or a diagnosis is now part of the book.", aka: "Karl Popper, and the twentieth-century prosecution", sections: [
      {h: "The Charge", body: "Popper wrote <em>The Open Society and Its Enemies</em> in New Zealand between 1938 and 1943, and called it his war effort. It is the most sustained attack ever made on a philosopher, and its first volume is about [[plato|Plato]].\n\nThe indictment: that the Republic is not a beautiful dream but the founding document of the closed society. That it proposes a rigid caste system justified by [[noble_lie|a racial myth about metals]]. That it puts an unaccountable elite in permanent power with no mechanism for removing them. That it demands state control of [[community_children|breeding]], [[censorship|art]], [[paideia|education]] and thought. That it treats change as decay and criticism as disease. And that it is built on a lie \u2014 admitted, in the text, as a lie \u2014 told to the population by its rulers for their own good.\n\nAnd Popper's deepest charge is about a <em>question</em>. Plato asks: <em>who should rule?</em> And Popper says that is the question that produces tyranny \u2014 because it assumes the problem of politics is finding the right master. The real question is: <strong>how do we arrange things so that bad rulers can be removed without violence?</strong>\n\nAsk that, and [[kallipolis|Kallipolis]] does not merely fail. It has no answer at all."},
      {h: "The Defence", body: "It has been made, at length, and by serious people, and it is not nothing.\n\n<em>He is not describing a state.</em> The city is a [[the_soul|magnifying glass for the soul]], announced as such before it is built, and reading it as a policy proposal is like reading a diagram of the digestive system as a menu.\n\n<em>The rulers get nothing.</em> No property, no gold, no house, no family, no wealth to pass on. They rule in shifts and would rather be doing philosophy. No totalitarian elite in history has resembled this in any particular.\n\n<em>The caste is not hereditary.</em> [[noble_lie|The myth of the metals]] explicitly demands that the ruler's bronze son be demoted and the smith's golden son promoted. It is an attack on aristocracy, written by an aristocrat.\n\n<em>Popper is reading backwards.</em> He is a man writing in 1943, and he finds 1943 in a text from 375 BC, and some of what he finds he brought with him. He quotes selectively; classicists have been complaining about his citations for eighty years.\n\nAnd the counter-reply, which is the hardest sentence in this argument: [[thirty_tyrants|Plato had seen it]]. A junta of the enlightened few, led by his own family, murdering fifteen hundred people. He watched it. And he wrote this anyway."}
    ], beneath: "<p><strong>This app takes a position, and it is this: both sides are right about what they are looking at, and they are looking at different things.</strong></p><p>Popper is right that the <em>machinery</em> of Kallipolis \u2014 the lie, the eugenics, the censorship, the unaccountable elite, the [[five_regimes|treatment of change as decay]] \u2014 is the machinery of the closed society, and that the resemblance is not an accident of translation. Anyone who tells you that a state which takes newborns from their mothers and hides some of them in an unspeakable place is <em>merely a metaphor</em> has stopped reading.</p><p>And Plato's defenders are right that the <em>spirit</em> is the opposite of totalitarian: that a ruler who must be dragged to power, owns nothing, and cannot pass anything to a child he does not know he has, is not a Nazi and not a commissar, and that no regime which has ever cited him has kept a single one of the conditions he set.</p><p>What is <em>not</em> available is the comfortable middle: <em>he did not really mean it.</em> He wrote the <em>Laws</em>. He sailed to Syracuse three times. He specified the marriage ages.</p>", beyond: "<p>The prosecution did not begin in 1943. It runs from Aristotle (who thought the abolition of the family would produce not unity but indifference \u2014 what is everyone's child is nobody's) through the Enlightenment, and Popper simply gave it a war to be fought in.</p><p>And the defence has been just as loud. Leo Strauss, reading Plato at almost exactly the same moment and out of the same catastrophe, concluded the opposite: that the Republic is the greatest argument <em>against</em> political idealism ever written \u2014 a demonstration, by reductio, of what perfect justice would cost, aimed at curing the reader of the desire for it. Two exiles from the same fire, reading the same book, and reaching opposite verdicts.</p><p>Which is why the argument is not decorative. The Republic is the text on which the West works out what it thinks about expertise, authority, and whether there is such a thing as being right about how to live. It has never been settled, and this app is not going to settle it \u2014 it is going to make sure you can see the fight.</p>", verdicts: [
      {v: "Diagram", w: "the city-soul reading", t: "Popper prosecuted a policy document that was never written. The city is a picture of [[the_soul|a mind]], and its author says so before he builds it."},
      {v: "Blueprint", w: "Popper", t: "The caste system, the myth, the breeding, the censorship, the unremovable elite. He meant it, and men who meant it read him."},
      {v: "Warning", w: "Strauss", t: "It is a reductio. Plato shows you the price of perfect unity precisely so that you will refuse to pay it \u2014 and the tragedy is how many readers have gone to the counter."}
    ], rels: [
      {id: "kallipolis", label: "the city he prosecutes"},
      {id: "philosopher_king", label: "the question he says is the disease"},
      {id: "noble_lie", label: "the centrepiece of the charge"},
      {id: "thirty_tyrants", label: "the thing Plato had already seen"}
    ]},
  {id: "transmission", name: "How the Text Reached Us", pron: "", type: "world", tier: "minor", themes: [
      "t_art",
      "t_know"
    ], essence: "Copied by hand for a thousand years, lost to the Latin West, kept alive in Byzantine Greek and Arabic, and printed at last in Venice in 1513 \u2014 the survival was never guaranteed.", sections: [
      {h: "How It Got Here", body: "For most of European history, western Europe did not have the Republic. It had a fragment of one dialogue in Latin, and Plato at second hand through Augustine, and that was almost all. The man who dominated the medieval mind was Aristotle \u2014 and he arrived, in the twelfth century, translated from <em>Arabic</em>.\n\nThe Greek text survived in Byzantium, copied by hand, generation after generation, by scribes who mostly disagreed with it. It survived in the Islamic world too: al-Farabi wrote a treatise on the virtuous city that is unmistakably [[kallipolis|Kallipolis]] with a prophet in the philosopher-king's chair, and Averroes wrote a commentary on the Republic that survives only in Hebrew, because the Arabic original is lost.\n\nIt came back west with Greek scholars fleeing the fall of Constantinople in 1453. Marsilio Ficino translated the whole of Plato into Latin in Florence under Medici patronage, and the Greek text was printed by Aldus Manutius in Venice in 1513.\n\nThe oldest complete manuscript we have was written in the ninth century AD \u2014 roughly twelve hundred years after Plato put down the pen."}
    ], rels: [
      {id: "plato", label: "whose entire corpus, uniquely, survived"},
      {id: "the_academy", label: "closed by imperial decree in AD 529"},
      {id: "the_republic_book", label: "the object that came through"}
    ]}
];

/* ---------- THE PROOF: the argument chain ---------- */
var BEATS = [
  {bk: "Book 1", g: "the descent", h: "I Went Down", s: "The first word of the book is <em>kateb\u00e9n</em> \u2014 <em>I went down</em>. Socrates went down, yesterday, to [[the_piraeus|the Piraeus]], with [[glaucon|Glaucon]], to pray to [[bendis|the new goddess]] and to see how they would run her festival, since this was the first time it had ever been held. He thought the local procession was fine. The Thracians', he says drily, was no worse.\n\nThey had prayed and watched and were setting off back up the road to the city when a slave boy caught hold of his cloak from behind and said: Polemarchus asks you to wait.\n\nSocrates turned round. Where is your master?\n\nComing up behind you. Wait.\n\nAnd [[polemarchus|Polemarchus]] arrives with a crowd of young men \u2014 Glaucon's brother [[adeimantus|Adeimantus]], Niceratus, others \u2014 and does not so much invite Socrates as detain him. Either you prove stronger than all of us, he says, or you stay here.\n\nThere is a third possibility, says Socrates: we could persuade you to let us go.\n\nAnd could you persuade us, says Polemarchus, if we refuse to listen?\n\nNo, admits Glaucon. Then take it, says Polemarchus, that we shall not listen.\n\nThey sweeten it \u2014 there will be a torch race on horseback in the evening, torches passed from hand to hand at the gallop, and an all-night festival worth seeing. Socrates gives in. It seems, he says, that we must stay.\n\nAnd they go into the house of a wealthy foreigner, in the port, and the doors close, and the book begins.", stage: "<p><strong>Nothing here is decoration.</strong> Plato has opened with a scene, not a proposition, and every detail of it is load-bearing.</p><p><em>I went down.</em> The Greek verb is the one used for descending into the underworld, and it is the same movement the philosopher must make at the end of [[the_cave|the Cave]] \u2014 back down into the dark, to rule people who would rather kill him. The book's first word is its last argument.</p><p><em>Force or persuasion.</em> [[polemarchus|Polemarchus]] jokes that he will not listen, so he cannot be persuaded, so Socrates must stay. It is charming and it is the entire problem of the Republic in four lines: what do you do about people who will not hear the argument? Socrates spends nine books answering, and his answer involves censorship, a founding myth, and a lottery. On page one, force wins and everyone laughs.</p><p><em>The setting.</em> Not the city. [[the_piraeus|The port]] \u2014 loud, commercial, full of foreigners, sailors and imported gods \u2014 and the house of a rich [[metics|resident alien]] who cannot own Athenian land. Plato has put the definitive Athenian conversation about the ideal state outside the walls, in a house belonging to a man with no political rights at all.</p>", turns: "<p><strong>What turns here is the mood.</strong> This is the only comfortable page in the book. Everyone is friendly, the festival is on, there are horses and torches, and nobody has said anything frightening yet. Plato is establishing exactly what will be lost.</p><p><strong>The moment to watch for:</strong> the torch race. Riders passing fire from hand to hand at the gallop, in the dark, without dropping it \u2014 which is, as it happens, a fair description of what a teacher does, and of what this whole book is trying to do, and of what will fail spectacularly when [[trial_of_socrates|the city kills the man holding the torch]].</p><p><strong>And the irony nobody in the room can see:</strong> of the men now walking cheerfully into that house, at least two will be executed by [[thirty_tyrants|a junta]] led by the cousin and uncle of the boy's youngest brother \u2014 who is not in the room, who is writing all this, and who has never once mentioned it.</p>"},
  {bk: "Book 1", g: "the first answer", h: "An Old Man's Comfort", s: "They find [[cephalus|Cephalus]] indoors, sitting on a cushioned chair with a garland on his head; he has just come from a sacrifice in the courtyard. He is very old, and delighted, and immediately scolds Socrates for not coming down to see him more often.\n\nSocrates, who is genuinely fond of him, asks the question he apparently likes asking old men: what is it like? Is age the hard road people say it is?\n\nAnd Cephalus gives the best answer of the evening. Most men, he says, get together and grumble \u2014 they miss the drink and the parties and the sex, and they say they are dying because of old age. But they are blaming the wrong thing. If it were old age, it would do the same to him, and it has not. As for the loss of desire, he quotes Sophocles, who was asked as a very old man whether he could still make love to a woman and answered: <em>Most gladly did I escape it \u2014 like escaping from a savage and raging master.</em>\n\nOld age brings peace, he says. You are released.\n\nThen he adds the honest part, unprompted. It also helps to be rich. And what wealth is really <em>for</em>, he says \u2014 and here the tone changes and he is not making conversation any more \u2014 is that a man who has never cheated anyone and never left a debt unpaid can go to his death without fear. When a man begins to think he is going to die, he begins to be frightened about things he laughed at when he was young. The stories about what is done to the wicked down there start to trouble him. And he lies awake and counts up his life; and if he finds a great many wrongs in it, he wakes from his sleep terrified, like a child.\n\nSo: [[justice|justice]] is telling the truth, and paying what you owe.\n\nSocrates picks it up as gently as he can. Suppose a friend, sane, lends you a weapon; and later goes out of his mind and asks for it back. Nobody would say you should return it \u2014 and nobody would say you were obliged to tell him the whole truth, either.\n\nCephalus laughs and says: quite true.\n\nThen your definition is not right.\n\nAnd Cephalus says \u2014 pleasantly, with no fuss at all \u2014 that he must go and see to the sacrifices, and that he hands the argument over to [[polemarchus|Polemarchus]], who is his heir in this as in everything else.\n\nAnd he walks out of the room, and out of the book.", stage: "<p><strong>Plato is doing character work that novelists would not manage for another two thousand years.</strong> Cephalus is not a straw man. He is given dignity, a genuinely wise answer about age, the best quotation in Book 1, and the only serenity anyone will feel for the next nine books. Then he is dismantled in two sentences and leaves to do something pious.</p><p>Watch the exit itself, because it is the joke and the point at once: the unexamined life does not <em>argue</em>. It excuses itself, courteously, and goes to church.</p><p>The sacrifice frames the whole scene \u2014 he is garlanded when they come in, and he leaves to finish the ritual. His piety is real and completely untroubled by thought, and Plato lets both of those things be true.</p>", turns: "<p><strong>The first definition falls, and it falls on a technicality \u2014 deliberately.</strong> Socrates does not refute Cephalus's <em>way of life</em>. He refutes a rule. The madman's sword shows that <em>pay your debts</em> cannot be the whole of [[justice|justice]], because there are cases where paying it would be monstrous. That is not a deep objection. It is a demonstration that Cephalus has never needed one.</p><p><strong>The moment to watch for:</strong> his description of the old man waking in the night. It is the first appearance in the book of the idea that will end it \u2014 that what [[myth_of_er|happens to a soul after death]] might be the thing that finally settles whether it was worth being good. Socrates will spend ten books refusing to use that argument, insisting that justice must pay <em>in itself</em>, with no rewards \u2014 and then, on the very last page, he will use it.</p><p><strong>And the irony:</strong> Cephalus's whole moral position is that a rich man can die owing nothing to anyone. Within a generation the state will confiscate every coin he owns, murder [[polemarchus|his son]] without a trial, and steal the earrings from his daughter-in-law's ears. <em>Pay what you owe</em> has no answer to a city that decides it owes you nothing.</p>"},
  {bk: "Book 1", g: "the second answer", h: "Help Your Friends, Harm Your Enemies", s: "[[polemarchus|Polemarchus]] inherits the argument, and immediately upgrades it with a line of poetry \u2014 which is how a Greek settled a moral question. Simonides said that [[justice|justice]] is giving each man what is owed to him.\n\nSocrates says that Simonides was a wise man and a divine one, but that he is being obscure, as poets are. He can't have meant <em>return the sword to the lunatic</em>. So what did he mean?\n\nPolemarchus, helpfully: he meant that what friends owe each other is something good, never something bad.\n\nGood. Now \u2014 what art gives what to whom? Medicine gives drugs to bodies; cookery gives seasoning to food. So what does justice give, and to whom?\n\nAnd Polemarchus, walking cheerfully forward, says: it gives benefit to friends and harm to enemies.\n\nThis is not cynicism. This is the ordinary decent morality of the entire ancient world \u2014 the thing the poets taught, the thing fathers told sons, the thing no Greek had ever thought to question. Repay kindness with kindness and injury with injury; a man who lets an enemy walk away unhurt is not a saint, he is a fool.\n\nSocrates takes it apart in three moves, and each one is quieter than the last.\n\n<em>First:</em> when is a just man actually <em>useful</em>, then? In war, presumably. But in peacetime, for a partnership \u2014 a business deal, a game of draughts, laying bricks \u2014 you want the specialist, not the just man. So is justice only useful for things when they are <em>not</em> being used? Money in a warehouse? Polemarchus admits it is looking a little thin.\n\n<em>Second:</em> can you tell your friends from your enemies? You mean the men who <em>seem</em> good to you. But men are wrong about that all the time. So on your definition, a just man will spend his life doing good to bad men who fooled him, and harm to good men he mistook \u2014 and the better he is at being just, the more damage he will do.\n\n<em>Third \u2014</em> and this is the one that matters. Does anything, when it is harmed, become <em>better</em>? A harmed horse becomes a worse horse. A harmed dog, a worse dog. And a man harmed becomes a worse man \u2014 which is to say, less just.\n\nSo: is it the function of the just man to make other men unjust? Can heat produce cold, or dryness produce wet? Can goodness produce harm?\n\nIt does not appear so, says Polemarchus.\n\nThen it is never just to harm anyone at all.\n\nAnd Polemarchus \u2014 an agreeable man, who has been agreeing all evening \u2014 says: I think you are right, Socrates. He does not appear to notice that he has just surrendered the moral code of his entire civilisation.", stage: "<p><strong>Watch the method, because this is the <em>elenchus</em> in its purest form.</strong> Socrates asserts nothing. He asks a series of questions, each of which is easy and safe to answer, and the answers assemble themselves into a wall the answerer has built across his own road. Nobody is ever told they are wrong. They discover it.</p><p>Note also how he uses the <em>crafts</em> \u2014 doctors, pilots, cooks, farmers, shipwrights. He does it constantly, and it is not a stylistic tic. The craftsman is Socrates' model of what knowledge looks like: a skill with an object, a standard, an expert, and an answer. He is quietly setting up the assumption on which the entire Republic will eventually rest \u2014 <strong>that ruling is a craft like any other, with experts and amateurs</strong>. Once you grant that, [[philosopher_king|the philosopher-king]] is coming, and there is nothing you can do about it.</p>", turns: "<p><strong>Something enormous just happened and Plato slid it past you.</strong> <em>It is never just to harm anyone</em> \u2014 not an enemy, not a criminal, not a foreigner. No Greek said this. Homer did not say it. The tragedians did not say it. It is a rupture with the entire ethical inheritance of the Greek world, and it arrives in the middle of a friendly chat, agreed to by a man who does not realise what he has conceded.</p><p><strong>The moment to watch for:</strong> the horse. <em>A harmed horse becomes a worse horse.</em> The argument only works if being harmed and being made <em>worse in your own excellence</em> are the same thing \u2014 and that identification is the seed of everything to come. It is why [[justice|justice]] will eventually turn out to be a kind of health, and why injustice will turn out to be its own punishment, and why [[the_tyrant|the tyrant]] will be the most wretched man alive rather than the happiest.</p><p><strong>And the wound:</strong> the man who established that it is never right to harm anyone was, twenty-five years later, killed by his own city \u2014 and the man in whose house he said it was killed by a regime run by [[thirty_tyrants|the family of the man writing it down]].</p>"},
  {bk: "Book 1", g: "the real opponent", h: "Thrasymachus Attacks", s: "He has been coiling for some time. Twice he has tried to break in and the others have held him back, and now that they have stopped for breath he cannot hold himself any longer. He gathers himself and springs at them like a wild beast, and everyone in the room flinches.\n\nWhat is this drivel, Socrates? Why are you two knuckling under to each other? If you really want to know what justice is, stop asking questions and answer one. And don't tell me it is the right, or the beneficial, or the profitable, or the advantageous \u2014 I want it clear and precise, and I will not put up with that kind of rubbish.\n\nSocrates says, mildly, that he is being forbidden the answer even if it happens to be true. Then he says the thing that always disarms the room: we are not doing this badly on purpose. If we were hunting for gold we would not defer to each other; but we are hunting for justice, which is worth more than a great deal of gold, and we are simply not good enough at it. Pity us; don't be angry.\n\nThrasymachus laughs. It is a sarcastic laugh, and it is the last time he is fully in control of the conversation. First, he says, my fee. When they have paid him he delivers it, flat: [[justice|justice]] is nothing other than the advantage of the stronger.\n\nEach regime, he explains, makes the laws that suit itself \u2014 a democracy makes democratic laws, a tyranny tyrannical ones \u2014 and then announces that obeying them is justice and punishes anyone who does not. Justice is a word rulers use for their own convenience. And Socrates walks straight into the crack: do rulers ever make a mistake? Do they ever pass a law that damages them? Thrasymachus, cornered, retreats to the ruler in the strict sense \u2014 the one who, precisely insofar as he rules, never errs.\n\nBut he will not be tidied. He comes back harder, and this time he is talking about the world as it actually is. You are so far off, Socrates, that you do not even know sheep from shepherd. You think shepherds fatten the flock for the sheep's sake. Rulers look at their people the way a farmer looks at livestock, and the just man everywhere comes off worse than the unjust: in contracts, in taxes, in office. And when injustice is done wholesale \u2014 when a man takes not one citizen's money but the whole city and its people at once \u2014 nobody calls him a criminal. They call him happy and blessed. That is a tyrant. Injustice, done big enough, is a virtue.\n\nAnd then he tries to leave, having poured that over their heads like a bath-attendant emptying a bucket. They will not let him go.\n\nWhat follows is Socrates at work \u2014 the doctor, the pilot, the flute-player, every craft caring for its object and not for itself; is the unjust man wiser and better than the just; is injustice stronger, or does a gang of thieves also need justice among themselves to steal anything at all. The questions come one at a time, each one easy to answer, and each answer a step further onto ice. Thrasymachus answers shorter and shorter. He starts saying whatever will end the sentence. And then, says Socrates \u2014 reporting all this himself, hours later, deadpan \u2014 I saw something I had never seen before.\n\nThrasymachus blushing.", stage: "<p>This is the <strong>elenchus</strong> \u2014 the cross-examination, Socrates' one and only tool. He never asserts. He asks a series of small questions, each of which the answerer feels safe agreeing to, until the answerer discovers he has agreed to the opposite of what he said. It is not a proof of anything; it is a demolition. Watch how often Socrates says 'do you agree?' and how rarely he says 'here is the truth'.</p><p>Watch also the theatre. Plato is a dramatist as much as a philosopher: [[thrasymachus|Thrasymachus]] is given a physical entrance (he springs; the room recoils), a sneer, a fee, sweat, and a blush. Nobody in Greek philosophy before this had a body.</p><p>Book 1 ends in <em>aporia</em> \u2014 stuck, no answer. Socrates says outright that he has behaved like a greedy man at a banquet, snatching at every dish, and that he still does not know what justice is. That is the standard ending of Plato's <em>early</em> dialogues, and many scholars think Book 1 was written years earlier as a self-contained piece and later bolted onto the front of the Republic. Read it that way and the rest of the book is Plato's mature answer to his younger self.</p>", turns: "<p><strong>Thrasymachus is the position the entire book exists to defeat</strong> \u2014 and he loses on <em>form</em>, not on substance. Socrates has shown that Thrasymachus can be tangled in his own words. He has not shown that the tyrant is unhappy, or that the just man's life is better, or that anyone would refuse [[ring_of_gyges|the ring]].</p><p>The blush is the hinge. It is the moment the argument wins and the book knows it has not. Which is precisely why, three pages later, [[glaucon|Glaucon]] refuses to accept the victory and starts the whole thing over from the beginning \u2014 with the same argument, better made, by someone who does not believe it.</p>"},
  {bk: "Book 2", g: "the challenge", h: "The Ring of Gyges", s: "[[glaucon|Glaucon]] is not satisfied, and he says so. You have not persuaded me, Socrates \u2014 you have only charmed the snake. And then he does something extraordinary for a man who is about to spend eight books agreeing with you: he takes [[thrasymachus|Thrasymachus's]] argument, which he does not believe, and makes it far better than its owner ever could.\n\nFirst he sorts the goods. Some things we want purely for themselves \u2014 harmless pleasure, joy. Some we want for themselves <em>and</em> for what they bring \u2014 knowing things, seeing, being well. And some we want only for what they bring: exercise, medicine, earning a living. Nobody wants those for their own sake. Where, he asks, does [[justice|justice]] go? Socrates says: the finest class \u2014 the second, wanted both for itself and for its results. Glaucon says: that is not what anybody actually thinks. Everyone in this city puts justice in the third class, with medicine. A necessary unpleasantness. A cost.\n\nSo he argues it. The story people tell, he says, is that doing wrong is naturally good and suffering it is naturally bad, and since most of us can suffer more than we can inflict, we settle. We make a contract. We call the contract justice, and we obey it not because it is good but because we are too weak to get away with the alternative. Justice is a compromise, and nobody makes a compromise gladly.\n\nAnd then he tells the story of the ring.\n\nA shepherd, out with his flock in Lydia, feels the ground shake. A chasm has opened. He climbs down into it. There is a bronze horse, hollow, with little doors in its side, and inside the horse a corpse \u2014 bigger than human \u2014 wearing nothing at all except a gold ring. He takes the ring and climbs out. Later, at the shepherds' monthly meeting, sitting among the others, he happens to turn the setting of the ring towards himself, and the men next to him begin talking about him as though he had left. He turns it back and they see him again. He tests it once more to be sure. Then he gets himself onto the delegation going up to the palace, and when he gets there he seduces the queen, and with her help murders the king, and takes the kingdom.\n\nNow, says Glaucon, suppose there were two such rings, and the just man wore one and the unjust man the other. No one, he says, is iron-willed enough to keep his hands off other men's goods when he could take them from the market without fear, walk into any house and sleep with anyone he liked, kill or release whom he pleased, and go among men as a god. The two would converge. They would end in exactly the same place. And this proves, he says, that no man is just willingly \u2014 only under compulsion, only because he is watched \u2014 and that a man who kept his hands clean with that ring on his finger would be considered by anyone who knew about it not admirable but a fool.\n\nHe is not finished. To judge properly, he says, we must compare the two lives at their extremes. So take everything away from the just man except justice itself. Give him a reputation for wickedness so total that he is hated all his life. He must be, Glaucon says \u2014 and here the room goes quiet \u2014 whipped, racked, bound, burned in the eyes, and at the last, having suffered every evil, impaled. And let the unjust man have the perfect opposite: the reputation of a saint, offices, honours, marriages, rich friends, and enough money to buy the gods off at the altar.\n\nNow, Socrates. Which of the two is happier?\n\n[[adeimantus|Adeimantus]] cannot let it stand there and adds the worse half. It is not just that people praise injustice, he says. It is that nobody has <em>ever</em> praised justice for its own sake \u2014 not the poets, not the fathers, not the priests. They praise the <em>reputation</em>: the offices it wins, the marriages, the good name. And when they mention the gods, they say the gods can be bought \u2014 ther
