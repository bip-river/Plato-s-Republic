<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>The Republic &mdash; A Companion</title>
<style>
:root{
  --cave:#0e0c0a;
  --stone:#171310;
  --stone2:#1f1a15;
  --line:#332b23;
  --fire:#d97b34;
  --ember:#8f3c1c;
  --sun:#e9c877;
  --sunpale:#f2e6cc;
  --text:#e3dacb;
  --muted:#9b8e7c;
  --shadow:#5f5648;
  --maxw:720px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
  color:var(--text);
  font-size:17px;
  line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.disp{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:.01em}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:40;
  background-color:#100d0b;
  border-bottom:1px solid var(--line);
  padding:10px 14px 0;
}
.brand{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.brand .t{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:19px;color:var(--sunpale)}
.brand .s{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
nav::-webkit-scrollbar{display:none}
nav a{
  flex:0 0 auto;padding:8px 12px 9px;font-size:13.5px;letter-spacing:.04em;
  color:var(--muted);text-decoration:none;border-bottom:2px solid transparent;white-space:nowrap;
}
nav a.on{color:var(--sun);border-bottom-color:var(--fire)}

main{max-width:var(--maxw);margin:0 auto;padding:22px 16px 90px}

/* ---------- shared ---------- */
.kicker{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--fire);margin:0 0 6px}
h1{font-size:29px;line-height:1.18;margin:0 0 4px;color:var(--sunpale)}
h2{font-size:21px;margin:34px 0 10px;color:var(--sunpale)}
.pron{font-size:13.5px;color:var(--sun);font-style:italic;margin:0 0 14px}
.essence{font-size:19px;line-height:1.5;color:var(--sunpale);font-family:"Iowan Old Style",Palatino,Georgia,serif;margin:14px 0 4px}
p{margin:0 0 14px}
.muted{color:var(--muted)}
.small{font-size:14px}

/* divider: firelight between two shadows */
.div{display:block;margin:26px auto;opacity:.75}

/* ---------- cards ---------- */
.card{
  background-color:#171310;border:1px solid var(--line);border-radius:10px;
  padding:14px 15px;margin:0 0 10px;cursor:pointer;
  display:block;width:100%;text-align:left;color:inherit;font:inherit;
}
.card:hover{border-color:#4a3d2f}
.card .n{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:17.5px;color:var(--sunpale)}
.card .n em{font-style:normal;color:var(--sun);font-size:13px;font-style:italic;margin-left:7px}
.card .e{font-size:14.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.tag{
  display:inline-block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--shadow);border:1px solid var(--line);border-radius:3px;padding:1px 6px;margin-left:6px;vertical-align:2px;
}
.tag.gold{color:var(--sun);border-color:#54432a}
.tag.silver{color:#b9bcc0;border-color:#3d4145}
.tag.bronze{color:#b98055;border-color:#4a3527}

/* ---------- beats ---------- */
.beat{border-left:2px solid var(--line);padding:0 0 22px 16px;margin-left:6px;position:relative}
.beat:before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background-color:#3a3025;border:2px solid #100d0b}
.beat.lit:before{background-color:var(--fire)}
.beat .bk{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--shadow)}
.beat .bh{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:18px;color:var(--sunpale);margin:2px 0 2px}
.beat .bg{font-size:13px;color:var(--fire);font-style:italic;margin-bottom:6px}
.beat .bs{font-size:15.5px;line-height:1.62}
.beat .bs p{margin:0 0 12px}

/* ---------- disclosure ---------- */
details{border:1px solid var(--line);border-radius:8px;margin:8px 0;background-color:#141110}
details[open]{background-color:#171310}
summary{
  list-style:none;cursor:pointer;padding:10px 13px;
  font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--sun);
  display:flex;align-items:center;gap:8px;
}
summary::-webkit-details-marker{display:none}
summary:before{content:"+";color:var(--fire);font-size:15px;line-height:1}
details[open] summary:before{content:"\2212"}
summary .plain{text-transform:none;letter-spacing:0;color:var(--muted);font-size:12.5px;font-style:italic}
.dbody{padding:2px 14px 12px;font-size:15.5px}

/* ---------- verdicts ---------- */
.verdicts{margin:16px 0;border:1px solid #3a2c1e;border-radius:10px;overflow:hidden;background-color:#15110e}
.verdicts .vh{padding:9px 13px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fire);border-bottom:1px solid #3a2c1e;background-color:#1a1410}
.v{padding:11px 13px;border-bottom:1px solid #241d17}
.v:last-child{border-bottom:none}
.v .vn{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:15px;color:var(--sunpale)}
.v .vw{font-size:12px;color:var(--shadow);margin-left:6px}
.v .vt{font-size:14.5px;color:var(--muted);margin-top:3px;line-height:1.55}

/* ---------- links / popover ---------- */
.lk{color:var(--sun);border-bottom:1px dotted #6d5730;cursor:pointer;text-decoration:none}
.lk:hover{color:var(--fire);border-bottom-color:var(--fire)}
.lk.broken{background:#ff0055;color:#fff;padding:0 3px}
#pop{
  position:absolute;z-index:60;width:290px;max-width:calc(100vw - 24px);
  background-color:#1c1712;border:1px solid #4a3b28;border-radius:10px;
  padding:12px 13px;box-shadow:0 14px 40px rgba(0,0,0,.72);display:none;
}
#pop .pn{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:17px;color:var(--sunpale)}
#pop .pp{font-size:12.5px;color:var(--sun);font-style:italic;margin-top:1px}
#pop .pe{font-size:14px;color:var(--muted);margin-top:7px;line-height:1.5}
#pop .pb{margin-top:10px;background:none;border:1px solid #4a3b28;color:var(--fire);
  border-radius:6px;padding:6px 10px;font:inherit;font-size:12.5px;cursor:pointer;width:100%}
@media (max-width:640px){
  #pop{position:fixed;left:0!important;right:0;bottom:0;top:auto!important;width:100%;max-width:100%;
    border-radius:14px 14px 0 0;border-bottom:none;padding:16px 18px 26px}
}

/* ---------- misc ---------- */
.back{background:none;border:1px solid var(--line);border-radius:6px;color:var(--muted);font:inherit;font-size:13px;padding:6px 11px;margin-bottom:16px;cursor:pointer}
.back:hover{color:var(--sun)}
.rel{display:flex;gap:9px;align-items:baseline;padding:9px 0;border-bottom:1px solid #211b16;cursor:pointer}
.rel:last-child{border-bottom:none}
.rel .rn{color:var(--sun);font-size:15px;white-space:nowrap}
.rel .rl{color:var(--muted);font-size:14px}
.lede{font-size:16.5px;color:var(--muted)}
.orient h2{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--fire);margin:26px 0 6px;font-family:inherit;font-weight:600}
.room{display:grid;grid-template-columns:1fr;gap:10px}
.after{font-size:13.5px;color:var(--ember);margin-top:6px;font-style:italic}
.stub{font-size:11px;color:var(--shadow);letter-spacing:.1em;text-transform:uppercase;margin-left:6px}

/* ================= BULLETPROOF DARK (must stay last) ================= */
html{color-scheme:dark;background-color:#0e0c0a!important;background:#0e0c0a!important}
body{color-scheme:dark;background-color:#0e0c0a!important;background:#0e0c0a!important;position:relative}
body::before{
  content:"";position:fixed;top:0;left:0;right:0;bottom:0;
  background-color:#0e0c0a;z-index:-1;pointer-events:none;
}
header{background-color:#100d0b!important}
#pop{background-color:#1c1712!important}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="t">The Republic</span><span class="s">Plato &middot; a companion</span></div>
  <nav id="nav"></nav>
</header>
<main id="app"></main>
<div id="pop" role="dialog"></div>

<script id="data">
/* ============================ DATA ============================ */

var THEMES = [
  {id:"t_justice", n:"Justice", e:"Does it pay to be good when nobody is looking?"},
  {id:"t_soul",    n:"The Soul", e:"A city is a person written in letters large enough to read."},
  {id:"t_know",    n:"Knowledge", e:"The difference between seeing a shadow and seeing a thing."},
  {id:"t_power",   n:"Power", e:"Who should rule, and why they must not want to."},
  {id:"t_art",     n:"Art and Lies", e:"Poetry is banished; the book is full of poetry."},
  {id:"t_death",   n:"Death", e:"The argument keeps ending at a corpse."}
];

var ENTITIES = [
  {id: "glaucon", name: "Glaucon", pron: "GLAW-kon", type: "character", tier: "major", aka: "Son of Ariston; Plato's elder brother", themes: [
      "t_justice",
      "t_soul",
      "t_power"
    ], essence: "Plato's own brother, and the man who breaks the book in half: he takes the cynic's argument away from the cynic, rebuilds it stronger than its owner could, and dares [[socrates|Socrates]] to answer it.", sections: [
      {h: "Before the Argument", body: "He is a young Athenian aristocrat of the best kind and the most dangerous kind: brave, quick, competitive, musical, fond of Homer and of beautiful boys, and entirely certain that he is going to matter. Athens produced this young man by the dozen. Some of them became generals. Some of them became [[thirty_tyrants|the men who ran the terror]].\n\nHe is also, in real life, Plato's older brother \u2014 son of Ariston, of one of the oldest families in the city. That is not a small thing to notice. When Plato sat down decades later to write the longest argument of his life, he set it in a house in the port and he put his own brother in the room, and he gave him the best lines. Whatever else [[the_republic_book|the book]] is, it is also a man trying to reach his family.\n\nWhen we meet him he has already spent an evening watching [[thrasymachus|Thrasymachus]] get taken apart. He is not impressed."},
      {h: "The Restart", body: "[[socrates|Socrates]] thinks he is finished. Thrasymachus has been reduced to sullen monosyllables and is sitting there sweating, and Socrates \u2014 who never claims to win anything \u2014 says the evening has been a feast at which he has tasted every dish and enjoyed none, because he still does not know what justice is.\n\nGlaucon will not let him leave. You have not persuaded me, he says. You have charmed the snake, not killed it.\n\nThen he does the thing that makes him unforgettable. He sorts goods into three kinds: the ones we want for themselves (harmless joy), the ones we want both for themselves and their results (health, sight, thinking), and the ones we want only for what they get us \u2014 medicine, money-making, drudgery. Socrates says justice belongs in the best class, the second. Glaucon says: nobody believes that. Everybody in this city believes justice is in the third class \u2014 a chore we put up with for the payoff, and would drop in a heartbeat if the payoff could be got without it.\n\nAnd then he says he will argue that case himself. He does not believe it. He wants Socrates to have something worth beating."},
      {h: "The Ring", body: "He tells a story. A shepherd in the service of the king of Lydia is out with the flocks when an earthquake opens a chasm in the ground. He climbs down. Inside is a hollow bronze horse, and inside the horse a corpse, larger than a man, wearing nothing but a gold ring. He takes the ring.\n\nAt the shepherds' meeting he happens to twist the setting inward, and the men beside him start talking about him as though he were not there. He twists it back and they see him again. He tests it, twice, to be sure. Then he arranges to be sent to the palace as a messenger, seduces the queen, murders the king with her help, and takes the kingdom.\n\nNow, says Glaucon, give one ring to a just man and one to an unjust man. Watch them converge. They will walk through the same market and take the same goods, open the same doors, kill the same enemies. And a man who refused \u2014 who kept his hands off with the ring on his finger \u2014 would be thought, by anyone who knew, not admirable but an idiot.\n\nThe claim underneath is colder than [[thrasymachus|Thrasymachus]] ever managed: nobody is just willingly. We are just because we are watched."},
      {h: "The Two Portraits", body: "He is not done. To test justice properly you have to isolate it \u2014 so strip the just man of everything justice usually buys. Take away his reputation. Let him be thought the worst man in the city while being the best. He will be, Glaucon says with terrible calm, whipped, racked, bound, burned in the eyes, and finally impaled \u2014 and he will learn that one should not wish to be just, but to seem it.\n\nMeanwhile give the unjust man perfect cover: honours, offices, marriages, rich friends, the gods squared with expensive sacrifices.\n\nNow, Socrates. Which life?\n\nEvery reader from Athens onward has heard something in that portrait. The early Christians heard a description of the Cross, written four centuries early. Others hear something nearer to home: [[trial_of_socrates|a good man condemned by the city he served]], with the crowd sure he deserved it. Plato is writing this with his teacher's corpse in the next room."},
      {h: "The Climber", body: "After Book 2 the book belongs to Glaucon. It is Glaucon who walks the whole ascent \u2014 who is beside Socrates for [[the_sun|the Sun]], [[divided_line|the Line]], [[the_cave|the Cave]], the long descent through the dying regimes to [[the_tyrant|the tyrant]], and out the far side into [[myth_of_er|the story of the dead]].\n\nHe is the ideal listener because he is not docile. He calls the first sketch of the city a city of pigs. He complains that the rulers are being cheated of happiness. He is the one who, shown [[the_cave|the underground chamber and the shadows on the wall]], says: a strange image, and strange prisoners. And gets told: they are like us."}
    ], beneath: "<p>The engine of the book is also its trap. Glaucon asks a precise question \u2014 <em>is justice worth having with a ring on your finger, when nothing can touch you?</em> \u2014 and what he gets back is an answer about the health of the soul in a well-ordered city. Those are not obviously the same question. The man with the ring was never asked to live in [[kallipolis|Kallipolis]]. He was asked whether he could be talked out of the ring.</p><p>Say the uncomfortable thing: Socrates' final proof is that the unjust soul is <em>internally</em> wretched, a mob of appetites with a tyrant on top. That is a real answer, and it may even be true. But it changes the subject from <em>getting away with it</em> to <em>what it costs inside</em>, and it leans hard on a picture of the soul that Socrates has just built himself, out of the city he just built himself. Glaucon never objects. He is, in the end, the brother Plato wanted, not the sceptic he invented.</p><p>The other reading of Glaucon is biographical and it is bleak. He is exactly the profile of the gifted, ambitious, unmoored young Athenian who kept turning up in juntas \u2014 Alcibiades, Charmides, [[thirty_tyrants|Critias]]. Plato watched his own relatives do it. The Republic can be read as a very long, very late attempt to give that young man a reason not to.</p>", beyond: "<p><strong>The ring outlives the book.</strong> It is the ancestor of every thought experiment about invisibility and every fantasy about a ring that corrupts the wearer \u2014 Tolkien knew his Plato; H.G. Wells's invisible man goes the way Glaucon says he will; and the ring is still the first thing handed to undergraduates on their first day of ethics. It works because it is not really about magic. It is about the internet, the tax return, the empty office.</p><p><strong>The tortured just man</strong> was read by early Christian writers as an unwitting prophecy of the crucifixion, which is one of the stranger afterlives any pagan paragraph has had. Read it instead against [[trial_of_socrates|399 BC]] and it stops being mystical and starts being furious.</p><p><strong>Glaucon and Adeimantus were real men</strong>, and by the time Plato wrote them into eternity they were almost certainly dead. Socrates says of them, early on, that something divine must be in them, since they can argue the case for injustice so well and still not believe it. That is a brother's compliment, delivered through a dead man's mouth.</p>", rels: [
      {id: "socrates", label: "the man he dares to answer"},
      {id: "adeimantus", label: "his brother, who doubles the challenge"},
      {id: "ring_of_gyges", label: "his image, and the book's hardest question"},
      {id: "thrasymachus", label: "whose argument he steals and improves"},
      {id: "plato", label: "his younger brother, writing him"},
      {id: "the_cave", label: "the ascent he walks beside Socrates"}
    ]},
  {id: "socrates", name: "Socrates", pron: "SOCK-ruh-teez", type: "character", tier: "major", themes: [
      "t_justice",
      "t_know",
      "t_death"
    ], essence: "The barefoot old man who claims to know nothing, dismantles everyone who claims otherwise, builds an entire city out of talk in a single night \u2014 and will be executed by [[athenian_democracy|his own city]] a few years after this dinner party.", aka: "Son of Sophroniscus, of the deme Alopece", sections: [
      {h: "Before the Argument", body: "He is about sixty, and he is a fixture. Everybody in Athens knows him: the stonemason's son with the flat nose and the pot belly, going barefoot in the frost, standing motionless in the street for hours when a thought catches him, buttonholing generals and poets and teenagers in the marketplace to ask them what courage is, or piety, or beauty \u2014 and then, gently and completely, taking their answers apart.\n\nHe fought in [[peloponnesian_war|the war]] as an ordinary infantryman and by all accounts was good at it. He held public office once and nearly got himself killed refusing to put an illegal motion to the vote. When [[thirty_tyrants|the junta]] later ordered him to help arrest an innocent man, he went home instead, and would have died for it if the regime had lasted another month.\n\nHe never wrote a word. Not one. Everything we have of him was written by other people who loved him or laughed at him, and the largest share by [[plato|Plato]] \u2014 which means that the man speaking here is at least partly a character, and the question of how much is the oldest problem in the subject."},
      {h: "The Man Telling This Story", body: "It is worth stopping on a technical oddity, because it changes how the book sounds. The Republic is not a scene. It is Socrates, the next day, telling somebody the whole thing from memory \u2014 all ten books of it, every interruption, every blush, in the first person.\n\nSo everything you read is his account of a conversation he won. He reports his own arguments and other men's defeats. He tells you, deadpan, that he had never seen [[thrasymachus|Thrasymachus]] blush before. He is generous, and he is not neutral, and Plato has arranged it so you can never step outside his head.\n\nIt begins with him going down to [[the_piraeus|the port]] \u2014 and the Greek word for that descent is the same one used for going down into the land of the dead. The first word of the book is a warning."},
      {h: "The Method", body: "He does not lecture. He asks. The technique is called the <em>elenchus</em> \u2014 the cross-examination \u2014 and it works like this: get a man to state a definition, get him to agree to two or three innocent-looking things, then show him that his innocent agreements have quietly demolished his definition. He never claims to know the answer himself. He says he is only helping.\n\nIt is devastating and it makes people furious, which is roughly what he was killed for. [[thrasymachus|Thrasymachus]] calls it a coward's trick: you refuse to say anything, so you can never be caught saying anything wrong.\n\nAnd Socrates half agrees. He ends Book 1 by announcing that he has behaved like a greedy man at a banquet, snatching at every dish and tasting none, and that after all that he still does not know what [[justice|justice]] is. That is where the early Socrates always ends: nowhere, honestly."},
      {h: "And Then He Changes", body: "Watch what happens after [[glaucon|Glaucon]] restarts the argument. The man who knows nothing begins to know a great deal.\n\nHe knows the structure of [[the_soul|the human soul]]. He knows the correct constitution of a city, down to the marriage rules. He knows there is [[the_forms|a realm of unchanging realities]] behind the visible world, and that [[form_of_good|one of them]] is the source of everything. He has a curriculum, a founding myth, a censorship policy, and a report from beyond the grave.\n\nSomewhere between Book 1 and Book 2 the ventriloquist changes hands. The Socrates who questioned everything becomes a Socrates with a system \u2014 and the system is Plato's."},
      {h: "What Happens to Him", body: "In 399 BC, a few years after the night in this house, Athens put him on trial for refusing to recognise the city's gods and for corrupting the young. Five hundred and one citizens sat in judgement. He was convicted by a modest margin, refused to propose exile, suggested instead that the city ought to feed him at public expense for the rest of his life, and was condemned to death by a wider one.\n\nHe drank the hemlock in the prison, with his friends around him, and talked until his legs went numb.\n\n[[plato|Plato]] was in his twenties. He wrote for another fifty years, and he never once put himself in a dialogue, and he never stopped writing Socrates."}
    ], beneath: "<p><strong>Is the Socrates of this book Socrates at all?</strong> The historical man, as far as anyone can reconstruct him, was a destroyer: he refuted, he never built, and his one claim was that he knew nothing. The speaker of Books 2 to 10 has metaphysics, psychology, epistemology, and a constitution. Most readers take the seam to fall around the start of Book 2, and take everything after it to be Plato using a beloved dead man as a mouthpiece.</p><p><em>We are taking a position by saying that, and we are flagging it.</em> A serious minority of readers disagree, and hold that the irony never switches off \u2014 that Socrates is <em>still</em> being Socratic all the way through, and that the city is a reductio he expects you to reject. Read Book 5 and decide for yourself whether the man is deadpan or in earnest. He gives you no help.</p><p><strong>The thing this app will not tidy:</strong> Socrates was killed by a city that could not tolerate a man who asked questions. And in [[kallipolis|the city he designs in this book]], nobody may ask questions. Poetry is [[censorship|censored]], the founding story is [[noble_lie|a lie]], [[dialectic|the art of refutation]] is withheld from anyone under thirty because it makes the young unruly \u2014 and it is impossible to read that clause without thinking of the charge sheet at his trial. Plato's answer to the execution of Socrates is a city in which Socrates would have been arrested. Nobody in the book says so.</p>", beyond: "<p><strong>Three Socrateses survive.</strong> [[plato|Plato]]'s, who is a genius and grows into a metaphysician. Xenophon's, who is a decent, rather pious old gentleman with sensible views on household management. And Aristophanes', who in a comedy staged while Socrates was alive and sitting in the audience is hoisted about the stage in a basket, teaching students to argue their way out of debts. He was famous enough to satirise twenty-four years before he was famous enough to kill.</p><p>Reconciling them is called <strong>the Socratic problem</strong>, and it has no solution. What survives him is not a doctrine \u2014 he had none \u2014 but a method and a death. The method became philosophy. The death became something closer to a passion narrative: the good man, condemned by his own people, calm at the end, refusing to save himself. Which is exactly the man [[glaucon|Glaucon]] describes, three pages into Book 2, as a hypothetical.</p>", rels: [
      {id: "glaucon", label: "who dares him to prove it"},
      {id: "thrasymachus", label: "who calls his method a cheat"},
      {id: "plato", label: "his student, and his ventriloquist"},
      {id: "trial_of_socrates", label: "what the city did to him"},
      {id: "the_cave", label: "his image, and his own obituary"},
      {id: "kallipolis", label: "the city he builds in a night"},
      {id: "polemarchus", label: "his host, and a fellow victim"}
    ]},
  {id: "adeimantus", name: "Adeimantus", pron: "add-ay-MAN-tus", type: "character", tier: "major", themes: [
      "t_justice",
      "t_art",
      "t_power"
    ], essence: "[[glaucon|Glaucon]]'s brother, who lands the quieter and far nastier blow: nobody, he says, has ever praised justice itself \u2014 only what it looks like, and what it earns.", aka: "Son of Ariston; Plato's elder brother", sections: [
      {h: "The Second Blow", body: "[[glaucon|Glaucon]] has just finished. He has told the story of [[ring_of_gyges|the ring]], stripped the just man naked, and impaled him. Socrates is opening his mouth to answer when Adeimantus says: surely that is not the whole case?\n\nAnd he lands the worse half.\n\nGlaucon's argument was about what people <em>do</em>. Adeimantus's is about what people <em>say</em> \u2014 and specifically about what they say to children. Listen, he says, to how fathers and schoolmasters and poets recommend justice. Not one of them ever praises the thing itself. They praise the good name it wins you: the offices, the marriages, the public respect. Even the gods, they promise, will reward you \u2014 with a good harvest and a long line of descendants, and, if you believe the more enthusiastic poets, an eternity of drunkenness in the afterlife.\n\nSo the whole culture has been quietly making the wrong case for two hundred years. It has been praising the <em>reputation</em>. And a clever boy who listens to it draws the only sane conclusion: what I need is not to be good. What I need is to look good."},
      {h: "The Gods Can Be Bought", body: "And then he goes further, and it is the coldest passage in the first half of the book. Suppose the boy is worried about divine punishment. Fine \u2014 the culture has an answer for that too.\n\nThere are men, he says, going from door to door with a pile of books, offering rituals and incantations that will absolve you of any crime, for a modest fee, with the authority of the poets behind them. If the gods can be bribed \u2014 and every respectable Athenian institution says they can \u2014 then the last obstacle is gone.\n\nSo make yourself, he says, a sketched facade of virtue on the outside, and behind it drag the cunning, shape-shifting fox.\n\nAnd then he sets the brief, and it is the sentence the rest of the book has to satisfy. Nobody, Adeimantus says, has ever said what [[justice|justice]] and injustice actually <em>do</em> \u2014 to the soul that has them, unseen by gods and men. Say <em>that</em>. Not what justice earns. What it is."},
      {h: "The Grumbler", body: "After that he settles in as the sceptical, practical, faintly irritable brother \u2014 and Plato uses him for exactly that. It is Adeimantus who keeps raising the objection an ordinary decent person would raise.\n\nWhen Socrates has finished stripping [[guardians|the rulers]] of property, privacy, money and family, it is Adeimantus who says: you are not going to make these men very happy. When Socrates has finished praising philosophers, it is Adeimantus who says, flatly, that everyone knows philosophers are useless cranks or vicious ones \u2014 which forces [[ship_of_state|the ship of state]] out of Socrates in reply.\n\nHe is the reader's man in the room. Glaucon supplies the danger; Adeimantus supplies the doubt."}
    ], beneath: "<p>Glaucon's challenge is the famous one, and it is the weaker one. [[ring_of_gyges|The ring]] can be waved away by anyone willing to say that people are not, in fact, like that. Adeimantus cannot be waved away, because his charge is not about human nature \u2014 it is about <em>us</em>. It says: your entire moral education has been an argument for hypocrisy, delivered by people who love you.</p><p>Notice what it does to the rest of the book. If the culture's stories are what corrupt the young, then fixing the culture's stories is not a sinister afterthought \u2014 it is the direct consequence of the diagnosis. [[censorship|The censorship of poetry]], which arrives two books later and reads to a modern eye as the first ugly turn in the argument, is Socrates <em>answering Adeimantus</em>. That is not a defence of it. But anyone who wants to condemn Book 3 has to reckon with the fact that Book 2 asked for it.</p>", beyond: "<p>The door-to-door absolution sellers are not a satirical invention. Athens had a real trade in <em>Orphic</em> ritual \u2014 travelling practitioners with sacred books, offering purification from inherited guilt and a better deal in the afterlife, for money. Adeimantus is describing something his listeners could have bought that week.</p><p>Adeimantus and [[glaucon|Glaucon]] were Plato's actual brothers, and they were older than him; by the time he wrote them into this room they were most likely dead. He gives them the two best speeches in the book and lets them argue, brilliantly, for a position they reject. It is the most generous thing in the Republic, and it is aimed at his own family.</p>", rels: [
      {id: "glaucon", label: "his brother, who opens the challenge"},
      {id: "socrates", label: "whose brief he writes"},
      {id: "censorship", label: "the answer his complaint produces"},
      {id: "plato", label: "his younger brother"},
      {id: "guardians", label: "whose happiness he defends"}
    ]},
  {id: "thrasymachus", name: "Thrasymachus", pron: "thra-SIM-uh-kus", type: "character", tier: "major", themes: [
      "t_justice",
      "t_power"
    ], essence: "A [[the_sophists|professional teacher of rhetoric]] who bursts into the conversation like a wild animal to say the thing everyone half-believes and nobody says out loud: [[justice|justice]] is simply whatever the strong find convenient.", aka: "Thrasymachus of Chalcedon", sections: [
      {h: "The Entrance", body: "He has been trying to break in for some time, and the others keep holding him back. When [[socrates|Socrates]] and [[polemarchus|Polemarchus]] finally pause for breath he cannot contain himself any longer: he gathers himself like an animal and springs, and \u2014 Socrates says \u2014 both of them were struck with terror.\n\nWhat is this <em>drivel</em>, Socrates? Why are you two bowing and scraping to each other like idiots? If you actually want to know what justice is, stop asking questions \u2014 any fool can score points refuting an answer \u2014 and give one. And do not tell me that justice is the right, or the useful, or the profitable, or the advantageous, because I will not accept that kind of garbage.\n\nHe is the only man in the Republic who is genuinely angry, and Plato has drawn him with a novelist's cruelty: the sneer, the demand for his fee before he will speak, the sweat, and finally the blush."},
      {h: "The Argument", body: "Stripped of the temper, it is formidable.\n\n[[justice|Justice]], he says, is the advantage of the stronger. Look at how it actually works. Every regime makes the laws that suit itself \u2014 democracies make democratic laws, tyrannies make tyrannical ones \u2014 and then announces that obeying them is <em>justice</em>, and punishes anyone who does not. So in every city on earth, the just thing is whatever happens to serve the people in charge. Justice is not a virtue. It is a word rulers use.\n\nSocrates goes at the crack: do rulers never make mistakes? Do they never pass a law that damages their own interest? Thrasymachus is cornered, and retreats \u2014 the ruler <em>in the strict sense</em>, insofar as he rules, never errs.\n\nBut he will not be tidied away. He comes back with the shepherd. You think, Socrates, that shepherds fatten sheep for the sheep's sake. Rulers look at their people the way a farmer looks at livestock. The just man everywhere comes off worse: in contracts, in taxes, in office, he loses to the man beside him who does not care. And when injustice is done on a large enough scale \u2014 when a man takes not one citizen's money but the whole city and everyone in it \u2014 nobody calls him a criminal. They call him happy and blessed. That is [[the_tyrant|a tyrant]]. Injustice, done big enough, is a virtue."},
      {h: "The Blush", body: "Socrates takes him apart with craftsmen. Does a doctor, <em>as</em> a doctor, look after his own interest or the patient's? A pilot, the sailors'? Every art, then, seeks the good of the thing it governs \u2014 so a ruler, as a ruler, serves the ruled.\n\nThen: is the unjust man wise and good? Does he try to outdo his own kind, or only the other kind? Is injustice strong \u2014 or does a gang of thieves need justice among themselves before it can rob a single house?\n\nThe questions come one at a time and each is easy to answer, and each answer is one step further out onto the ice. Thrasymachus's replies get shorter. He starts saying whatever will end the sentence \u2014 <em>if you like, Socrates</em>, <em>have it your way, Socrates</em>, <em>I don't want to fall out with the company</em>. And then, Socrates says, reporting all this the next day with the timing of a comedian, I saw something I had never seen before.\n\nThrasymachus blushing.\n\nHe stays for the other nine books. He barely speaks again."}
    ], beneath: "<p><strong>He is not refuted, and Plato knows it.</strong> Read what Socrates actually establishes. He shows that Thrasymachus can be tangled in his own words \u2014 that he cannot hold his definition steady under cross-examination. He does <em>not</em> show that the tyrant is unhappy, or that the just life is better, or that anyone with [[ring_of_gyges|a ring of invisibility]] would decline to use it. The craftsman analogies are slippery; the argument that a gang of thieves needs internal justice proves only that injustice needs allies, which Thrasymachus never denied.</p><p>And Plato puts the admission in Socrates' own mouth. Book 1 ends with him saying he still does not know what justice is. Then [[glaucon|Glaucon]] stands up and says, in effect: <em>you have charmed the snake, not killed it</em> \u2014 and reconstructs Thrasymachus's case, better than Thrasymachus could, precisely because it has not been answered.</p><p>So the blush is the hinge of the whole book. It is the moment an argument is won and the book quietly admits that winning is not the same as being right. Everything from Book 2 to Book 10 exists because Thrasymachus is still standing.</p>", beyond: "<p>He was a real man \u2014 Thrasymachus of Chalcedon, a working teacher of rhetoric, and by the standards of the trade a distinguished one. Fragments of his actual writing survive, and they are not the ravings of a cynic; there is a speech lamenting the state of Athenian politics that sounds almost conservative, almost pious. Aristotle credits him with real advances in prose style.</p><p>None of that matters now, because Plato got to him. The Thrasymachus who exists in the mind of every reader of philosophy \u2014 the snarling, fee-taking bully who says that might makes right \u2014 is a character in someone else's book, written by a man who despised [[the_sophists|his profession]]. It is the most successful hatchet job in the history of Western thought, and it has held for twenty-four centuries.</p><p>Say the uncomfortable thing: we do not know what the real Thrasymachus believed. We know what Plato needed him to believe.</p>", rels: [
      {id: "socrates", label: "who tangles him, and does not answer him"},
      {id: "glaucon", label: "who rebuilds his argument better"},
      {id: "the_sophists", label: "his trade, and Plato's enemy"},
      {id: "the_tyrant", label: "his hero, and the book's final answer to him"},
      {id: "justice", label: "which he says is only a word rulers use"}
    ]},
  {id: "polemarchus", name: "Polemarchus", pron: "poll-uh-MARK-us", type: "character", tier: "supporting", themes: [
      "t_justice",
      "t_death"
    ], essence: "The host, in whose house the whole book takes place \u2014 a decent man with a conventional idea of justice, who will one day be handed a cup of poison by [[thirty_tyrants|the regime Plato's own family ran]].", aka: "Son of Cephalus; brother of Lysias", sections: [
      {h: "The Man Who Makes Them Stay", body: "He is the reason there is a book. [[socrates|Socrates]] is walking back up from [[the_piraeus|the port]] when Polemarchus spots him, sends a slave running to catch his cloak, and then arrives with a crowd of young men and cheerfully refuses to let him go. Look how many of us there are, he says. You will either prove stronger than all of us, or stay.\n\nSocrates offers a third way: I could persuade you to let me go.\n\nAnd could you persuade us, says Polemarchus, if we refuse to listen?\n\nIt is a joke between friends and it is the entire book in two lines. Force, or argument. And on the first page, force wins."},
      {h: "Help Your Friends, Harm Your Enemies", body: "When his father [[cephalus|Cephalus]] leaves the room, Polemarchus inherits the argument along with everything else, and gives the answer any decent Greek would have given: [[justice|justice]] is giving each man his due \u2014 which means doing good to your friends and harm to your enemies.\n\nIt is not a cynical position. It is the ordinary morality of the ancient world, the thing the poets taught and the fathers repeated, and nobody had seriously questioned it.\n\nSocrates asks two questions. First: can you actually tell your friends from your enemies \u2014 or do you mean the men who <em>seem</em> good to you, in which case you will be harming good men by mistake all your life? And second, quietly: does a just man ever make anyone worse? Horses harmed become worse horses. Men harmed become worse men \u2014 less just. So is it the work of justice to produce injustice?\n\nWithin a few pages Polemarchus is agreeing that it is never right to harm anyone at all, which is not something a Greek was supposed to be able to say. He agrees to it easily, being an agreeable man. He does not seem to notice that his entire inherited ethics has just been removed."}
    ], beyond: "<p><strong>What happened to him.</strong> In 404 BC, Athens lost [[peloponnesian_war|the war]], and [[thirty_tyrants|the Thirty]] took power. Short of money, they resolved to seize the property of the wealthy resident foreigners \u2014 [[metics|metics]], men who paid Athenian taxes and could own no Athenian land. They drew up a list. The family that owned the shield factory in the Piraeus was on it.</p><p>Polemarchus was arrested in the street and taken to the prison. He was given no trial, no charge, and no hearing. He was handed hemlock and told to drink it. They took the house, the factory, the furniture, and the gold earrings from his wife's ears, and they refused to let his family lay him out in any of his own three houses; his funeral was held in a borrowed one.</p><p>His brother [[lysias|Lysias]] escaped over a rooftop and later wrote it all down, in a prosecution speech we still have.</p><p><strong>And here is the arrangement Plato has made.</strong> The Thirty were led by Critias and Charmides \u2014 Plato's cousin and Plato's uncle. So the house in which Socrates spends this long night arguing about what justice is, and whether it is ever right to harm anyone, belonged to a man whom Plato's own family would murder for his money. Plato chose this house. He chose this host. He never once mentions it.</p>", rels: [
      {id: "cephalus", label: "his father, whose argument he inherits"},
      {id: "lysias", label: "his brother, who survived and prosecuted"},
      {id: "socrates", label: "his guest, whom he detains by force"},
      {id: "thirty_tyrants", label: "who murdered him"},
      {id: "metics", label: "his legal status, and his death sentence"}
    ]},
  {id: "cephalus", name: "Cephalus", pron: "SEF-uh-lus", type: "character", tier: "supporting", themes: [
      "t_justice",
      "t_death"
    ], essence: "A rich old man, garlanded and comfortable and relieved to be past desire, who thinks [[justice|justice]] is paying your debts \u2014 and who excuses himself to go and see to the sacrifices the moment the question gets hard.", aka: "Father of Polemarchus and Lysias", sections: [
      {h: "The Old Man in the Chair", body: "They find him sitting on a cushioned chair, wearing a garland, having just finished a sacrifice in the courtyard. He is delighted to see [[socrates|Socrates]] and scolds him for not coming down more often.\n\nWhat is it like, Socrates asks, being that old? Most men complain.\n\nAnd Cephalus gives the best answer in Book 1. Most men blame old age for troubles that were never old age's fault. As for the loss of sex and drink and feasting \u2014 he quotes Sophocles, who when asked in his eighties whether he could still make love, said: <em>most gladly did I escape it, like escaping from a savage and raging master.</em> Old age, says Cephalus, brings peace. You are released.\n\nThen he adds the honest part. It also helps to be rich. What money really buys, he says, is the ability to reach the end without having cheated anyone or owed anyone \u2014 without having to lie, or leave debts behind, or be afraid of what comes next. The stories about the afterlife, which a man laughs at when he is young, begin to trouble him when he is close."},
      {h: "The Exit", body: "So: [[justice|justice]] is telling the truth and paying what you owe.\n\nSocrates picks it up gently. Suppose a friend, in his right mind, lends you a weapon, and later goes mad and asks for it back. Should you return it? Should you even tell him the truth?\n\nCephalus laughs. He says Socrates is quite right. And then he says he must go and see to the sacrifices \u2014 hands the argument to his son [[polemarchus|Polemarchus]] like an heirloom, and walks out.\n\nHe never comes back. It is one of the quietest and most pointed exits in literature: the old, comfortable, decent, unexamined life leaves the room the instant it is asked to examine itself, and goes off to do something pious instead."}
    ], beneath: "<p>Do not sneer at him. Plato does not. He is given genuine dignity, real wisdom about age, and the only serene moment in a book otherwise made of anxiety \u2014 and his definition of justice is not stupid, it is simply <em>inherited</em>. He has never had to defend it, because nothing in his life has ever required him to.</p><p>That is what he is there for. He represents an ethics that works, so long as you are rich, old, and not asked. The moment a question arrives, he leaves \u2014 and his son picks up the answer and cannot hold it, and the sophist picks it up next and smashes it. Cephalus is the pillar the room is built on; Book 1 is the demolition of that pillar in three moves.</p><p>And there is an irony he does not live to see. He is proud that his money lets him die owing nothing to anyone. Within a generation the city will take every coin of it, murder [[polemarchus|his eldest son]], and drive [[lysias|his youngest]] out over a rooftop. His careful, decent, transactional [[justice|justice]] \u2014 pay what you owe \u2014 turns out to have no defence at all against a state that decides it owes you nothing.</p>", rels: [
      {id: "polemarchus", label: "his son, who inherits the argument"},
      {id: "lysias", label: "his son, silent in the room"},
      {id: "socrates", label: "his guest"},
      {id: "justice", label: "which he thinks is paying your debts"}
    ]},
  {id: "cleitophon", name: "Cleitophon", pron: "CLYE-toh-fon", type: "character", tier: "minor", themes: [
      "t_power"
    ], essence: "A silent partisan who speaks exactly once, to defend [[thrasymachus|Thrasymachus]] better than Thrasymachus is defending himself \u2014 and who, in the world outside the book, helped take the democracy apart.", sections: [
      {h: "One Interruption", body: "When [[socrates|Socrates]] traps Thrasymachus on whether rulers can make mistakes, Cleitophon cuts in: Thrasymachus obviously meant that [[justice|justice]] is whatever the stronger <em>believes</em> to be to his advantage. It is a real rescue, and it would have worked. Thrasymachus, too proud to be helped, refuses it \u2014 and walks back into the trap.\n\nThe historical Cleitophon was a genuine political operator who worked to dismantle Athenian democracy in the coup of 411 BC. There is also a short, strange dialogue in the Platonic collection called the <em>Cleitophon</em>, in which he complains that Socrates is very good at telling people they should care about justice and completely useless at telling them what it is. It is the only work in the corpus that leaves an attack on Socrates unanswered."}
    ], rels: [
      {id: "thrasymachus", label: "whom he tries to save"},
      {id: "athenian_democracy", label: "which he helped overthrow"}
    ]},
  {id: "lysias", name: "Lysias", pron: "LISS-ee-us", type: "character", tier: "minor", themes: [
      "t_death",
      "t_power"
    ], essence: "Present in the room all night and never given a line \u2014 and later the finest speechwriter in Athens, and the man who stood up in court and prosecuted [[thirty_tyrants|his brother's killers]].", aka: "Lysias son of Cephalus", sections: [
      {h: "The Silent Guest", body: "Plato names him in the opening paragraph and then gives him nothing to say for ten books. It is a strange, deliberate silence, because every Athenian reader knew exactly who he was.\n\nWhen [[thirty_tyrants|the Thirty]] came for his family's money, Lysias got out of the house over a rooftop while [[polemarchus|his brother]] was taken to the prison and poisoned. He survived, financed the resistance, and when the democracy was restored he wrote and delivered a speech \u2014 <em>Against Eratosthenes</em> \u2014 accusing one of the Thirty of his brother's murder to his face. It survives. It is the only prosecution speech we have from a man who watched the crime.\n\nHe became the most admired prose stylist of his age, and the plain, clear, unshowy Greek he wrote is still what students are taught to read first. He sits in this room, aged about twenty, saying nothing."}
    ], rels: [
      {id: "polemarchus", label: "his murdered brother"},
      {id: "cephalus", label: "his father"},
      {id: "thirty_tyrants", label: "whom he prosecuted"}
    ]},
  {id: "niceratus", name: "Niceratus", pron: "nih-SERR-uh-tus", type: "character", tier: "minor", themes: [
      "t_death"
    ], essence: "Another guest who never speaks: the son of the most famous general in Athens \u2014 and another name on the list of rich men [[thirty_tyrants|the junta]] would kill for their money.", aka: "Son of Nicias", sections: [
      {h: "The Other Silence", body: "His father Nicias led the catastrophic Athenian invasion of Sicily and was executed there when it collapsed, an event that effectively lost Athens [[peloponnesian_war|the war]]. Niceratus inherited the family fortune, and that was enough. [[thirty_tyrants|The Thirty]] put him to death.\n\nSo of the men Plato names in this house, at least two \u2014 Niceratus and [[polemarchus|his host]] \u2014 were murdered by the same regime, one led by Plato's cousin and his uncle. And [[socrates|the guest of honour]] was killed by the democracy that overthrew it.\n\nPlato assembled this guest list decades after all of them were dead. Every name in the room is a man the politics of Athens would eventually kill."}
    ], rels: [
      {id: "thirty_tyrants", label: "who killed him"},
      {id: "polemarchus", label: "who died the same way"},
      {id: "peloponnesian_war", label: "which killed his father"}
    ]},
  {id: "justice", name: "Justice", pron: "dik-ay-oh-SOO-nay", type: "concept", tier: "major", themes: [
      "t_justice",
      "t_soul"
    ], aka: "dikaiosune", essence: "The word the whole book is chasing \u2014 and the Greek means something much wider than fairness in a courtroom: something closer to <em>being rightly put together</em>.", sections: [
      {h: "Not the Word You Think", body: "Start with a translation problem, because it will otherwise wreck the book for you. English <em>justice</em> is a public, legal, rather cold idea: courts, rights, fair shares. The Greek word is <em>dikaiosune</em> (dick-eye-oh-SOO-nay), and it is none of those things. It is a quality of a <em>person</em>. It is what makes someone straight, sound, upright, right-functioning. The nearest English is probably <em>integrity</em>, in the engineering sense as much as the moral one \u2014 the way a hull has integrity.\n\nThis is why the book can ask a question that sounds slightly mad in English: <em>is it in my interest to be just?</em> Rephrase it as <em>is it in my interest to be sound rather than rotten inside?</em> and the whole Republic snaps into focus."},
      {h: "The Four Bad Answers", body: "Book 1 clears the ground by killing the four definitions an Athenian would have offered.\n\n[[cephalus|Cephalus]]: telling the truth and paying your debts. Killed by a madman's sword \u2014 you would not hand it back.\n\n[[polemarchus|Polemarchus]]: help your friends, harm your enemies. Killed by two questions: can you tell which is which, and does harming a man ever make him <em>better</em>?\n\n[[thrasymachus|Thrasymachus]]: whatever serves the strong. Not killed, only tangled \u2014 which is why the book keeps going.\n\nAnd the one nobody states but everybody believes, which [[glaucon|Glaucon]] drags into the open: a contract we accept because we are too weak to get away with the alternative. A cost. A cage we agree to because we cannot beat the other prisoners."},
      {h: "The Answer, When It Comes", body: "It arrives in Book 4, and it is odd, and quiet, and it has been underfoot the whole time.\n\n[[kallipolis|The city]] is now built, with its three classes. Find its wisdom (in the rulers), its courage (in the soldiers), its moderation (in the agreement of all three about who should rule) \u2014 and whatever is <em>left over</em> after you take those three away is justice. And what is left over is this: <strong>each part doing its own work, and not meddling in another's.</strong>\n\nThen the same for a man. [[the_soul|Three parts]] \u2014 reason, spirit, appetite. A just man is not one who obeys the law or keeps his contracts. A just man is one whose parts are in their right order, each doing its own job, reason ruling, spirit enforcing, appetite fed but not in charge. Justice is <em>internal</em>. It is a state of the soul, and the outward behaviour is only its symptom.\n\nWhich means [[socrates|Socrates]] has answered a different question from the one he was asked \u2014 and has arranged the last six books so you barely notice."}
    ], beneath: "<p><strong>Watch the substitution.</strong> [[glaucon|Glaucon]] asked whether justice pays <em>when nobody can catch you</em>. Socrates answers that the just soul is well-ordered and therefore healthy and therefore happy. That is a real answer and it may even be true \u2014 but it wins by redefining the term. If justice just <em>means</em> inner order, then of course the just man is better off; you have built the conclusion into the word.</p><p>And a sharper worry, first pressed hard by modern readers: a man with a beautifully ordered soul might still cheat you. Nothing in <em>each part doing its own work</em> obviously forbids embezzlement, adultery, or perjury. Socrates simply asserts that such a man would never do those things \u2014 <em>could you imagine it?</em> he asks, and Glaucon says no, and they move on. It is the single fastest passage in the book, and it is carrying the whole argument.</p>", beyond: "<p>The city-and-soul move \u2014 <em>let us read justice in the large letters first</em> \u2014 is the most consequential analogy anyone has drawn in political philosophy, and it has never stopped working on people. It is the ancestor of every claim that a society has a character, that a nation can be sick, that a state is a body with a head and hands. Hobbes's Leviathan is a man made of men. So is the fascist state, and its enemies noticed.</p><p>The definition also travelled. <em>Each doing his own</em> passes into the Roman <em>suum cuique</em> \u2014 to each his own \u2014 and from there into the Christian idea of vocation, the medieval defence of the three estates, and every argument that social hierarchy is not oppression but harmony. It was, at various times, on a coin, on a motto, and on a gate at Buchenwald. Plato is not responsible for that. But the sentence travelled.</p>", rels: [
      {id: "the_soul", label: "where it finally turns out to live"},
      {id: "kallipolis", label: "the large letters it was read in"},
      {id: "thrasymachus", label: "who says it is only a word rulers use"},
      {id: "ring_of_gyges", label: "the test it must survive"},
      {id: "glaucon", label: "who demands it be proved worth having"}
    ]},
  {id: "ring_of_gyges", name: "The Ring of Gyges", pron: "GUY-jeez", type: "object", tier: "major", themes: [
      "t_justice",
      "t_power"
    ], essence: "Twist it and you vanish. [[glaucon|Glaucon]] hands one to the just man and one to the unjust man, and asks you to name a single thing they would then do differently.", aka: "The ring of the ancestor of Gyges", sections: [
      {h: "The Story", body: "A shepherd is out with the flock in Lydia when the ground shakes and a chasm opens. He climbs down into it. There is a bronze horse, hollow, with little doors in its side; inside the horse is a corpse, larger than a man, naked except for a gold ring. He takes the ring and climbs out.\n\nAt the shepherds' monthly meeting he happens to turn the setting of the ring inwards towards his palm, and the men beside him carry on talking about him as if he had left. He turns it back and they see him. He tests it once more, to be sure.\n\nThen he arranges to be one of the messengers sent up to the king. He seduces the queen, murders the king with her help, and takes the kingdom."},
      {h: "The Question", body: "Now, says [[glaucon|Glaucon]], suppose there were two rings, and the just man wore one and the unjust man the other. No man, he says, is iron-willed enough to keep his hands off other men's goods when he could take them from the market stall without any fear, walk into any house and sleep with whoever he liked, kill or release men at will \u2014 and go among his fellows as a god.\n\nThe two men would converge. They would end in exactly the same place.\n\nAnd if that is true, then nobody is just <em>willingly</em>. We are just because we are watched, and for no other reason. And a man who kept his hands clean with that ring on his finger would be thought, by anyone who knew about the ring, not admirable but an idiot."}
    ], beneath: "<p>The ring is not about magic and it is not really a hypothetical. It is about the tax return, the empty office, the unattended till, the anonymous account, the thing you could say about a colleague that would never be traced. Glaucon has isolated the variable that every moral system quietly depends on \u2014 <em>being seen</em> \u2014 and removed it, and asked what is left.</p><p><strong>And here is the wound the book leaves open.</strong> Ask yourself, at the last page, whether Socrates ever answers <em>this</em>. His reply, nine books later, is that the unjust soul is a wreck from the inside \u2014 that [[the_tyrant|the man who can do anything]] is the most miserable creature alive. Fine. But the shepherd does not <em>become</em> a tyrant's soul the moment he twists the ring; Glaucon's man is a decent person with an opportunity, and the question was whether he has any reason to refuse it. Socrates changes the subject from <em>getting away with it</em> to <em>what it does to you</em> \u2014 and never quite comes back.</p><p>Keep the question in your pocket. Take it out again at the end and see whether you have been paid.</p>", beyond: "<p>Every invisibility story since is downstream of this one, and they nearly all agree with Glaucon. H. G. Wells's invisible man becomes a murderer within a hundred pages. Tolkien \u2014 a classicist by training \u2014 gives us a ring that turns its wearer invisible, corrupts absolutely, and was found by a small person in a dark place under the earth beside water and a corpse; the Ring of Power is the Ring of Gyges with a moral attached.</p><p>The story arrives with its own history, too. Herodotus tells a version in which the real Gyges seizes the Lydian throne after being made to look at the queen naked \u2014 no ring, no chasm, no magic. Plato has taken a piece of political history and put a fairy tale inside it, which is exactly what he accuses [[censorship|the poets]] of doing.</p>", rels: [
      {id: "glaucon", label: "who tells the story, and does not believe it"},
      {id: "justice", label: "the thing it is designed to test"},
      {id: "the_tyrant", label: "the answer, eight books later"},
      {id: "thrasymachus", label: "whose case it makes properly"}
    ]},
  {id: "the_soul", name: "The Three-Part Soul", pron: "", type: "concept", tier: "major", themes: [
      "t_soul",
      "t_justice"
    ], essence: "Reason, spirit, appetite: a parliament in every skull \u2014 and (Socrates insists) the very same three classes that make up [[kallipolis|the city]], because the city was only ever the soul, enlarged until you could read it.", aka: "The tripartite soul", sections: [
      {h: "The Proof, Which Is a Single Observation", body: "Socrates needs to show that the soul has parts, and he does it with one principle: <strong>the same thing cannot do opposite things, in the same respect, at the same time.</strong>\n\nSo: a thirsty man who refuses the water. Something in him is dragging him towards the cup and something is hauling him back. Those cannot be the same thing. Therefore there are at least two: the part that calculates, and the part that thirsts.\n\nThat gives him reason (<em>logistikon</em>) and appetite (<em>epithumetikon</em>). The question is whether there is a third."},
      {h: "Leontius and the Corpses", body: "And here Plato produces the most startling paragraph in the book, and pretends it is a footnote.\n\nLeontius, son of Aglaion, was coming up from [[the_piraeus|the Piraeus]] \u2014 along the outside of the north wall \u2014 when he saw corpses lying on the ground by the public executioner. He wanted to look at them. He also felt disgust, and turned away. For a while he fought himself and covered his face. And then, overpowered by the desire, he ran towards them with his eyes wide open and shouted at his own eyes:\n\n<em>There you are, curse you \u2014 take your fill of the lovely sight.</em>\n\nSocrates uses this to prove the existence of the third part, because Leontius's anger is directed <em>against</em> his own appetite: he is furious at himself. Anger, then, is neither reason nor desire; it is [[thumos|spirit]] \u2014 the part that takes sides.\n\nHe does not linger on what the anecdote is actually about, which is a man running to stare at executed bodies against his own will. Plato notices things."},
      {h: "The Three, and the City", body: "So: <strong>reason</strong>, which calculates and wants the truth; <strong>[[thumos|spirit]]</strong>, which is anger, honour, shame, the part that goes to war for you; and <strong>[[eros|appetite]]</strong>, which is hunger and thirst and sex and money, and which is by far the largest.\n\nAnd they map, exactly and conveniently, onto the city: [[guardians|rulers]], [[auxiliaries|soldiers]], [[producers|producers]]. [[justice|Justice]] in the soul is what justice in the city was \u2014 each part doing its own and not meddling. Injustice is a civil war in the skull.\n\nThe [[the_tyrant|tyrant]] at the end of the book is simply this diagram inverted: appetite on the throne, reason in chains, spirit as its enforcer."}
    ], beneath: "<p><strong>The analogy is doing enormous work and is never really defended.</strong> Socrates says the city must have the same parts as the soul because <em>where else would the city's qualities have come from, if not from the people in it?</em> That is not an argument; it is a shrug. A city can be warlike without every citizen being angry, in the way a wall can be square without the bricks being square.</p><p>And the direction of travel matters. If the soul is <em>read off</em> the city, then Plato has designed the soul to justify the politics \u2014 three parts because he needs three classes. If the city is read off the soul, then the whole authoritarian apparatus is a consequence of a psychological claim about who should be in charge inside your own head. The book runs the analogy in both directions whenever it needs to, and this is the crack modern critics have hammered hardest.</p>", beyond: "<p>This is the first division of the mind in Western thought, and it never went away. Reason, spirit, appetite become the medieval faculties; they become, with a change of vocabulary, superego, ego and id \u2014 Freud read his Plato, and the id is Plato's many-headed beast with a Latin name. Every model of the mind as a contested hierarchy of drives is a descendant.</p><p>The Leontius anecdote, meanwhile, has had a second life of its own: it is the first recorded description of morbid curiosity, of the compulsion to look at the very thing that horrifies you. It is over two thousand years old, it happens on a road by a wall, and anyone who has ever slowed down beside a car crash has been Leontius.</p>", rels: [
      {id: "justice", label: "which turns out to live here"},
      {id: "kallipolis", label: "the same diagram, city-sized"},
      {id: "thumos", label: "the middle part, and Plato's great addition"},
      {id: "eros", label: "the many-headed beast at the bottom"},
      {id: "the_tyrant", label: "this diagram, upside down"}
    ]},
  {id: "the_forms", name: "The Forms", pron: "", type: "concept", tier: "major", themes: [
      "t_know"
    ], essence: "The claim that behind every beautiful thing there is Beauty itself \u2014 unchanging, single, and more real than the things \u2014 and that what we call the world is the shadow.", aka: "The Ideas; ta eide", sections: [
      {h: "The Problem It Solves", body: "Point at ten beautiful things: a face, a pot, a law, a horse, an argument. They have nothing in common physically. So what are you pointing at when you call all of them beautiful?\n\nPlato's answer: at something. There is <em>the Beautiful itself</em> \u2014 one thing, not many; always the same, never becoming; not beautiful in one light and ugly in another, not beautiful to Greeks and ugly to Persians. The beautiful face is beautiful only by <em>partaking</em> in it, and it will get old.\n\nDo this for every general word \u2014 Justice, Equality, Largeness, Bed \u2014 and you have the Forms."},
      {h: "The Two Worlds", body: "It follows, Socrates says, that there are two kinds of people. There are those who love the many beautiful things \u2014 the sights and sounds, the tunes and the colours \u2014 and cannot bear to be told that Beauty itself exists. They are <em>lovers of opinion</em>, and they are dreaming: mistaking the likeness for the thing.\n\nAnd there are those very few who can bear to look at the thing itself. They are awake.\n\nAnd since knowledge must be knowledge <em>of what is</em>, and the visible world is forever sliding \u2014 becoming, decaying, being both large and small, both just and unjust depending where you stand \u2014 then strictly speaking there can be no <em>knowledge</em> of it at all. Only opinion. Knowledge belongs to the Forms alone.\n\nThis is the most consequential and least argued-for claim in the book, and everything from [[divided_line|the Line]] to [[the_cave|the Cave]] to [[philosopher_king|the philosopher's right to rule]] rests on it. If it goes, the political argument goes with it."}
    ], beneath: "<p><strong>The politics is downstream of the metaphysics, and that is the whole game.</strong> Why must philosophers rule? Not because they are clever, and not because they are good \u2014 but because they, alone, <em>know</em>, and everyone else merely has opinions. The claim that there is a single, unchanging, knowable Good, accessible to a trained few and to nobody else, is what turns a theory of Forms into a theory of authority.</p><p>Which means the objection to [[philosopher_king|the philosopher-king]] does not have to be political at all. If there is no such thing as expert knowledge of the Good \u2014 if [[form_of_good|the Good]] is not an object you can go and see \u2014 then the philosopher's claim to the throne collapses, not because rule by experts is dangerous, but because there are no experts. The most effective attack on the Republic's politics is an attack on its epistemology.</p><p>Aristotle, who studied under Plato for twenty years, made it. He said the Forms are an unnecessary duplication of the world, and that we do not explain a horse by inventing a second horse in a better neighbourhood.</p>", beyond: "<p>This is arguably the most influential idea any European ever had. It gives the Christian tradition its God \u2014 Augustine simply moved the Forms into the divine mind and called them the eternal ideas \u2014 and gives mathematics its self-image: ask a working mathematician whether prime numbers were <em>invented</em> and watch them turn Platonist in front of you. Every claim that there is a truth of the matter independent of what anyone thinks is standing in this room.</p><p>And the counterattack is equally long. Aristotle, then the nominalists, then the empiricists, then Nietzsche \u2014 who said the whole of the West had been living in a two-world story invented by a sick man who could not bear this one. Whitehead's line is famous and unfair and mostly right: the European philosophical tradition is a series of footnotes to Plato. Half of them are angry footnotes.</p>", rels: [
      {id: "form_of_good", label: "the greatest of them, and the strangest"},
      {id: "the_cave", label: "the story of coming to see them"},
      {id: "divided_line", label: "where they sit on the diagram"},
      {id: "philosopher_king", label: "whose authority rests entirely on them"},
      {id: "dialectic", label: "the only road to them"}
    ]},
  {id: "form_of_good", name: "The Form of the Good", pron: "", type: "concept", tier: "major", themes: [
      "t_know",
      "t_power"
    ], essence: "The thing [[socrates|Socrates]] says he cannot describe and will only compare to [[the_sun|the sun]] \u2014 the source of both what is real and our power to see it, and the one qualification that matters for rule.", sections: [
      {h: "The Refusal", body: "[[glaucon|Glaucon]] asks him, directly: what <em>is</em> the Good?\n\nAnd Socrates will not say. He says the question is beyond him, that he would not want to disgrace himself by giving an answer he does not have, and that they must be content with the Good's <em>child</em> \u2014 with an image \u2014 and even then he warns them that he may be handing over false coin.\n\nIt is the single most important concept in the Republic. It is what the [[guardians|rulers]] spend fifty years learning to see. It is the thing that entitles them to rule everyone else. And the book refuses to define it, and instead offers [[the_sun|a metaphor about the sun]], and moves on.\n\nEither this is intellectual honesty of a very high order, or it is the largest gap in the argument. It cannot be neither."},
      {h: "What He Does Say", body: "Three things, and they are enormous.\n\nFirst: as the sun gives things their visibility, [[form_of_good|the Good]] gives things their intelligibility \u2014 it is what makes truth <em>knowable</em>.\n\nSecond: as the sun gives things their growth and their being, the Good gives [[the_forms|the Forms]] their very existence. Reality is downstream of it.\n\nAnd third, said quickly and never taken back: the Good is not itself being, but <em>beyond</em> being, exceeding it in dignity and power. [[glaucon|Glaucon]] laughs out loud at this \u2014 <em>Apollo, what a daemonic extravagance</em> \u2014 and Socrates tells him it is his own fault for asking.\n\nEverybody who reads that sentence has to decide what to do with it. It is the point at which philosophy touches something it cannot state, and for a thousand years afterwards people who wanted to say <em>God</em> quoted it."}
    ], beneath: "<p><strong>The hole at the centre.</strong> The Republic's political conclusion is that the people who know the Good should rule. Its epistemological conclusion is that nobody, including Socrates, can say what the Good is. Put those together and you get a demand for absolute authority grounded in a knowledge that the book cannot demonstrate anybody actually has.</p><p><em>This app is taking a position:</em> that gap is not a technicality, and the friendliest readings of the Republic tend to hurry past it. If you cannot say what the Good is, then <em>philosopher</em> becomes a title conferred by an examination system that the philosophers themselves design, and the argument for their rule reduces to <em>trust us, we have seen it</em>. Every priesthood in history has said exactly that.</p><p>The best defence is that Plato knows. He makes Socrates disclaim it three times in one page, he has him warn that he is passing counterfeit money, and he lets Glaucon laugh. A man laying the foundations of a theocracy does not usually write it that way.</p>", beyond: "<p><em>Beyond being</em> \u2014 <em>epekeina tes ousias</em> \u2014 is one of the load-bearing phrases of Western religion. The Neoplatonists built an entire theology on it: Plotinus's One, ineffable, above existence, the source of everything, which you approach only by stripping away. From there it enters Christianity through Augustine and the Pseudo-Dionysius, and becomes the negative theology of the mystics \u2014 the God who can only be described by saying what he is not.</p><p>Which is a remarkable career for a sentence spoken by a barefoot Athenian who said he was only offering an image because he could not manage the real thing.</p>", rels: [
      {id: "the_sun", label: "its child, and the only description offered"},
      {id: "the_forms", label: "which it makes both knowable and real"},
      {id: "the_cave", label: "the thing at the top of the climb"},
      {id: "philosopher_king", label: "whose entire warrant this is"}
    ]},
  {id: "the_cave", name: "The Cave", pron: "", type: "concept", tier: "major", themes: [
      "t_know",
      "t_death",
      "t_power"
    ], essence: "Prisoners chained since childhood, watching shadows thrown by a fire behind them, certain the shadows are the world \u2014 and certain enough to kill the man who comes back down to tell them otherwise.", aka: "The allegory of the cave", sections: [
      {h: "The Chamber", body: "Picture men in an underground chamber, chained since childhood \u2014 legs and necks fixed, so that they can only look ahead, at the wall in front of them. Behind them, higher up, a fire is burning. Between the fire and the prisoners there is a road, and along the road a low wall has been built, like the screen that puppet-showmen set up in front of themselves, over which they work their puppets.\n\nAnd along that wall, people are carrying things: statues, figures of animals in wood and stone, all sorts of objects, held up above the parapet. Some of the carriers are talking. Some are silent.\n\n<em>A strange image,</em> says [[glaucon|Glaucon]], <em>and strange prisoners.</em>\n\n<em>They are like us,</em> says Socrates.\n\nThe prisoners see only shadows. When a carrier speaks, the echo comes off the wall in front, so they assign the voice to the shadow. They are not confused about the world \u2014 the shadows are the only world they have. They are good at it. They hand out honours and prizes to whoever is quickest at spotting which shadow comes next."},
      {h: "The Climb", body: "Release one. Make him stand, turn his head, walk, look at the fire. Every movement hurts, and the light dazzles, and the real objects he is now shown look <em>less</em> real to him than the shadows he has known all his life. He would want to turn back to the wall, where things are clear.\n\nSo you drag him \u2014 up the rough steep way, out into the sunlight \u2014 and at first he can see nothing at all. He has to <em>learn to see</em>, and it takes time, and it comes in order: shadows first, then reflections in water, then things themselves, then the night sky and the stars \u2014 because darkness is easier \u2014 and last of all [[the_sun|the sun]], not its image in water but the sun itself, in its own place.\n\nAnd then he would work out what it is: the cause of the seasons and the years, the governor of everything visible, and in a way the cause of everything he and his fellows used to look at.\n\nAnd he would remember the chamber. And he would count himself lucky, and pity them, and think it better to be the poorest labourer on earth than to be king down there."},
      {h: "The Descent", body: "But he has to go back down.\n\nAnd coming in from the sunlight his eyes are useless. In the dark he cannot make out the shadows at all, and while his sight is still ruined \u2014 which takes a long time \u2014 he must compete at naming them against men who never left. He would be ridiculous. They would say he went up and came back with his eyes destroyed, and that it is not worth even attempting the ascent.\n\nAnd if they could lay hands on the man who was trying to release them and lead them up \u2014 and kill him \u2014 wouldn't they kill him?\n\n<em>They certainly would,</em> says Glaucon.\n\nHe says it in four words and moves on. He does not appear to notice what he has just described. Plato's readers, opening this book a few decades after [[trial_of_socrates|399 BC]], noticed."}
    ], beneath: "<p><strong>It is not about ignorance. It is about education \u2014 and Plato is careful to say what education is not.</strong> It is not what its professors claim: putting knowledge into a soul the way you would put sight into blind eyes. The prisoner already has the faculty. What he lacks is the <em>direction he is facing</em>. So the whole business is a turning \u2014 <em>periagoge</em> \u2014 the swivelling of the entire soul, together with the whole body, away from the world of becoming until it can bear to look at what is. You cannot teach anyone anything. You can only turn them round, and make them do the walking.</p><p><strong>And the turn is the last third, which almost nobody quotes.</strong> Everyone remembers the chains, the shadows, the sun. The <em>point</em> of the passage is the descent. The philosopher does not get to stay in the light. He must go back down into the dark, ruined for shadow-work, ridiculous, hated \u2014 and rule. That is the entire warrant for [[philosopher_king|the philosopher-king]], and it is the opposite of what people expect: rule is not a prize for the enlightened, it is a <em>duty imposed on people who no longer want it</em>.</p><p><strong>And the thing this app will not tidy:</strong> Socrates has just calmly agreed that the prisoners would kill the man who came back to free them, and then carries straight on to the next topic. He is describing his own execution. Nobody in the room says so.</p>", beyond: "<p><strong>The machinery is real.</strong> The low wall, the objects held up above it, the men carrying them \u2014 Plato is describing a shadow-puppet show, a thing his readers had actually stood and watched. He did not invent a symbol; he pointed at a machine and said: <em>that is you</em>. It is why the image lands in one second and has never needed a footnote in twenty-four centuries.</p><p>It is also the same argument he has just made twice \u2014 [[the_sun|as an analogy]], [[divided_line|as a diagram]], and now as a story with a hero and a death in it. Guess which one everybody remembers. The philosopher who [[censorship|expelled the poets]] wins his most famous victory by writing a myth.</p><p>Its afterlife is everything: Bacon's idols, the veil of Maya, Descartes's demon, the brain in a vat, <em>The Matrix</em> (which is the cave with better effects and a worse ending), and every conspiracy theorist who has ever told you to wake up. That last one is worth sitting with. The structure of the allegory \u2014 <em>they are asleep, I am awake, and they will hate me for saying so</em> \u2014 is also the structure of every crank who ever lived. Plato gives you no test for telling them apart.</p>", rels: [
      {id: "form_of_good", label: "the sun at the top of the climb"},
      {id: "divided_line", label: "the same four stages, without the plot"},
      {id: "philosopher_king", label: "the duty the descent creates"},
      {id: "trial_of_socrates", label: "what happens to the man who comes back"},
      {id: "paideia", label: "the turning of the whole soul"}
    ]},
  {id: "divided_line", name: "The Divided Line", pron: "", type: "concept", tier: "supporting", themes: [
      "t_know"
    ], essence: "A line cut in unequal parts, and then cut again \u2014 guesswork, belief, mathematics, and pure understanding: the mind's four gears, drawn as geometry.", sections: [
      {h: "The Diagram", body: "Take a line. Cut it into two unequal parts: the visible world, and the intelligible one. Now cut each part again, in the same ratio.\n\nIn the visible half, the lower section is <strong>images</strong> \u2014 shadows, reflections in water and on polished surfaces \u2014 and the state of mind that goes with them is guesswork, <em>eikasia</em>. The upper section is the <strong>things themselves</strong>: animals, plants, artefacts. The state of mind is belief, <em>pistis</em> \u2014 and this is where almost everyone lives, and it is perfectly serviceable, and it is not knowledge.\n\nIn the intelligible half, the lower section is <strong>mathematics</strong>. And Socrates is precise and slightly withering about it: the geometer draws a triangle in the sand and argues about the Triangle, using the visible thing as an image \u2014 and he <em>starts from assumptions he cannot justify</em> (the odd, the even, the figures, the angles) and reasons downwards to a conclusion, as if they were obvious. It is real thinking, and it is standing on air.\n\nThe top section is <strong>[[dialectic|dialectic]]</strong>: reasoning that goes the other way \u2014 that treats the assumptions as assumptions, and climbs <em>up</em> through them to a first principle that needs nothing under it, and only then comes back down. It uses no images at all. It moves through [[the_forms|Forms]], by Forms, to Forms.\n\nAnd because of the ratio, the two middle sections come out exactly equal in length. Plato almost certainly did that on purpose, and has never told anyone why."}
