e are men going door to door with books full of rituals that will wash a crime off, at a reasonable price. So what does a boy conclude, hearing all this from the people who love him? He concludes: seem just. Be whatever you like underneath.\n\nWhat neither of us has ever heard from anyone, says Adeimantus, is what justice and injustice each <em>do</em> to the soul of the man who has them, unseen by gods and men. Say that. Nothing else will do.", stage: "<p>The rhetorical move here is <strong>devil's advocacy</strong>, and Plato may have invented it as a literary device. [[glaucon|Glaucon]] and [[adeimantus|Adeimantus]] explicitly announce that they are arguing a case they reject, in order to force a real answer. Socrates says he is delighted, and tells them something divine must be in them, since they can make the case for injustice this well and still not be convinced by it. That is Plato paying his brothers a compliment through a dead man's mouth.</p><p>Structurally, this is where the Republic actually begins. Book 1 was the demolition; the challenge is the commission. Everything from here to the last page of Book 10 \u2014 the city, the classes, the education, the [[the_soul|soul]], [[the_cave|the Cave]], the regimes, [[myth_of_er|the dead man's report]] \u2014 is Socrates trying to pay this bill. When you lose the thread of the book, come back to this page. This is the question.</p><p>And notice the constraint Glaucon has imposed. He has ruled <em>consequences</em> out of court. Socrates is forbidden to say that justice pays, or that people will like you, or that the gods will reward you. He must show that justice is better for the just man <em>in itself</em>, stripped naked, tortured, and despised. It is the hardest brief anyone has ever handed a philosopher.</p>", turns: "<p><strong>Everything the Republic becomes is downstream of this.</strong> The city gets built because Socrates cannot answer the question at soul-size and asks to read it larger. The whole authoritarian apparatus \u2014 [[guardians|the guardians]], [[noble_lie|the lie]], [[censorship|the expulsion of the poets]] \u2014 arrives as a consequence of a question about one man alone with a ring.</p><p><strong>The moment to watch for:</strong> the description of the just man impaled. Plato is writing perhaps thirty years after [[trial_of_socrates|a jury of his fellow citizens]] condemned Socrates to death for being a bad influence. Glaucon is describing, as a hypothetical, something Plato watched happen. When early Christian readers found this passage they thought it was a prophecy of the Cross. It is not. It is closer to a witness statement.</p><p><strong>And the wound the book never closes:</strong> Glaucon asks whether justice is worth having <em>when you cannot be caught</em>. Socrates will eventually answer that the unjust soul is a wreck from the inside \u2014 a fine answer, and possibly a true one, but not obviously an answer to the ring. Keep the question in your pocket. Take it out again at the last page and see whether you have been paid.</p>"},
  {bk: "Book 2", g: "the method", h: "Justice Writ Large", s: "[[glaucon|Glaucon]] and [[adeimantus|Adeimantus]] have made their demand and Socrates says, honestly, that he is not sure he is up to it \u2014 and that it would be irreverent to hear justice attacked like that and not defend it while he still has breath.\n\nThen he offers a method, and the whole book comes out of it.\n\nImagine, he says, that we had been told to read some small letters at a distance, and we had poor eyesight \u2014 and then someone noticed that the same letters existed somewhere else, larger, and on a bigger surface. We would think it a godsend. We would read the big ones first, and then check the little ones to see if they were the same.\n\nWell: [[justice|justice]] belongs to a man, but it also belongs to a whole city. And a city is bigger than a man. So perhaps there is more justice in the larger thing, and it will be easier to see. Let us watch a city coming into being in speech \u2014 and we shall see its justice and its injustice being born, and then we can look for the same thing, smaller, in a single soul.\n\nSo they build one, and the first city is a delight.\n\nA city comes to exist, he says, because none of us is self-sufficient. So: a farmer, a builder, a weaver, a shoemaker. Perhaps a smith to make the tools, and a cowherd, and a merchant to trade the surplus, and a market, and coinage, and labourers to do the carrying. And each man does the one thing he is naturally suited to, and does it all his life, and does it well.\n\nWhat will they eat? Barley meal and wheat flour; they will bake and knead and lay out fine cakes and loaves on reeds and clean leaves, and lie on beds strewn with yew and myrtle, and drink wine, and sing hymns to the gods, and enjoy each other's company \u2014 and take care not to have more children than their means allow, keeping an eye on poverty and war. They will live in peace and health, and die in old age, and hand the same life on to their children.\n\nAnd Glaucon interrupts, and the interruption changes the history of political thought.\n\n<em>If you were founding a city of pigs, Socrates, what else would you fatten them on?</em>\n\nWhat would you have, then?\n\nThe usual things. Couches to lie on. Tables. Relishes and desserts, like people actually have.\n\nAh, says Socrates. I see. We are no longer looking at how a city comes to be \u2014 we are looking at a <em>luxurious</em> city. And perhaps that is not a bad idea, because in a fevered city we may see justice and injustice being born.\n\nSo add them: couches, tables, sweets, perfume, incense, prostitutes, pastries, painting, embroidery, gold, ivory. Add actors and dancers and impresarios. Add hunters and imitators. Add doctors \u2014 lots of doctors, because we will need them now.\n\nAnd the territory, which was enough to feed the first city, is no longer enough. So we shall have to cut off a slice of our neighbours' land, and they will want a slice of ours, if they too have let themselves go beyond necessity.\n\nAnd then, Glaucon, we shall go to war.\n\nAnd because war is a skill like any other, and a man cannot do two jobs well, we shall need a class of people who do nothing else.", stage: "<p><strong>This is the hinge of the entire Republic, and it is disguised as a change of subject.</strong> Everything monstrous in the book \u2014 [[guardians|the guardian class]], the eugenics, the [[censorship|censorship]], the [[noble_lie|lie]] \u2014 enters as a consequence of one requirement: <strong>the city needs a standing army</strong>. And the city needs a standing army because Glaucon wanted relishes.</p><p>Notice how Plato has arranged the guilt. It is not Socrates who wrecks the honest little city. It is the reader's proxy \u2014 the sharp, appetitive, aristocratic young man \u2014 who sneers at it and demands more. Socrates calls the healthy city <em>the true city</em>, and says so plainly, and then builds the sick one <em>because he is asked to</em>.</p><p>And the method itself \u2014 <em>read the large letters first</em> \u2014 is offered so lightly, in four sentences, that most readers wave it through. It is the most consequential analogy in the history of political thought and it is presented as a convenience for people with bad eyesight.</p>", turns: "<p><strong>What turns here is the object of the whole inquiry.</strong> A question about one man's soul has become a question about a state, and the transfer is never justified \u2014 only offered as a magnifying glass. Every defender of Plato leans on this page (<em>it is a diagram, not a policy</em>), and every prosecutor has to get past it.</p><p><strong>The moment to watch for:</strong> the city of pigs. It is a famous jibe and it is worth asking who the joke is on. Glaucon cannot imagine a good life without cushions and sauces \u2014 and Socrates, who owned nothing, went barefoot, and was famously indifferent to food and wine, has just described a city that lives exactly as <em>he</em> does, and been told it is fit for animals. Plato is not neutral about which of those two men is the pig.</p><p><strong>And the thing to carry forward:</strong> Kallipolis is not a vision of paradise. It is a <em>fever hospital</em>. It is what you have to do to a luxurious, greedy, war-making city to keep it from destroying itself. Read it that way and the whole book changes colour.</p>"},
  {bk: "Books 2-3", g: "the schooling", h: "The First Censorship", s: "The [[guardians|guardians]] must be fierce to enemies and gentle to their own \u2014 which, Socrates admits, sounds impossible, until you think of a well-bred dog, which is savage to strangers and delighted by anyone it knows. So the guardian must be spirited and philosophical at once. And such a nature is not made by accident; it is made by education.\n\nAnd education begins with stories, told to children, before anything else. And here Socrates stops and says the sentence that starts the trouble:\n\n<em>The beginning is the most important part of any work, especially in the case of a young and tender thing; for that is the time at which the character is being formed and the desired impression is more readily taken.</em>\n\nSo. Shall we simply allow the children to hear any stories anyone happens to make up, and to take into their minds beliefs that are, for the most part, the opposite of what we think they should hold when they grow up?\n\nWe certainly shall not.\n\nThen we must supervise the story-makers. And they begin going through [[homer|Homer]] and Hesiod with a knife, and it is not a small operation.\n\nOut go the gods at war with each other, the binding of Hera, the hurling of Hephaestus from heaven \u2014 whether or not they are allegories, because a child cannot tell an allegory from a fact. Out goes the god who causes evil, because god is good and cannot be the cause of anything bad; so every line saying the gods send misery must be cut, and if a poet says Zeus has two jars, one of good and one of evil, and pours from both, he must be silenced. Out go the gods who change shape and lie, because a god has no need of falsehood.\n\nThen out goes the fear of death. No hero may weep. No hero may say \u2014 as [[homer|Homer's]] Achilles says, from the underworld \u2014 that he would rather be a slave on earth to a landless man than king of all the dead. That line is famous, and true, and it is the finest thing in Greek poetry about death, and it will make soldiers afraid to die, and therefore it must go.\n\nAnd the great lamentations must go, and the loud laughter, and Achilles dragging Hector's body round the tomb, and the gods laughing at Hephaestus limping.\n\n[[adeimantus|Adeimantus]] agrees to every item. He was, after all, the one who complained that the poets teach children to want the <em>appearance</em> of goodness. This is what it costs to fix that.", stage: "<p><strong>Understand what Homer was, or none of this makes sense.</strong> He was not a novelist whose books were on a shelf. [[homer|Homer]] was scripture, curriculum, history and national identity in one object: boys learned to read on him, men quoted him in court, the city's sense of itself came out of him. Editing Homer is not literary criticism. It is closer to a state deciding which parts of the Bible may be read aloud, and burning the rest.</p><p>Note the technical claim underneath, because it is doing all the work: <strong>a child cannot distinguish an allegory from a fact</strong>. Once you accept that, and once you accept that early impressions form character permanently, everything else follows by ordinary parental logic. This is not a tyrant's argument. It is the argument of every anxious parent who ever confiscated a book, and it is the more dangerous for that.</p>", turns: "<p><strong>This is the first genuinely ugly turn in the book, and it arrives as a favour to the reader.</strong> [[adeimantus|Adeimantus]] complained, in Book 2, that our whole culture teaches the young to <em>seem</em> just rather than <em>be</em> just, and that the poets are the worst offenders. [[censorship|The censorship]] is Socrates <em>answering him</em>. Anyone who wants to admire Book 2 and condemn Book 3 has to explain why.</p><p><strong>The moment to watch for:</strong> Achilles in the underworld \u2014 <em>better a serf on earth than a king among the dead</em>. Plato has Socrates cut it, explicitly, by name, because it is demoralising. It is arguably the truest and most humane line in all of Greek literature, and it is the first thing on the fire.</p><p><strong>And the thing this app will not tidy:</strong> the man doing the cutting is a character in a work of literature, in a book stuffed with myths, similes, and invented stories, written by a man who \u2014 the ancient gossip insists \u2014 burned his own tragedies when he met Socrates. The Republic bans poetry with one hand and writes it with the other, and it never once addresses the fact.</p>"},
  {bk: "Book 3", g: "the foundation", h: "The Noble Lie", s: "The city is nearly assembled, and Socrates now needs something to hold it together \u2014 and he becomes visibly uncomfortable, which he almost never is.\n\nHow, he asks, might we contrive one of those falsehoods that come into being when they are needed \u2014 one noble lie, if it can be managed, to persuade, ideally the rulers themselves, but failing that the rest of the city?\n\nWhat sort of lie, says [[glaucon|Glaucon]].\n\nNothing new, says Socrates. A Phoenician sort of thing; it has happened before, the poets say, though not in our time, and I do not know whether it could happen again \u2014 and it would take a great deal of persuading.\n\nHe hesitates. <em>You seem reluctant to tell it,</em> says Glaucon.\n\nYou will think me quite right to be reluctant, says Socrates, when I have.\n\nAnd here it is.\n\nWe shall tell them that everything they think they remember \u2014 their upbringing, their education, all of it \u2014 was a dream; that in truth they were being formed and nursed inside the earth, they and their weapons together; and that when they were finished the earth, their mother, sent them up. And so they must think of the land they live in as their mother and their nurse, and defend her against attack, and think of the other citizens as brothers, born of the same earth.\n\nAnd we shall tell them this. Although you are all brothers, the god who made you mixed <strong>gold</strong> into those of you who are fit to rule, and they are the most honoured; and <strong>silver</strong> into [[auxiliaries|the auxiliaries]]; and <strong>iron and bronze</strong> into the farmers and the craftsmen.\n\nUsually your children will be of your own kind. <em>But not always.</em> A golden father may have a silver son, and a bronze father a golden one. And so \u2014 and this is the part everyone forgets \u2014 the god commands the rulers, above all and before everything, to <strong>watch the children and see what metal is mixed into their souls</strong>. If their own child is born with bronze in him, they must have no pity: they must give him the rank he deserves and push him down among the craftsmen. And if a craftsman's child is born golden, they must raise him up.\n\nBecause there is an oracle, they will be told, that the city is destroyed on the day it is guarded by iron or bronze.\n\nAnd Socrates asks: can you think of any way of getting them to believe it?\n\nAnd Glaucon says: <em>Not the men themselves. But their sons might. And their sons' sons, and everyone after that.</em>", stage: "<p><strong>Plato uses the word.</strong> He could have written <em>myth</em>, or <em>story</em>, or <em>allegory</em>, or <em>useful fiction</em>. The Greek is <em>pseudos</em>. It means a lie, and Socrates flinches twice before saying it, and Glaucon needles him for flinching. Whatever this is, we are not being smuggled past it.</p><p>He has also, a few pages earlier, laid the ground with a distinction: there is the lie <em>in the soul</em> \u2014 actually being deceived about the most important things, which is the true falsehood and hateful to gods and men \u2014 and the lie <em>in words</em>, which is only an imitation of that, and is sometimes a useful medicine. And medicine, he says, is to be handled by doctors. So the right to lie belongs to the rulers, and to nobody else; and a citizen who lies to a ruler is like a patient lying to his physician.</p><p>And note Glaucon's reply, which is the coldest line in Book 3. You cannot make the first generation believe it. But you can raise the second one inside it.</p>", turns: "<p><strong>Here is the thing nobody expects: the myth of the metals is an attack on the aristocracy.</strong> Plato's own class believed that noble blood <em>was</em> noble \u2014 that virtue ran in families and that was that. This myth says the opposite: your parents' metal guarantees nothing, the ruler's son may be bronze and must be demoted without pity, the smith's son may be gold and must be raised. A hereditary aristocrat has written a founding myth that abolishes hereditary aristocracy \u2014 and then had to make it a lie, because nobody would believe the truth.</p><p><strong>And here is the crack it opens.</strong> [[kallipolis|A city]] whose entire justification is an argument about truth, knowledge and reason cannot stand up unless its citizens believe something false. If the perfect city needs [[noble_lie|the lie]], then reason alone cannot hold a society together \u2014 and that is either Plato's most honest admission or his most damning one. Ask yourself which, and notice that the book never asks.</p>"},
  {bk: "Book 4", g: "the answer", h: "Each Doing Its Own", s: "The city is finished, and Socrates says something slightly comic: we should now be able to find [[justice|justice]] in it, if we are not completely useless. And [[glaucon|Glaucon]], who is enjoying himself, says: let us look, and Socrates \u2014 follow, and pray.\n\nThe method is elimination. If the city is completely good, it has all four of the great virtues; find three, and what is left will be the fourth.\n\n<strong>Wisdom</strong> is easy: it is in the [[guardians|rulers]], and it is the smallest class in the city that has it. So a city is called wise because of the smallest part of itself.\n\n<strong>Courage</strong> is in the [[auxiliaries|soldiers]], and Socrates defines it with a beautiful and slightly unnerving image: courage is the preservation, through everything \u2014 pleasure, pain, fear and desire \u2014 of the belief about what is to be feared that the law has instilled. It is like a dyer's fast colour, laid on wool that has been prepared so carefully that no amount of washing will take it out. Their courage is a dye that will not run.\n\n<strong>Moderation</strong> is different: it is not in one class, it runs through all of them like a harmony. It is the agreement of rulers and ruled about <em>who ought to be in charge</em>. Moderation, in a city, is everybody consenting to the arrangement.\n\nAnd now, says Socrates, we come to the last one, and it is the hardest to see \u2014 and then he says: <em>we have been rolling about in it from the very beginning like men looking for something they are already holding.</em>\n\nBecause the principle we laid down at the very start, before there was a single guardian \u2014 that <strong>each man must do the one thing in the city for which his nature is best suited, and not meddle in anything else</strong> \u2014 that was it. That was justice all along.\n\nAnd its opposite follows immediately. Injustice is <em>meddling</em>. It is the businessman who buys his way into the soldier class, or the soldier who forces his way into the council. It is a man doing three jobs, or the wrong one. When the three classes interfere with each other and exchange their functions, that is the ruin of the city \u2014 and that, Socrates says, is injustice.", stage: "<p><strong>Watch the sleight of hand, because it is the most elegant in the book and it is doing enormous work.</strong> Justice is found by <em>subtraction</em> \u2014 whatever is left when the other three virtues are taken away. But the thing that is left is precisely the principle Socrates smuggled in on the very first page of the city, as an efficiency measure: <em>one man, one job</em>. It was introduced as a fact about productivity (a shoemaker who also farms makes worse shoes), and it comes back, eight books' worth of scaffolding later, as the definition of the highest human virtue.</p><p>Plato even has Socrates <em>admit</em> it: we have been rolling about in it from the beginning. It is charming, and it is a confession. The conclusion was in the premises.</p>", turns: "<p><strong>This is the answer, and it is worth stopping to notice how strange it is.</strong> [[justice|Justice]] has just turned out to have nothing to do with fairness, rights, contracts, harm, or how you treat other people. It is <em>structural</em>. It means: the parts are in the right relation. A hull has integrity. A well-tuned lyre has integrity. A city where the shoemakers do not vote has integrity.</p><p><strong>The moment to watch for:</strong> the dyed wool. Courage is defined as <em>holding on to the beliefs the law put in you</em>, and the whole apparatus of [[censorship|censored stories]] and controlled music exists to lay that dye so deep it cannot be washed out by argument. Read it a second time and notice: on this definition, a courageous soldier is one who <em>cannot be talked out of what he was taught as a child</em>. In a book by the man Athens killed for talking people out of what they were taught as children.</p><p><strong>And the crack:</strong> a man whose soul is beautifully ordered, each part doing its own work, might still embezzle, betray, and lie. Socrates simply asks whether we could imagine such a man doing those things, and Glaucon says no, and they move on. It is the fastest paragraph in the Republic, and the entire argument is standing on it.</p>"},
  {bk: "Book 4", g: "the return", h: "The Parliament in the Skull", s: "Justice has been found in the city. Now it must be found in a single man \u2014 and to do that, Socrates has to show that a soul has parts.\n\nHe does it with one principle: the same thing cannot do opposite things, in the same respect, at the same time. A spinning top is not both moving and still \u2014 it is moving in one respect and still in another. Fine. Then consider a thirsty man who <em>refuses to drink</em>. Something in him is dragging him towards the cup. Something else is holding him back. They cannot be the same thing.\n\nSo there are at least two: the part that <strong>calculates</strong>, and the part that <strong>craves</strong>.\n\nIs there a third? And here Socrates says: I heard a story once, and I believe it. And he tells it, and it is the most startling paragraph in the book.\n\nLeontius, the son of Aglaion, was walking up from [[the_piraeus|the Piraeus]], under the outside of the north wall, when he saw some corpses lying on the ground with the public executioner standing beside them.\n\nHe wanted to look at them. And at the same time he was disgusted, and turned himself away. And for a while he struggled with himself and covered his eyes.\n\nAnd then the desire beat him. And he ran towards the bodies with his eyes wide open, and shouted at his own eyes:\n\n<em>There you are, curse you \u2014 take your fill of the lovely sight.</em>\n\nSocrates draws the conclusion he needs, calmly: the man's <em>anger</em> was directed against his own appetite. It fought on the side of reason and lost. So anger is a third thing \u2014 [[thumos|spirit]] \u2014 neither calculation nor craving, but the part that <em>takes sides</em>.\n\nAnd there are the three. <strong>Reason</strong>, which wants the truth. <strong>[[thumos|Spirit]]</strong>, which wants honour, and is furious at wrong. <strong>[[eros|Appetite]]</strong>, which wants food, drink, sex and money, and is the largest part of most people, and is never satisfied.\n\nAnd they line up, exactly, with [[guardians|rulers]], [[auxiliaries|soldiers]] and [[producers|producers]].\n\nSo [[justice|justice]] in a man is what justice was in the city: each part doing its own work, reason in charge, spirit as its ally, appetite fed and obedient. And injustice is <em>civil war in the soul</em> \u2014 a faction rising, a part doing another part's job.\n\nAnd then Socrates says the thing the whole book has been walking towards. Justice is a kind of <strong>health</strong>. Injustice is a kind of <strong>disease</strong>. And so the question [[glaucon|Glaucon]] asked \u2014 whether it pays to be just \u2014 has become as ridiculous as asking whether it pays to be well.", stage: "<p><strong>Plato has just invented the divided self</strong>, and every model of the mind since is a redescription of it: the faculties, the passions and reason, the id and ego and superego. Freud read his Plato closely; the id is [[eros|the many-headed beast]] with a Latin name.</p><p>And notice what Leontius is <em>for</em>. Socrates needs a case where anger fights <em>desire</em> rather than reason, and he needs it fast. So Plato reaches for an anecdote about a man who cannot stop himself staring at executed bodies by a wall on the road out of the port \u2014 and uses it as a logical stepping stone, and moves on without comment. It is the first description of morbid curiosity in Western literature. It happens on a real road. Anybody who has ever slowed down beside a car crash has been Leontius.</p>", turns: "<p><strong>The whole argument turns here, and everything after it is consequence.</strong> Once [[justice|justice]] is <em>psychic health</em>, the answer to [[glaucon|Glaucon]] writes itself: of course you would rather be just, in the same way you would rather not have a disease, and no amount of gold or reputation makes a man with a rotting body happy.</p><p><strong>But look hard at what has been done.</strong> Glaucon asked whether justice is worth having when nobody can catch you \u2014 [[ring_of_gyges|with the ring on your finger]]. Socrates has answered a different question: whether it is worth being well-ordered inside. Those may both be good questions. They are not the same question, and the substitution happens right here, in a passage about a spinning top and a thirsty man.</p><p><strong>And the analogy is never defended.</strong> Why must the soul have the same three parts as the city? Because, Socrates says, where else would the city's qualities have come from, if not from the people in it? That is not an argument. A wall can be square without the bricks being square. The whole political edifice is balanced on this one shrug \u2014 and it is the place where every serious modern critic of the Republic puts the crowbar.</p>"},
  {bk: "Book 5", g: "the first wave", h: "Women, Naked, in the Gymnasium", s: "Socrates is about to move on to the four bad regimes when [[polemarchus|Polemarchus]] leans over, takes [[adeimantus|Adeimantus]] by the cloak, and whispers something. Adeimantus says, out loud: shall we let him off, or not?\n\nCertainly not, says [[glaucon|Glaucon]].\n\nWhat, says Socrates, are you not letting me off?\n\nYou, they say. You said, in passing, that among the [[guardians|guardians]] friends have everything in common \u2014 women and children too \u2014 and then you walked straight past it as though it were nothing. We want to hear it. All of it.\n\nSocrates groans. You have no idea, he says, what a swarm of arguments you are stirring up. I was hoping nobody would notice. And he warns them: he is now going to have to say three things, each more absurd than the last, and each of them is a <em>wave</em> that may break over his head and drown him in ridicule.\n\nHere is the first.\n\nWe agreed that the female watchdog guards the flock alongside the male. She is weaker; she also whelps; and nobody thinks she should therefore stay at home. So \u2014 if we are to use women for the same work, we must give them the same upbringing. Music. Gymnastics. Riding. Weapons.\n\nWhich means the women will have to strip to exercise, as the men do, wearing their excellence instead of clothes; and they will be older, and not all of them beautiful; and the men watching from the benches will laugh.\n\nLet them laugh, says Socrates. Not so long ago the Greeks thought it shameful and ridiculous for <em>men</em> to be seen naked, as the barbarians still do. Then the Spartans did it, and then everyone did it, and the laughter stopped. What is useful is beautiful, and what is harmful is ugly, and the man who laughs at women exercising is picking unripe fruit from the tree of humour without knowing what he is laughing at.\n\nThe argument itself is one page long and it is devastating in its plainness. Do men and women differ? Yes \u2014 one begets, the other bears. Does that difference bear on <em>this</em> question? Bald men and long-haired men differ too, and we do not therefore say that bald men may be cobblers and long-haired men may not. So what we must ask is not <em>are they different</em> but <em>are they differently gifted for the work</em>.\n\nAnd there is no occupation, he says, that belongs to a woman <em>because</em> she is a woman, or to a man because he is a man. The natures are scattered alike through both. One woman is a natural doctor, another is not; one is musical, another unmusical; one is spirited, another is not. Some women are fit to guard the city, and their nature is the same as the men's.\n\nThe best of them, therefore, must be educated as guardians, and share the same beds, and stand in the same line, and rule.", stage: "<p><strong>Set the wave in its water.</strong> An Athenian woman of the citizen class could not vote, could not hold office, could not go to law without a male guardian, could not \u2014 in respectable society \u2014 dine with her husband's guests, and spent most of her life in a part of the house men did not enter. Athletic nudity was for men and boys; the gymnasium was one of the most gendered spaces in the ancient world. What Socrates is proposing is not a reform. It is an obscenity.</p><p>And notice the shape of the argument. Plato does <em>not</em> say women are equal in dignity, or that they have rights, or that the arrangement is unjust to them. He argues from <strong>utility</strong> and from <strong>dogs</strong>: the city needs its best guardians, half its best guardians are female, and the current arrangement wastes them. Rights do not enter into it. He gets to a radical conclusion by a route no modern feminist would take.</p><p>Watch also for the wit, which is genuine \u2014 Socrates teasing the young men that they are picking unripe fruit from the tree of humour \u2014 and note where the wit stops. There is none in the next two waves.</p>", turns: "<p><strong>This is the most radical page written by anyone in the ancient world, and it is written by a man who is usually called a reactionary.</strong> Nobody \u2014 not the poets, not the sophists, not the democrats \u2014 had proposed that women rule. The Athenian democracy, which Plato despised, would not have entertained it for one second. His anti-democratic utopia is the only place in Greek thought where a woman can be king.</p><p><strong>And say the uncomfortable thing:</strong> it is not liberation. Female guardians get their equality by being <em>freed from the household</em> \u2014 and the next wave frees them from it entirely by [[community_children|abolishing it]]. They will bear children they never see again. The gain is real and the price is set in the very next beat, and Plato treats them as one proposal, because they are.</p><p><strong>The moment to watch for:</strong> <em>bald men and long-haired men</em>. It is a joke, and it is one of the cleanest arguments ever made about the difference between a difference and a <em>relevant</em> difference. Every equality argument since has been a version of it.</p>"},
  {bk: "Book 5", g: "the second wave", h: "No Wives, No Children, No Home", s: "The second wave, says Socrates, is worse.\n\nAll these women are to be shared, in common, among all these men. None of them is to live privately with any of them. The children, likewise, are to be held in common \u2014 and no parent is to know his own child, or any child his parent.\n\nAnd [[glaucon|Glaucon]] says, drily, that this one will be doubted much harder than the first, both as to whether it is possible and as to whether it would be any good.\n\nSocrates does not really argue the second point. He <em>engineers</em>.\n\nWe breed hunting dogs, he says, and gamebirds. And we do not let the best and the worst mate at random \u2014 we breed from the best, in their prime, or the stock degenerates. If that is true of dogs and birds, how much care must we take over human beings? And how first-rate our rulers will have to be, if the same is true of the human herd.\n\nSo: there will be festivals. Sacred marriages, with hymns and sacrifices. The number of them will be regulated by the rulers, to keep the population steady \u2014 an eye on war, disease, and food.\n\nAnd there will be a lottery \u2014 and the lottery will be <strong>rigged</strong>. It must be ingeniously arranged, he says, so that the inferior men blame their bad luck, and not the rulers, when they are not matched with the best women. The best men are to have sex with the best women as often as possible, and the inferior with the inferior as rarely as possible.\n\nThe young men who distinguish themselves in war will be given more frequent permission to lie with the women, so that the greatest number of children may be fathered by the best men.\n\nAnd as the children are born, they will be taken by officers appointed for the purpose, and carried to a rearing pen, to nurses living in a separate quarter of the city. Mothers will be brought there when their breasts are full, and every precaution taken that no woman recognises her own child.\n\nAnd then, in a subordinate clause, in the middle of a sentence about administration, comes the line.\n\n<em>The children of the inferior parents, and any of the others born defective, they will hide away, as is fitting, in an unspeakable and unseen place.</em>\n\nThat is all he says. [[glaucon|Glaucon]] answers: <em>Yes \u2014 if the race of the guardians is to be kept pure.</em>\n\nAnd Socrates moves on to the question of how long women should bear children for, and what the correct ages are, and how the citizens will address each other as brother and sister and father and son, since no one will know.", stage: "<p><strong>The Greek is not ambiguous about the tone and it is nearly silent about the act.</strong> The phrase is <em>en aporreto te kai adelo</em> \u2014 in a place unspoken of and unseen. It is language used for things one does not name. Ancient Athens practised infant exposure; unwanted newborns were left out to die. Plato's readers did not need it explained. He does not explain it. He does not defend it, argue for it, or return to it. It is one clause.</p><p><strong>We are naming this zone and we are not going to be clever in it.</strong> There is a strain of commentary that hurries past this sentence, or translates it into softer words, or points out that Plato says nothing explicit and therefore may not mean what it plainly means. Read it and decide. But be aware that the smoothing is happening, and that it has been happening for two thousand years.</p><p>The rigged lottery is worth its own line. It is the [[noble_lie|noble lie]] again, in operational form: the rulers deceive the citizens about the mechanism of their own reproduction so that the losers blame chance. Plato states the design goal explicitly \u2014 <em>so that they will blame their luck, and not the rulers</em>.</p>", turns: "<p><strong>What turns here is the reader.</strong> This is the page where most people stop being able to read the Republic as an inspiring book, and it is meant to be difficult \u2014 Socrates calls it a wave that may drown him. The question is what kind of difficulty it is.</p><p><strong>The aim is not cruelty; the aim is unity.</strong> The whole apparatus exists to destroy the word <em>mine</em>. Socrates says so explicitly a few pages later: the greatest evil for a city is whatever tears it apart, and nothing tears it apart like men saying <em>mine</em> and <em>not mine</em> about different things. So: no wives, no children, no house, no property, no <em>mine</em> \u2014 and the city becomes a single body that feels a pain in its finger as a pain in the whole man. It is the most complete vision of political unity ever written, and this is what it costs.</p><p><strong>And here is the wound the book leaves open and never dresses.</strong> [[kallipolis|The city]] is founded to answer a question about whether it is worth being a good person. To make it work, its founders must lie to the citizens about who they sleep with, take their newborns from them in the night, and put some of those newborns somewhere unspoken of. Nobody in the dialogue objects. [[glaucon|Glaucon]] \u2014 who could not bear an unjust man being praised \u2014 says <em>yes, if the race is to be kept pure</em>, and the conversation moves on.</p>"},
  {bk: "Book 5", g: "the third wave", h: "Philosophers Must Rule", s: "Two waves survived. Socrates would very much like to stop.\n\nBut [[glaucon|Glaucon]] will not have it: he wants to know whether this city is <em>possible</em>, and how. And Socrates says: you are attacking me, and I have been running from this question, and here comes the third wave \u2014 the biggest of the three \u2014 and it will drown me in laughter and contempt.\n\nAnd then he says it.\n\n<em>Until philosophers rule as kings in their cities, or those who are now called kings and rulers genuinely and adequately take up philosophy \u2014 until political power and philosophy come together in the same person, and the many natures who at present pursue one to the exclusion of the other are forcibly barred from doing so \u2014 there will be no rest from evil, Glaucon, for cities, nor, I think, for the human race.</em>\n\nAnd then, immediately, he adds: this is what I have been shrinking from saying, because I saw how very paradoxical it would sound. It is hard for anyone to see that there is no other way to be happy, privately or publicly.\n\nGlaucon warns him, half laughing: a great many very respectable people are going to take off their coats, pick up whatever weapon comes to hand, and come running at you.\n\nSo Socrates must now define what he means by a philosopher \u2014 because the word, in Athens, meant something closer to <em>clever nuisance</em>.\n\nAnd he distinguishes with great care. There are lovers of sights and sounds \u2014 people who run about to every festival and every performance, who adore beautiful things, beautiful colours, beautiful shapes \u2014 and who become furious if you tell them that <em>Beauty itself</em> exists. They are dreaming: mistaking the likeness for the thing.\n\nAnd there is the man who can look at [[the_forms|the beautiful itself]], and distinguish it from the things that share in it. He is awake. He does not have opinions. He has knowledge.\n\nAnd since knowledge must be of what <em>is</em>, and the visible world is forever sliding \u2014 large and small, just and unjust, beautiful and ugly, depending where you stand \u2014 then everything you and I see, all day, every day, is not a possible object of knowledge at all.\n\nOnly opinion.\n\nWhich is why the only people fit to govern are the ones who do not live there.", stage: "<p><strong>Everything in the Republic's politics is standing on the metaphysics of this beat.</strong> The philosopher's claim to rule is <em>not</em> that he is clever, or good, or disinterested \u2014 though he must be all three. It is that he <strong>knows</strong>, and that everybody else merely has opinions, and that this is not a difference of degree but a difference of kind, because the objects are different. He looks at [[the_forms|what is]]. The rest of us look at what is passing.</p><p>So the most effective attack on the philosopher-king is not political at all. It is epistemological. If there is no separate realm of knowable Forms \u2014 if there is no [[form_of_good|Good]] you can go and see \u2014 then there are no experts in it, and the philosopher's throne has nothing under it. Aristotle, who sat in Plato's school for twenty years, went after exactly that, and every subsequent critic has followed him.</p><p>Note also the sentence's construction: <em>forcibly barred</em>. Even in the great, ringing, hopeful line, the coercion is right there in the middle of it, and nobody in the room blinks.</p>", turns: "<p><strong>The most famous sentence in political philosophy, and the most misread.</strong> It sounds like a prescription for rule by intellectuals. It is not. Read it beside [[the_cave|the Cave]]: the philosopher does not <em>want</em> to rule, has to be <em>dragged</em> back down into the dark, and is ridiculous when he gets there. Socrates says flatly that a city ruled by men who are eager to rule is a city at war with itself, and that the only good state is one in which the rulers are reluctant. <strong>Reluctance is the qualification.</strong></p><p>Which is a devastating standard, and it disqualifies almost everyone who has ever cited the sentence. [[popper|Popper's]] reply is the sharpest thing ever said against it: <em>who should rule?</em> is the wrong question, and asking it is how you get tyranny \u2014 because the right question is how to get rid of bad rulers without bloodshed, and [[kallipolis|Kallipolis]] has no mechanism for that whatsoever.</p><p><strong>The moment to watch for:</strong> Glaucon's joke about respectable men taking off their coats and coming at Socrates with whatever is to hand. It is a joke about a lynching, made to a man the city will eventually kill.</p>"},
  {bk: "Book 6", g: "the defence", h: "The Ship and the Beast", s: "[[adeimantus|Adeimantus]] finally says what every reader has been thinking, and he says it bluntly.\n\nSocrates, nobody can out-argue you. But look at the actual results. The men who take up philosophy and stay with it turn out to be either complete cranks or, in the best cases, useless \u2014 useless to the cities they live in.\n\nAnd Socrates says: they are right. Philosophers <em>are</em> useless. And then he explains whose fault that is, with a story.\n\n<strong>Imagine a ship.</strong> The shipowner is bigger and stronger than anyone on board, but he is short-sighted, and hard of hearing, and his knowledge of navigation is on the same level. The sailors are quarrelling over the tiller \u2014 each one convinced he ought to be steering, though not one of them has ever learned navigation, and they insist it cannot be taught, and are ready to cut to pieces anyone who says otherwise.\n\nThey crowd round the owner, begging him for the helm; and when he will not give it, they kill the men who persuaded him, or throw them overboard. Then they drug the noble owner with drink or a sedative, take control of the ship, help themselves to the stores, and sail on, drinking and feasting.\n\nAnd the man they praise \u2014 the one they call a real seaman and a master of navigation \u2014 is whoever is cleverest at helping them seize the helm by flattery or force.\n\nAnd the man who actually studies the year, the seasons, the sky, the stars and the winds \u2014 the man who has learned the <em>craft</em> of steering a ship \u2014 they call a useless stargazer and a babbler.\n\nSo, says Socrates: the true philosopher is not useless <em>to</em> the city. He is made useless <em>by</em> it. Do not blame the navigator for standing on deck. It is not natural for the pilot to beg the sailors to be ruled by him.\n\nAnd then he explains why the young men who <em>could</em> have been philosophers never become them \u2014 and produces the second image, which is nastier.\n\nEveryone complains about the sophists corrupting the young. But the greatest sophist is the public itself. Consider a man who has taken charge of <strong>a huge and powerful beast</strong>. He learns its moods and its appetites; how to approach it, when it is dangerous, what noises soothe it and what noises enrage it; and having watched it for years he writes all this down and calls it a science, and sets up to teach it.\n\nHe has no idea, in any of it, which of the beast's desires are <em>good</em> and which are shameful. He calls good whatever pleases the beast, and bad whatever annoys it, because he has no other standard.\n\nThat, says Socrates, is what passes for political wisdom. And a gifted young man, watching this, learns that the road to honour runs through the beast \u2014 and the philosophy that might have saved him is the one thing he will never have time for.", stage: "<p><strong>These two images are the Republic's case against [[athenian_democracy|Athenian democracy]], and they are arguments by picture rather than by proof.</strong> That is worth registering: the man who [[censorship|banned the poets]] wins his most famous political argument with two extended metaphors, neither of which contains a single premise you could dispute.</p><p>The details are precise, though. Athens really did fill offices by lottery. Juries of hundreds of ordinary citizens really did decide questions of law and death. Assemblies really were swayed by whoever spoke best that morning. And in 406 BC the Athenian assembly executed six of its own victorious generals in a single vote after a naval battle \u2014 illegally, in a panic, and regretted it almost immediately. [[socrates|Socrates]] was in the chair that day and refused to put the motion. When he talks about sailors drugging the captain, his audience knew exactly which ship he meant.</p>", turns: "<p><strong>What turns here is the direction of the accusation.</strong> Up to now the Republic has been telling us what is wrong with unjust men. From here on it is telling us what is wrong with <em>us</em> \u2014 the many, the assembly, the audience, the crowd. The Great Beast is not a tyrant or a sophist. It is the public, and the public's tame intellectuals, and the beast is not even blamed for being a beast.</p><p><strong>The moment to watch for:</strong> <em>he calls good whatever pleases the beast, because he has no other standard.</em> That is the sharpest sentence Plato ever wrote about politics, and it has not aged a day. Anyone who has watched a poll drive a policy, or a feed drive an opinion, has watched the beast being fed.</p><p><strong>And the steelman he never answers:</strong> the ship image assumes there <em>is</em> a navigational science of ruling, with a right answer and trained experts \u2014 which is precisely the thing a democrat denies. If there is no such expertise, then the sailors are not fools for arguing; arguing is all there is, and the crowd on deck is not a mutiny but a parliament. Plato does not consider the possibility. He builds the ship so that the question cannot be asked.</p>"},
  {bk: "Book 6", g: "the ascent", h: "The Sun and the Line", s: "So the [[guardians|rulers]] must study the greatest thing of all \u2014 and [[glaucon|Glaucon]], who has been waiting for this, asks: what is it? What is [[form_of_good|the Good]]?\n\nAnd Socrates will not tell him.\n\nHe says the question is beyond him. He says that if he tried, he would only disgrace himself. He says he is afraid of appearing ridiculous by reaching for what he does not have. Let us leave aside, he says, what the Good <em>is</em> \u2014 that is more than we can manage today \u2014 and let me instead tell you about its <em>child</em>, which is very like it. And even then, he warns, take care that I do not deceive you by paying you in counterfeit coin.\n\nGlaucon, half exasperated: pay us the interest, then, and you can settle the principal another time.\n\nSo Socrates gives him [[the_sun|the sun]].\n\nSight, he says, is peculiar. To hear a sound you need an ear and a sound. But to <em>see</em> a colour you need an eye, and a colour, and <strong>a third thing</strong> \u2014 light. In the dark, the healthiest eye ever made sees nothing at all, and the colours are still sitting there.\n\nAnd the lord of that light is the sun. The sun is not sight. The sun is not the eye. The sun is not the thing seen. The sun is what makes seeing <em>possible</em> \u2014 and, since it also causes the seasons and the growth of every visible thing, it is the cause of the objects' <em>being</em> as well as their visibility.\n\nNow, says Socrates, put that in the other world. The Good is not knowledge. It is not the mind. It is not [[the_forms|the Forms]]. It is what makes the Forms <em>knowable</em>, and what gives them their very <em>existence</em> \u2014 and it is not itself being, but beyond being, exceeding it in dignity and power.\n\nAnd Glaucon laughs out loud. <em>Apollo</em>, he says. <em>What a daemonic extravagance.</em>\n\nIt is your fault, says Socrates. You made me say it.\n\nAnd then, without pausing, he draws [[divided_line|the Line]].\n\nTake a line, and cut it into two unequal parts \u2014 the visible world and the intelligible one \u2014 and then cut each part again in the same ratio.\n\nIn the visible half: the lower stretch is <strong>images</strong> \u2014 shadows, and reflections in water and on polished surfaces \u2014 and the state of mind is guesswork. The upper is <strong>the things themselves</strong>: animals, plants, everything made. The state of mind is belief. And that, Socrates says, is where nearly everybody lives, and it works perfectly well, and it is not knowledge.\n\nIn the intelligible half: the lower stretch is <strong>mathematics</strong>, and he is precise and faintly cutting about it. The geometer draws a triangle in the sand and reasons about the Triangle \u2014 so he is still using a visible thing as an image \u2014 and worse, he begins from assumptions he cannot justify (the odd, the even, the angles, the figures) and reasons <em>downwards</em> from them as if they were obvious, and never looks back.\n\nAnd the top stretch is <strong>[[dialectic|dialectic]]</strong>: thought that treats its assumptions <em>as</em> assumptions, and climbs <em>up</em> through them to a first principle that needs nothing beneath it \u2014 and only then descends. It touches no image at all. It moves through Forms, by Forms, to Forms.\n\nFour segments. Four states of mind. And, because of the ratio, the two middle sections come out exactly equal in length \u2014 which Plato certainly did on purpose, and about which he has said absolutely nothing.", stage: "<p><strong>He is going to make the same argument three times in a row, and you should notice him doing it.</strong> Once as an <em>analogy</em> ([[the_sun|the Sun]]). Once as a <em>diagram</em> ([[divided_line|the Line]]). And once, in the next beat, as a <em>story with a hero and a death in it</em> ([[the_cave|the Cave]]).</p><p>Guess which one you will remember in a week. The man who is about to escort [[homer|Homer]] out of the city at spearpoint has just demonstrated, at some length, that a myth beats a diagram \u2014 and he does not appear to have noticed.</p><p><strong>And note the withering treatment of mathematics</strong>, because it is the opposite of what most people assume Plato thought. Geometry is not the summit. It is a <em>rung</em>: indispensable, ten years of the curriculum, and still standing on assumptions it never inspects.</p>", turns: "<p><strong>The hole at the centre of the Republic is opened right here, in public, with everyone watching.</strong> The book's political conclusion is that those who know [[form_of_good|the Good]] should rule. Its epistemological conclusion is that nobody, including Socrates, can say what the Good is. Put those two together and you have a demand for absolute authority resting on a knowledge the book never demonstrates that anyone actually possesses.</p><p><em>This app is taking a position:</em> that gap is not a technicality, and the friendliest readings of Plato hurry past it. If you cannot say what the Good is, then <em>philosopher</em> becomes a title awarded by an examination the philosophers designed, and the case for their rule reduces to <em>trust us, we have seen it</em>. Every priesthood in history has said exactly that.</p><p><strong>The best defence, and it is a real one:</strong> Plato knows. He has Socrates disclaim the answer three times on a single page, warn that he may be passing counterfeit coin, and get laughed at by [[glaucon|Glaucon]] for the one metaphysical claim he does make. Men laying the foundations of a theocracy do not usually write the scene that way.</p><p><strong>And the standard to hold him to:</strong> [[dialectic|dialectic]] has just been defined as the discipline that refuses to leave an assumption unexamined. Now go back and ask what this book does with the assumption that [[the_soul|the soul has three parts]], or that a city is like a man. It asserts them. Beautifully, and from the top down.</p>"},
  {bk: "Book 7", g: "the image", h: "The Cave", s: "Picture, says Socrates, men in an underground chamber, chained since childhood \u2014 legs and necks fixed so they can only look ahead, at the wall in front of them. Behind them and above them a fire is burning. Between the fire and the prisoners a road runs, and along the road a low wall has been built, like the screen that puppet-showmen put up in front of themselves, over which they work their puppets. Along that wall people are carrying things \u2014 statues, figures of animals in wood and stone \u2014 holding them up above the parapet as they pass. Some of the carriers are talking; some are silent.\n\nA strange image, says [[glaucon|Glaucon]], and strange prisoners.\n\nThey are like us, says Socrates.\n\nBecause of course the prisoners see nothing of themselves or each other but the shadows the fire throws on the wall in front of them. And when one of the carriers speaks, the echo comes off the same wall, so the prisoners assign the voice to the shadow. To such men, Socrates says, the truth would be nothing but the shadows of manufactured objects. It is not that they are deceived about the world. It is that the shadows are the only world they have ever had, and they are good at it \u2014 they hand out honours to whoever is best at spotting which shadow comes next.\n\nNow release one. Make him stand up, turn his head, walk, look at the fire. Every one of those movements hurts. The light dazzles him, and the objects he is now shown, the real ones, look less real to him than the shadows he has known all his life. If you told him that what he saw before was worthless and that he is now closer to what is, he would think you were talking nonsense and he would want to turn back to the wall, where things are clear.\n\nSo you drag him. Up the rough steep way, out into the sun, and hold him there \u2014 and at first he can see nothing at all. He has to learn to see, and it takes time, and he takes it in order: shadows first, then reflections in water, then things themselves, then the night sky and the stars and the moon, because they are easier than daylight. And last of all, the sun \u2014 not its image in water, but the sun itself, in its own place. And then he would work out what it is: the thing that governs the seasons and the years, and in a way the cause of everything he and his fellows used to look at.\n\nAnd then, says Socrates, he would remember. He would remember the chamber, and what passed for wisdom down there, and the prizes they gave each other for spotting shadows \u2014 and he would count himself lucky and pity them. Better, he would think, to be the poorest labourer in the light than to be king of that place.\n\nBut he has to go back down.\n\nAnd coming in from the sunlight his eyes are useless. In the dark he cannot make out the shadows at all, and while his sight is still ruined \u2014 and it takes a long while to adjust \u2014 he must compete at naming them with men who have never left. He would be ridiculous. They would say that he went up and came back with his eyes destroyed, and that it is not worth even attempting the ascent.\n\nAnd if they could get their hands on the man who was trying to release them and lead them up, and kill him, wouldn't they kill him?\n\nThey certainly would, says Glaucon.\n\nHe agrees to it in four words, and moves on. He does not appear to notice what he has just described. Plato's readers, opening this book a few decades after [[trial_of_socrates|399 BC]], noticed.", stage: "<p><strong>The cave is a real piece of theatre, not a vague metaphor.</strong> The low wall, the carried objects held up above it, the puppeteers behind the screen \u2014 Plato is describing a shadow-puppet show, a thing his readers had actually watched. That is why the image lands instantly: he did not invent a symbol, he pointed at a machine and said, that is you.</p><p><strong>What the allegory is <em>about</em> is education, and Plato is careful to say what it is not.</strong> Education is not what its professors claim \u2014 putting knowledge into a soul the way you would put sight into blind eyes. The prisoner already has the faculty. What he does not have is the direction he is facing. So the whole business is a <em>turning</em>: <em>periagoge</em>, the swivelling of the whole soul, together with the whole body, away from the world of becoming until it can bear to look at what is. You cannot teach anyone anything. You can only turn them round and make them do the walking.</p><p><strong>Read it alongside the two images just before it.</strong> The fire in the cave is the sun's counterfeit; the objects carried past are the counterfeits of [[the_forms|the Forms]]; the four stages of the climb \u2014 shadows, reflections, things, sun \u2014 are the four segments of [[divided_line|the Divided Line]] with a body and a plot attached. Plato has made the same argument three times: as an analogy, as a diagram, and as a story. Guess which one everybody remembers.</p>", turns: "<p><strong>The turn is the last third, and almost nobody quotes it.</strong> Everyone remembers the chains and the shadows and the sun. The point of the passage is the <em>descent</em>. The philosopher who has seen the Good does not get to stay in the light. He must go back down into the dark, ruined for shadow-work, ridiculous, hated \u2014 and rule. That is the entire justification for [[philosopher_king|the philosopher-king]], and it is the opposite of what people expect: rule is not a prize for the enlightened, it is a <em>duty imposed on people who no longer want it</em>. Socrates says flatly that a city ruled by men eager to rule is a city at war with itself, and that the only good state is one where the rulers are reluctant.</p><p><strong>The irony to catch:</strong> the book's very first word was <em>I went down</em> \u2014 down to [[the_piraeus|the port]], which is where the whole conversation happens. The philosopher's descent into the cave and Socrates' walk down to the Piraeus are the same journey, and the Greek verb is the same one used for going down into the land of the dead.</p><p><strong>And the thing this app will not tidy:</strong> Plato has just had Socrates calmly agree that the prisoners would kill the man who came back to free them, and then has him carry on to the next topic. He is writing about his own teacher, executed by his own city, and he does not stop to say so. Some silences are louder than an accusation.</p>"},
  {bk: "Book 7", g: "the cost", h: "Send Out Everyone Over Ten", s: "The [[guardians|guardians]] have their curriculum now: gymnastics and music as children; ten years of number, geometry, solid geometry, astronomy and harmonics from twenty to thirty; five years of [[dialectic|dialectic]] after that \u2014 and not a day before thirty, because young men who are given the art of refutation use it like puppies, tearing at everything within reach for the pleasure of it, and end by believing nothing at all.\n\nThen fifteen years back down in the world: military commands, offices, the ordinary posts, being tested, being seen.\n\nAnd at fifty, the survivors are brought to the end, and made to lift up the eye of the soul and look at [[form_of_good|the Good]] itself \u2014 and then, taking it as their pattern, to spend the rest of their lives ruling the city and each other in turn, most of the time in philosophy, and when their turn comes taking their spell of political drudgery, and ruling for the city's sake, as a thing that must be done, and not as anything fine.\n\nAnd [[glaucon|Glaucon]] says: you have made your rulers beautiful, Socrates, like a sculptor.\n\nAnd the women too, says Socrates. Do not imagine I was speaking only of men.\n\nThen \u2014 how would you actually <em>found</em> it? Because there is one point on which everyone will say the thing is impossible.\n\nAnd here Socrates answers. It is short. It is not argued for. It is the quietest sentence in the Republic and it should stop you dead.\n\n<em>All those in the city who are more than ten years old they will send out into the fields; and they will take over the children, away from the present habits and manners of their parents, and bring them up in their own ways and laws, which are the ones we have described.</em>\n\nThat, he says, is the quickest and easiest way for the city and the constitution we have been talking about to be established, and to be happy, and to be of the greatest benefit to the people among whom it comes to be.\n\n[[glaucon|Glaucon]] agrees. He says it is much the best way, and that Socrates has described very well how it would come about, if it ever did.\n\nAnd they carry on.", stage: "<p><strong>Read it twice, because the prose is doing everything it can to help you miss it.</strong> There is no argument, no defence, no acknowledgement of difficulty. It arrives as a piece of administrative housekeeping in the middle of a passage about how nice the rulers will be. The Greek is as flat as the English.</p><p>What is being described is the forcible separation of every child in a city from its parents, and the expulsion of the entire adult population into the countryside \u2014 and it is being described as the <em>quickest and easiest way</em>.</p><p><strong>This is one of the zones where this app does not do jokes.</strong> It is also the passage that makes the twentieth century's reading of Plato impossible to wave away, because the twentieth century <em>did this</em>, more than once, and some of the men who did it had read this book.</p>", turns: "<p><strong>What turns here is the defence.</strong> Up to this point, every reader who wants to keep [[kallipolis|the city]] as [[the_soul|a diagram of the soul]] has been able to say: it is a picture, nobody is being harmed, there are no infants in a city made of speech. This sentence is where that reading has to do its hardest work \u2014 because Socrates has been asked a question about <em>implementation</em>, and he answers it.</p><p>The charitable reading holds that the answer is a deliberate absurdity: he is showing you that the perfect city cannot be brought about among <em>existing</em> people, that you would have to start from nothing, and that this is precisely why it is [[kallipolis|laid up in heaven]] rather than built in Attica. On this reading, the sentence is not a proposal but a demonstration of impossibility.</p><p>The plain reading holds that he means it, that Plato wrote another entire book \u2014 <em>the Laws</em> \u2014 about how to actually found a city, and that men who are writing fiction do not usually specify the age cut-off.</p><p><strong>The book does not adjudicate, and neither will we.</strong> But notice this: [[glaucon|Glaucon]], who could not bear to hear the unjust man praised, who demanded that the just man be defended with no rewards and no reputation and nothing but his own soul \u2014 hears this proposal and says it is much the best way. Nobody in the room objects. That silence is the loudest thing in the Republic.</p>"},
  {bk: "Books 8-9", g: "the decay", h: "How a City Dies", s: "Now, at last, Socrates goes back to the four bad regimes he was about to describe seven books ago, before they made him talk about women.\n\nAnd he does something no one had done before: he describes the death of a political order as a <em>process</em>, with stages, each one produced by the sons of the stage before it. Politics as pathology. Every constitution contains the disease that kills it, and the disease is always its own children.\n\n<strong>First, the fall.</strong> Even [[kallipolis|the perfect city]] dies, because everything that comes into being must decay, and because the rulers will eventually mistime the breeding festivals \u2014 the calculation is difficult, and the arithmetic Socrates gives for it is so deliberately, extravagantly obscure that no one has ever agreed what it means. Bad children are born. The metals get mixed. Iron and silver approach each other, and there is conflict.\n\n<strong>Timocracy.</strong> The soldiers seize the land, enslave the farmers who were once free brothers, and rule by honour and war. They are ashamed of money \u2014 so they hide it. They keep their treasuries in the dark. They are hard, and brave, and slightly stupid, and their wives complain to them, quietly, that other men have more.\n\nAnd the timocratic son watches his father being passed over in the city, and hears his mother saying it, and hardens.\n\n<strong>Oligarchy.</strong> Money becomes the qualification for office, and a property line is drawn across the city. Now there are literally <em>two cities</em>, says Socrates \u2014 the city of the rich and the city of the poor \u2014 living in the same walls, plotting against each other. They cannot fight a war, because arming the poor is more dangerous than the enemy. And they produce a new kind of man: the miser, tight, joyless, disciplined by fear, with his bad desires held down not by reason but by anxiety about his money.\n\nAnd they produce something else. A man who has lost everything, who is still in the city, armed, in debt, hating the men who ruined him, and looking for a revolution. Oligarchy breeds its own executioners and calls them the poor.\n\n<strong>Democracy.</strong> It comes when the poor win \u2014 sometimes by arms, sometimes when the rich simply lose their nerve. And Socrates describes it, and it is the most famous passage of political abuse ever written, and it is very funny until it is not.\n\nIt is a beautiful constitution, he says, like a coat embroidered in every colour \u2014 the most beautiful of all, if you like variety. Full of freedom and free speech, where you may do exactly as you like. Nobody makes you rule, and nobody makes you obey; you needn't go to war when the city goes to war, or keep the peace when everyone else does. A man condemned to death or exile just stays, and strolls about the city like a ghost, and nobody notices.\n\nThe father grows accustomed to behaving like his son and fearing him; the son behaves like his father and has no respect for him. The teacher fears his pupils and flatters them, and the pupils despise the teacher. The young imitate their elders and argue with them, and the old sit down with the young and imitate them, so as not to seem disagreeable. And the horses and donkeys in the street, he says, have learned to walk about with such freedom and dignity that they bump into anyone who does not get out of the way.\n\nAnd then the joke ends.\n\nBecause the thing democracy loves is freedom, and it drinks it unmixed, and it comes to regard any authority at all as slavery \u2014 and the city's leaders learn to feed the beast, and to bring charges against the rich, and to confiscate. And the rich, being attacked, become genuinely oligarchic in self-defence. And out of that fight the people always, always put forward <strong>one man</strong>, a champion, and nurse him, and make him great.\n\nAnd the excess of freedom, in a man or a city, seems to change into nothing but an excess of slavery.\n\n<em>Out of the extreme of liberty,</em> says Socrates, <em>comes the harshest and most complete slavery.</em>", stage: "<p><strong>Plato has invented a genre here</strong> \u2014 the decline narrative, in which political forms fall in a fixed sequence, each corrupted by the very virtue it was built on. Polybius will formalise it, Machiavelli will take it up, Gibbon will write it on the largest possible scale, and every columnist announcing that the republic is entering its late phase is standing in Book 8.</p><p>Note the technique that makes it work: <strong>each regime gets a matching <em>man</em></strong>. The timocratic man, the oligarchic man, the democratic man, the tyrannical man \u2014 and each is produced by watching his father fail. The politics is <em>generational</em> and it is domestic. Revolutions happen in the dining room.</p><p>And notice the wit, which is real and superb, and where it stops. The donkeys in the street are a joke. The father who is afraid of his son is a joke with a knife in it. Nothing after the champion arrives is a joke at all.</p>", turns: "<p><strong>This is Plato's revenge, and it is worth naming as such.</strong> [[athenian_democracy|The democracy]] he is dismembering here is the one that killed [[socrates|Socrates]] \u2014 and the man writing it watched a democracy execute his teacher, and watched an oligarchy, run by his own family, [[thirty_tyrants|murder fifteen hundred people]] before that. He has an axe, and he is grinding it in public, and the prose is magnificent.</p><p><strong>The moment to watch for:</strong> <em>the people always put forward one man, a champion, and nurse him, and make him great.</em> Plato is describing something Athens had done repeatedly. He is also describing something that has not stopped happening, and the passage is quoted every few years by someone who thinks it has just become relevant again.</p><p><strong>And the steelman he never gives:</strong> the case <em>for</em> democracy is not that the crowd is wise. It is that no one can be trusted with power and that a system which lets you throw the rascals out without bloodshed is worth more than a system that installs the right rascal forever. Plato does not consider it. He cannot \u2014 because he is looking for the <em>best</em> constitution, and this is an argument about the <em>worst</em>, and about how bad the worst can be allowed to get.</p>"},
  {bk: "Book 9", g: "the answer to Glaucon", h: "The Tyrant Is the Most Wretched Man Alive", s: "The champion is nursed, and grows, and here is what he becomes.\n\nHe begins by being everyone's friend. He is gentle to those he meets. He promises to cancel the debts and redistribute the land. He smiles at everybody. And in his first days he is full of promises \u2014 and to those he has not destroyed, he is genial.\n\nHe asks the people for a bodyguard, so that their champion may be safe. And they give it to him, being afraid for him and unafraid for themselves.\n\nThen he needs a war, so that the people will need a leader. Then he needs another, because the war has made them poor, and poor men are too busy to plot. And the men who helped him rise \u2014 the brave ones, the proud ones, the ones who speak freely \u2014 begin to be a problem, and so he must purge them. He must look about, carefully, and see who is courageous, and who is intelligent, and who is rich, and he must be their enemy \u2014 until he has cleaned the city out.\n\nA marvellous purge, says Socrates. The opposite of the doctor's: the doctor takes out the worst and leaves the best, and the tyrant does the reverse.\n\nAnd the people, who fled the smoke of being ruled by free men, find they have walked into the fire of being ruled by slaves.\n\nAnd now Socrates turns to the man himself \u2014 because this is, at last, the answer to [[glaucon|Glaucon]].\n\nInside every one of us, he says, even the most respectable, there is a terrible, savage, lawless kind of desire. You can see it in sleep, when reason is off duty and the beast in us wakes: it will not shrink from anything \u2014 from intercourse with a mother, or with any man or god or beast, or from any murder, or from any food. There is nothing it will not do, in a dream.\n\nThe tyrant is the man in whom that thing is awake all the time. He is the dream, walking.\n\nAnd what is his life?\n\nHe cannot leave his own house. He is surrounded by men who would kill him if they could, so he must never travel, never attend a festival, never see the things every free citizen sees; he lives, says Socrates, like a woman confined indoors. He is the ruler of a city, and he is the only man in it who cannot go outside.\n\nHe is rich, and he is always in need, because his appetites are infinite. He is powerful, and he is terrified. He is surrounded, and he has no friends \u2014 because he has killed anyone worth having. He flatters the worst men alive, and depends on them, and knows they are only waiting.\n\nAnd he is not even his own master. Inside him, the same city: a mob of desires, a tyrant on the throne of his soul, reason in chains, and everything good in him enslaved to the worst thing in him.\n\n<em>So,</em> says Socrates, <em>if a man is like his city, must he not be the most wretched of all men?</em>\n\nAnd he asks Glaucon to be the judge, and to award the prize \u2014 first place, and last \u2014 for happiness.\n\nAnd Glaucon says: the king first, and then the timocrat, the oligarch, the democrat, and last of all the tyrant.\n\nWhich is the answer to the question he asked in Book 2. It has taken seven books.", stage: "<p><strong>Plato has just described the unconscious, and he does not have a word for it, and he does not need one.</strong> The lawless desires that wake in sleep \u2014 incest, murder, anything \u2014 are stated flatly, twenty-three centuries before Freud, who read this passage and cited it and did not pretend otherwise.</p><p>Note the structure of the argument, because it is the payoff of the entire book's machinery. The city has three parts. The soul has three parts. The regimes decline through five stages. And so the <em>souls</em> decline through five stages \u2014 and the fifth is a soul with the mob on the throne. Every piece of scaffolding erected since Book 2 is holding up this one conclusion.</p><p><strong>This is not a zone for wit.</strong> The purge, the bodyguard, the men who cannot be allowed to be brave \u2014 Plato is describing something that had happened in Athens within living memory, to people whose names he knew.</p>", turns: "<p><strong>This is the answer. Look hard at whether it is an answer to the question.</strong></p><p>[[glaucon|Glaucon]] asked whether [[justice|justice]] is worth having when nobody can catch you \u2014 [[ring_of_gyges|the ring on the finger]], the invisible man in the marketplace. Socrates has replied that the man who lives entirely by his appetites is a wreck: friendless, frightened, insatiable, enslaved by the worst thing in himself.</p><p>That is powerful, and it may be true. But is it a reply?</p><p>The shepherd with the ring is not a tyrant. He is an ordinary man with an opportunity. Nothing in the description of the tyrant's misery explains why a decent person, offered one invisible theft, should decline it. Socrates has answered a question about <em>a whole life given over to appetite</em>. Glaucon asked about <em>a single unwatched moment</em> \u2014 and the honest reading is that the book has slowly, brilliantly, over seven books, changed the subject.</p><p><strong>The moment to watch for:</strong> the tyrant who cannot leave his house. It is the finest image in the second half of the Republic, and it is the whole thesis in one picture \u2014 <em>the freest man alive is the only man in the city who is not free</em>.</p><p><strong>And take your question back out of your pocket now.</strong> Ask whether you have been paid.</p>"},
  {bk: "Book 10", g: "the exile", h: "Homer Is Escorted to the Gate", s: "The argument is won. The city is built, the soul is mapped, the tyrant is convicted. And Socrates, who could have stopped, says: and of course, there is one thing we did entirely right, and that is that we refused to admit poetry.\n\nAnd he does it again, and this time he does it properly, and colder.\n\nThe argument is metaphysical. There is one Form of Bed \u2014 the thing itself, made by god. The carpenter makes <em>a</em> bed, which is an imitation of it, and a poor one. And the painter paints the carpenter's bed \u2014 and not even the bed: only how it looks from one angle, in one light. So the painter is at <strong>three removes</strong> from what is real. And so is the poet.\n\nAnd worse: he does it knowing nothing. [[homer|Homer]] writes about generalship, medicine, chariots and cities. Did any city ever appoint him? Did he win a war, invent a device, found a constitution, leave behind a way of life, teach a single named pupil anything? Name one. He is a man who imitates the language of every craft and possesses none of them \u2014 and the crowd, which knows nothing either, thinks he must understand everything, because his metre is so beautiful. Strip the poetry off, says Socrates, and look at what is left.\n\nAnd then he makes the argument that actually matters to him, which is not about knowledge at all.\n\nWhen we watch a tragedy, and a great man weeps and beats his breast and pours out his grief, what do we do? <em>We enjoy it.</em> We surrender, we praise the poet who moves us most, we go home and say it was magnificent.\n\nAnd the same men \u2014 the same men \u2014 would be ashamed to behave that way over their own losses. In private grief we pride ourselves on being quiet and enduring, and we think that is what a man does.\n\nSo the part of us we starve at our own funerals, we feed at the theatre. And what is fed grows strong. You cannot indulge a passion in someone else's sorr
