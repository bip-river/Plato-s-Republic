    ], beneath: "<p>The withering bit about mathematics is worth sitting with, because it inverts what most people assume Plato thought. Geometry is not the highest thing. It is a <em>ladder</em> \u2014 indispensable, ten years of the [[guardians|guardians']] education, and still only the third rung, because it cannot examine its own foundations. It hangs its beautiful proofs from assumptions it takes on trust.</p><p>Which sets a standard that is uncomfortable to apply to the Republic itself. [[dialectic|Dialectic]] is defined as the discipline that refuses to leave an assumption unexamined. Now go back and ask what the Republic does with the assumption that [[the_soul|the soul has three parts]], or that the city is like a man, or that there is a single Good and it can be seen. It asserts them. Beautifully, memorably, and from the top down.</p>", rels: [
      {id: "the_forms", label: "what the top of the line is made of"},
      {id: "the_cave", label: "the same four stages, with a plot"},
      {id: "dialectic", label: "the top segment, and the only way up"},
      {id: "paideia", label: "the curriculum the diagram dictates"}
    ]},
  {id: "the_sun", name: "The Sun", pron: "", type: "concept", tier: "supporting", themes: [
      "t_know"
    ], essence: "The image [[socrates|Socrates]] reaches for when he is asked what [[form_of_good|the Good]] is: what the sun does for the eye, the Good does for the mind \u2014 and you cannot look straight at either.", sections: [
      {h: "The Analogy", body: "Sight is a strange sense. Hearing needs only an ear and a sound; sight needs an ear, a sound, and <em>a third thing</em> \u2014 light. In the dark the healthiest eye in the world sees nothing, and the colours are still there.\n\nSo: the sun is not sight, and it is not the eye, and it is not the thing seen. It is the cause of all three \u2014 the source of the light in which seeing happens, and the source, too, of the growth of the things that are seen.\n\nNow move it up a level. [[form_of_good|The Good]] is not knowledge, and it is not the mind, and it is not [[the_forms|the Forms]]. It is what makes knowing possible, and it is what makes the Forms <em>be</em>. Truth and knowledge are like light and sight: beautiful, but not the Good \u2014 and to mistake them for it is the same error as mistaking the light for the sun.\n\nAnd as the eye cannot look at the sun directly, the mind cannot look at the Good. You know it is there because you can see."}
    ], beyond: "<p>The sun is the oldest god in the toolbox, and Plato is deliberately using it. But note what he has done to it: he has drained it of worship and turned it into an <em>explanation</em>. It is not a deity to be sacrificed to; it is the middle term of an argument about how knowing works.</p><p>Which did not stop everyone afterwards putting the worship back. The image runs straight into Christian light-metaphysics \u2014 God as light, Christ as the sun of righteousness, the halo, the rose window, illumination as the word for understanding. Dante ends the <em>Paradiso</em> unable to look at what he has come all that way to see. So does the man coming out of [[the_cave|Plato's cave]].</p>", rels: [
      {id: "form_of_good", label: "what it is an image of"},
      {id: "the_cave", label: "where it appears again, at the top of the climb"},
      {id: "divided_line", label: "the same argument, drawn as geometry"}
    ]},
  {id: "noble_lie", name: "The Noble Lie", pron: "", type: "concept", tier: "major", themes: [
      "t_power",
      "t_art"
    ], essence: "The founding story Socrates would tell the citizens of the perfect city \u2014 that they were born from the earth with gold, silver or bronze already in their souls \u2014 a lie, told for their own good, at the foundation of a city built on truth.", aka: "The Phoenician tale; the myth of the metals", sections: [
      {h: "The Proposal", body: "Socrates is embarrassed, and says so. He needs, he says, one of those falsehoods that come into being when they are needed \u2014 a single <em>noble</em> lie, if it can be managed, to persuade the rulers themselves, or failing that at least the rest of the city.\n\nHow, [[glaucon|Glaucon]] asks, will you have the nerve?\n\nAnd the story is this. Tell them that everything they remember of their upbringing was a dream; that in reality they were being formed in the earth, and the earth is their mother, and they came up fully made. So the land is their mother and their nurse, and every other citizen is their brother.\n\nAnd tell them that the god who made them mixed <strong>gold</strong> into those fit to rule, <strong>silver</strong> into the [[auxiliaries|soldiers]], and <strong>iron and bronze</strong> into the farmers and the craftsmen.\n\nUsually they will breed true. But not always \u2014 and here is the clause that matters: a golden parent may produce a bronze child, and a bronze parent a golden one, and <em>the rulers' first and greatest duty is to watch the children and see what metal is mixed into their souls</em>, and to demote and promote without mercy. There is an oracle, they will be told, that the city falls on the day it is guarded by iron or bronze.\n\nCould you get them to believe it? <em>Not the first generation,</em> says Glaucon. <em>Perhaps their sons.</em>"},
      {h: "What Kind of Lie", body: "Plato has been careful, several pages earlier, to divide falsehood in two. There is the lie <em>in the soul</em> \u2014 being genuinely deceived about the most important things \u2014 and that is the true falsehood, hateful to gods and men. And there is the lie <em>in words</em>, which is only an imitation of it, and which is sometimes useful: against enemies, or when a friend is mad and about to do himself harm, or when we do not know the truth about ancient things and make a story as close to it as we can.\n\nAnd he grants the use of it to exactly one group. Lying is like medicine: valuable, and to be handled by professionals. If anyone is to lie, it is [[guardians|the rulers]], for the good of the city \u2014 and if a private citizen lies to a ruler, that is as grave as a patient lying to his doctor.\n\nSo it is not a cynical proposal, and it is not offered cynically. It is offered as a prescription, by a man who thinks the population is sick and cannot be told."}
    ], beneath: "<p><strong>Two things about the myth are usually missed, and they cut in opposite directions.</strong></p><p>The first is that it is anti-aristocratic. Plato's own class believed that noble blood was noble, full stop. The myth of the metals says the opposite: your parents' metal is <em>no guarantee</em>, the child of the ruling class may be bronze and must be sent down, the smith's son may be gold and must be brought up. A hereditary aristocrat wrote a founding myth that abolishes hereditary aristocracy.</p><p>The second is that it is a <em>lie</em>, and Plato uses the word, out loud, and makes Socrates flinch before he says it. He could have called it a myth, a story, an allegory, a useful fiction. He calls it <em>pseudos</em>. Whatever else is going on, we are not being smuggled past anything.</p><p>Which leaves the question the book will not answer: a city whose entire structure is justified by an argument about truth, order and knowledge, and which cannot stand up unless its citizens believe something false. If Kallipolis needs the lie, then reason alone cannot hold a society together \u2014 and that is either Plato's most honest admission or his most damning one.</p>", beyond: "<p>The phrase has had an appalling career. <em>Noble lie</em> is now a term of art in political science, and it is almost always used as an accusation \u2014 the myth of the founding, the flag, the destiny, the necessary story the state tells to hold itself together. Every propaganda ministry that ever existed has had someone in it who could quote this passage, and some of them did.</p><p>It is also, and this is the awkward part, one of the passages most often defended by people who admire Plato \u2014 who point out that the myth is offered <em>with</em> a shudder, and that the man proposing it also says the rulers must be forbidden gold, forbidden property, and forbidden any interest of their own. The defence is real. It has also been used, more than once, by people who wanted the lie without the poverty.</p>", verdicts: [
      {v: "Diagram", w: "the charitable reading", t: "It is a story about how a soul is held together \u2014 by a picture of itself it did not reason its way to. Plato flinches when he says it, and makes [[glaucon|Glaucon]] laugh at him. That is not how a man writes a policy."},
      {v: "Blueprint", w: "the plain reading", t: "He means it. He grants the right to lie explicitly, and only to [[guardians|the rulers]], and compares it to a doctor dosing a patient. He never takes it back."},
      {v: "Warning", w: "Popper", t: "A state manufacturing a religion of blood and rank to keep people in their place, and the twentieth century did exactly this, and cited him while doing it."}
    ], rels: [
      {id: "kallipolis", label: "the city it holds together"},
      {id: "guardians", label: "the only people permitted to tell it"},
      {id: "censorship", label: "the policy it belongs to"},
      {id: "popper", label: "who put it at the centre of the charge"}
    ]},
  {id: "guardians", name: "The Guardians", pron: "", type: "concept", tier: "major", themes: [
      "t_power",
      "t_soul"
    ], essence: "The rulers: bred, selected, tested for fifty years, stripped of property, privacy and family \u2014 watchdogs who must be savage to strangers and gentle to their own, and who are forbidden to want the thing they are given.", aka: "phulakes \u2014 the watchdogs", sections: [
      {h: "The Watchdog", body: "The problem is stated as a paradox. The city's guardians must be <em>fierce</em> \u2014 or they cannot fight \u2014 and <em>gentle</em>, or they will turn on the people they guard, and be more dangerous than any enemy. And those two things do not go together in the same nature.\n\nExcept, says Socrates, in a good dog.\n\nA well-bred dog is savage to strangers and delighted by anyone it knows \u2014 and how does it tell them apart? By <em>knowledge</em>. It has learned the one and not the other. So the dog is, in a small way, a philosopher: it decides who is friend and who is enemy on the basis of what it knows and does not know.\n\nIt is a joke, and [[glaucon|Glaucon]] takes it as one, and it is also the entire architecture of the book. The guardian must be spirited <em>and</em> a lover of learning, and that combination is so rare that the rest of the Republic is essentially a machine for manufacturing it."},
      {h: "What They Are Denied", body: "Here is the part that gets forgotten by everyone who calls this a blueprint for tyranny. The guardians are the <strong>poorest people in the city</strong>.\n\nNo private property, none at all, beyond what is absolutely necessary. No house or storeroom that anyone may not enter. Their food is a fixed ration, paid by the citizens as wages for their guarding, and there is nothing left over at the end of the year. They eat together in mess halls and live together like soldiers in camp.\n\nAnd they may not touch gold or silver, or handle it, or come under the same roof as it, or drink from a silver cup \u2014 because they have divine gold in their souls already, and the mortal kind would pollute it. The moment they own land and houses and money, Socrates says, they will stop being guardians and become farmers and landlords: hating and hated, plotting and plotted against, more afraid of the enemies inside the walls than the ones outside, and the whole city will run to its ruin.\n\nAnd [[community_children|they have no families]]. No wives, no husbands, no children they can name.\n\nWhen [[adeimantus|Adeimantus]] objects that this is a miserable life and they will not be happy, Socrates does not deny it. He says the city was not built to make one class happy, but the whole thing \u2014 and that a man painting a statue does not put the most beautiful colour on the eyes."},
      {h: "The Fifty-Year Filter", body: "They are selected as children and watched for the rest of their lives. Music and gymnastics first. Then, at twenty, ten years of mathematics \u2014 arithmetic, plane and solid geometry, astronomy, harmonics \u2014 to turn the mind's eye away from what changes.\n\nThen five years of [[dialectic|dialectic]], and not one day before thirty, because young men handed the art of refutation use it like puppies, tearing at everything for the pleasure of it, and end by believing nothing.\n\nThen fifteen years <em>back down</em>: military commands, offices, ordinary posts \u2014 tested by pleasure and pain and fear, watched to see whether anything can shake the dye out of the wool.\n\nAnd at fifty, the survivors are made to lift the eye of the soul and look at [[form_of_good|the Good]] itself \u2014 and then to spend the rest of their lives ruling in rotation: most of the time in philosophy, and when their turn comes, taking their spell of political drudgery, and doing it for the city's sake, as a thing that must be done, and not as anything fine."}
    ], beneath: "<p><strong>They are not an elite in any sense we would recognise, and that is the strongest thing in the Republic.</strong> They own nothing. They cannot get rich, cannot found a dynasty, cannot leave anything to a child they do not know they have. They rule in shifts, and they would rather be doing something else. Everything that makes power <em>worth having</em> has been surgically removed, and what remains is a duty.</p><p>And the design principle is exact: <em>the city must be ruled by people who do not want to rule it</em>. Socrates says a state whose rulers are eager is a state at war with itself, and that the punishment for refusing to rule is being ruled by someone worse than yourself. Judge any actual regime by that standard \u2014 including the ones that have cited Plato \u2014 and none of them survive the first sentence.</p><p><strong>And now the objection, which is fatal and simple.</strong> There is no mechanism. Nothing in [[kallipolis|the city]] can remove a guardian who turns out to be bad. There is no election, no appeal, no court above them, no free press, no exit. The entire safeguard is the <em>character</em> of the rulers, guaranteed by an educational system that the rulers themselves administer. Plato has built a machine with no brakes and put a very good driver in it.</p>", beyond: "<p>The mess halls, the common property, the eugenic breeding, the state-reared children, the contempt for money \u2014 all of this is Sparta, and every Athenian reader knew it. Plato has taken the constitution of the city that <em>beat</em> Athens, stripped the brutality and the helot slavery out of it, added philosophy, and offered it back as the ideal. It is the intellectual equivalent of a defeated nation admiring its conqueror's discipline, and it made his contemporaries deeply uncomfortable.</p><p>The afterlife is everywhere: the Guardians are the ancestors of the Platonic Christian priesthood (celibate, propertyless, ruling by knowledge), the mandarin civil service ideal, the Jesuits, the vanguard party, and every technocracy that has ever proposed to be governed by the qualified. Almost all of them kept the authority and quietly dropped the poverty.</p>", rels: [
      {id: "kallipolis", label: "the city they hold up"},
      {id: "philosopher_king", label: "what the best of them become"},
      {id: "auxiliaries", label: "the soldiers beneath them"},
      {id: "noble_lie", label: "the story only they may tell"},
      {id: "community_children", label: "the family they are denied"},
      {id: "paideia", label: "the fifty-year machine that makes them"}
    ]},
  {id: "auxiliaries", name: "The Auxiliaries", pron: "awg-ZILL-yuh-reez", type: "concept", tier: "supporting", themes: [
      "t_power",
      "t_soul"
    ], essence: "The soldier class \u2014 the city's [[thumos|spirit]], its anger and its courage \u2014 loyal, armed, silver-souled, and designed to be incapable of asking whether the rulers are right.", sections: [
      {h: "The Dye That Will Not Run", body: "They are the [[guardians|guardians']] hands: the standing army, the police, the enforcers of a constitution they did not design.\n\nAnd their virtue is <strong>courage</strong>, which Socrates defines with an image that should make you uneasy. Courage, he says, is the preservation \u2014 through pleasure, pain, fear and desire \u2014 of the belief the law has instilled about what is to be feared. It is like wool prepared so carefully by the dyer that the colour will not wash out. Their courage is a dye that will not run.\n\nWhich means, put plainly: a courageous soldier is one who <em>cannot be talked out of what he was taught as a child</em>. And the entire apparatus of [[censorship|approved stories]] and permitted musical modes exists to lay that dye down deep enough that no argument can lift it.\n\nWritten by the student of a man who was executed for talking people out of what they were taught as children."}
    ], beneath: "<p>The auxiliaries are the load-bearing problem of [[kallipolis|Kallipolis]] and Plato half-sees it. They have the weapons. They outnumber the rulers enormously. Nothing restrains them except their upbringing and [[noble_lie|a story about metals]]. Socrates worries about this exactly once \u2014 that the guardian dogs might turn on the flock \u2014 and answers it with <em>education</em>.</p><p>Every regime in history that has tried to make an army loyal by conviction rather than by pay or fear has discovered the same thing: it works right up until it doesn't. Plato's city has no plan B, because a plan B would require the auxiliaries to be able to think, and the whole design of them is that they should not.</p>", rels: [
      {id: "guardians", label: "whose orders they carry out"},
      {id: "thumos", label: "the part of the soul they are"},
      {id: "censorship", label: "the machine that dyes them"}
    ]},
  {id: "producers", name: "The Producers", pron: "", type: "concept", tier: "minor", themes: [
      "t_power"
    ], essence: "Farmers, smiths, traders \u2014 the overwhelming majority of the city, permitted money and families and everything the rulers are denied, and never once asked what they think.", sections: [
      {h: "The Silent Majority", body: "They are most of [[kallipolis|the city]], and the book almost forgets them. They keep their property, their houses, their wives and their children \u2014 all the things the [[guardians|guardians]] give up \u2014 and in exchange they are governed absolutely, forever, with no vote, no appeal and no voice.\n\nAnd this is the standing embarrassment of the beautiful city. Its [[justice|justice]] is <em>each doing his own</em> \u2014 and their own, for the bronze-souled, is to obey. Socrates never asks whether they consent, because consent is not a category he needs: the whole point of [[noble_lie|the metals]] is that they will believe the arrangement is natural.\n\nAnd there are slaves. They are mentioned in passing, assumed, and never made a problem by the argument at all."}
    ], rels: [
      {id: "kallipolis", label: "the city they mostly are"},
      {id: "noble_lie", label: "the story that keeps them in place"},
      {id: "eros", label: "the part of the soul they correspond to"}
    ]},
  {id: "philosopher_king", name: "The Philosopher-King", pron: "", type: "concept", tier: "major", themes: [
      "t_power",
      "t_know"
    ], essence: "Until philosophers rule, there is no rest from evil \u2014 the most famous sentence in political thought, and the most misread: the qualification for the throne is <em>not wanting it</em>.", sections: [
      {h: "The Third Wave", body: "Socrates has been running from this for two books. He calls it the biggest of the [[three_waves|three waves]], and says it will drown him in laughter and contempt, and then he says it:\n\n<em>Until philosophers rule as kings in their cities, or those now called kings genuinely and adequately take up philosophy \u2014 until political power and philosophy come together in the same person \u2014 there will be no rest from evil, [[glaucon|Glaucon]], for cities, nor, I think, for the human race.</em>\n\nAnd [[glaucon|Glaucon]] warns him, half-laughing, that a great many respectable men are now going to take off their coats, pick up whatever comes to hand, and run at him."},
      {h: "Why Him", body: "The claim is not that philosophers are clever, or nice. It is that they <strong>know</strong>, and everyone else has opinions \u2014 and that this is a difference of <em>kind</em>, not degree, because the objects are different. The philosopher looks at [[the_forms|what is]]. The rest of us look at what is passing.\n\nSo the argument for his rule is an argument about <em>expertise</em>: ruling is a craft, crafts have experts, and you would not let the passengers vote on how to set the sail. That is [[ship_of_state|the ship]], and it is the whole case.\n\nBut the second half of the case is the one nobody quotes, and it comes from [[the_cave|the Cave]]. The philosopher who has seen [[form_of_good|the sun]] does not <em>want</em> to come back down. He must be compelled. He will be ridiculous in the dark, useless at naming shadows, and hated. And that reluctance is not an obstacle to his rule \u2014 <strong>it is the qualification</strong>.\n\nSocrates says it flatly: a city ruled by men eager to rule is a city at war with itself. The best rulers are the ones for whom ruling is a chore they perform because the alternative is being ruled by someone worse."}
    ], beneath: "<p><strong>Take the reluctance seriously and the sentence stops sounding like fascism and starts sounding impossible.</strong> Every strongman who has ever cited Plato wanted power. Every technocrat who has ever cited Plato wanted the job. Plato's ruler has been dragged out of a library at the age of fifty, owns nothing, has no children, will get no monument, and would rather be thinking. There has never been such a person in charge of anything.</p><p>Which invites the obvious question: <em>then what is the sentence for?</em> If the philosopher-king cannot exist, is Plato proposing a government or diagnosing why every actual government is bad? The book supports both, and never chooses.</p><p><strong>[[popper|Popper's]] reply is the one that lands, and it is a change of question.</strong> <em>Who should rule?</em> is the wrong thing to ask, and asking it is precisely how you get tyranny \u2014 because it makes the problem of politics into a problem of <em>finding the right person</em>. The right question is: how do we arrange things so that bad rulers can be removed without bloodshed? By that measure [[kallipolis|Kallipolis]] is not merely imperfect. It has no mechanism at all. There is no way, in the beautiful city, to get rid of a guardian who has gone wrong.</p>", beyond: "<p><strong>Plato tried it.</strong> Three times he sailed to Syracuse to make a philosopher out of a tyrant \u2014 first the elder Dionysius, then his son. It went catastrophically: geometry lessons for a bored autocrat, a court full of enemies, house arrest, betrayal, a war, and Plato lucky to get out alive. Ancient sources say that on the first trip he was sold into slavery and had to be ransomed by a friend. He was in his sixties on the last attempt.</p><p>The phrase has since been claimed by nearly everyone: Marcus Aurelius (the only plausible candidate in history, and it did not save the empire), the medieval mirror-for-princes tradition, the enlightened despots, Lenin's vanguard, and every op-ed proposing that the experts be put in charge. It has also been the standing charge against Plato since 1945 \u2014 that this sentence is where Europe's love affair with rule by the enlightened few begins, and that it ended in a place with a gate and a motto.</p>", rels: [
      {id: "the_cave", label: "the descent that makes rule a duty"},
      {id: "form_of_good", label: "the knowledge that is his whole warrant"},
      {id: "ship_of_state", label: "the argument for expertise"},
      {id: "popper", label: "who says the question itself is the disease"},
      {id: "guardians", label: "the class he is drawn from"}
    ]},
  {id: "three_waves", name: "The Three Waves", pron: "", type: "concept", tier: "supporting", themes: [
      "t_power"
    ], essence: "Socrates says each of his three most shocking proposals is a wave that may break over his head and drown him in ridicule \u2014 and he is only half joking.", sections: [
      {h: "Three Times Under", body: "He does not want to make any of them. He is cornered into it by [[polemarchus|Polemarchus]] plucking [[adeimantus|Adeimantus]] by the cloak and refusing to let him move on, and he warns them that they are stirring up a swarm.\n\n<strong>The first wave:</strong> [[women_guardians|women will train, fight and rule alongside the men]], stripped in the gymnasium, and the city will laugh.\n\n<strong>The second wave, worse:</strong> [[community_children|no marriage, no family, no known children]] \u2014 rigged mating festivals and a common nursery.\n\n<strong>The third wave, the biggest:</strong> [[philosopher_king|philosophers must be kings]], and this one, he says, will drown him in laughter and contempt.\n\nIt is a structural joke and a real confession. Plato has organised the most radical passages of the book as a man being repeatedly ducked by the sea, and he lets [[glaucon|Glaucon]] tease him about it, and the wit stops precisely where the second wave starts and does not come back."}
    ], beneath: "<p>The comedy is doing work. By framing the proposals as things Socrates is <em>reluctant</em> to say \u2014 things that will get him laughed at, mobbed, drowned \u2014 Plato pre-empts the reader's reaction and makes it part of the scene. You are meant to want to laugh. You have been told, in advance, that you will.</p><p>Which is either brilliant rhetoric or a very effective way of making a reader feel foolish for having the right instinct. Notice that it works better on the first wave (where the laughter really is unearned) than on the second (where it is not laughter you feel).</p>", rels: [
      {id: "women_guardians", label: "the first"},
      {id: "community_children", label: "the second"},
      {id: "philosopher_king", label: "the third, and the biggest"}
    ]},
  {id: "women_guardians", name: "Women as Guardians", pron: "", type: "concept", tier: "major", themes: [
      "t_power",
      "t_soul"
    ], essence: "In a city where women could not vote, own land, or dine with their husband's guests, Socrates proposes that they train, wrestle naked, fight and rule alongside the men \u2014 and argues it from dogs.", aka: "The first wave", sections: [
      {h: "What a Woman in Athens Was", body: "None of this lands unless you know what he is proposing against.\n\nAn Athenian woman of the citizen class could not vote, could not hold office, could not sit on a jury, could not bring a case at law without a male guardian speaking for her, and could not enter into a contract worth more than a bushel of barley. She was passed from the authority of her father to that of her husband. She married at about fourteen, usually to a man twice her age, chosen for her. In a respectable household she did not dine with her husband's guests \u2014 the men in [[polemarchus|this very room]] are drinking and arguing all night, and there is not one woman among them, and nobody remarks on it.\n\nShe lived, largely, in the part of the house men did not enter. Pericles, in the most famous speech in Athenian history, told the war widows that the greatest glory of a woman is to be least talked about by men, whether for good or for bad.\n\nAnd the gymnasium \u2014 where men and boys exercised naked, in public, and where much of the city's social and erotic life happened \u2014 was one of the most rigorously male spaces in the Greek world.\n\nThat is the room Socrates walks into when he says: <em>and the women too</em>."},
      {h: "The Argument", body: "It is one page long and it is devastating in its plainness.\n\nWe use female watchdogs to guard the flock. Do we keep them at home because they whelp? No \u2014 we give them the same training and the same work, allowing that they are weaker.\n\nSo: do men and women differ? Yes. One begets, the other bears. Does that difference bear on <em>this question</em>? And here Socrates makes the move that every equality argument since has copied: bald men and long-haired men differ too, and we do not therefore say that bald men may be cobblers and long-haired men may not. A difference is only relevant if it is a difference <em>in the thing at issue</em>.\n\nAnd so, he says, there is no occupation in the running of a city that belongs to a woman <em>because</em> she is a woman, or to a man because he is a man. The natures are scattered alike through both sexes. One woman is a natural physician and another is not; one is musical, another unmusical; one is spirited and another is not.\n\nSome women, therefore, are fit to be [[guardians|guardians]], and their nature is the same as the men's, and they must be given the same education \u2014 music, gymnastics, riding, weapons \u2014 and the same office.\n\nWhich means they will exercise stripped, as the men do, wearing their excellence instead of clothes; and they will not all be young or beautiful; and the men on the benches will laugh.\n\n<em>Let them laugh</em>, says Socrates. Not long ago Greeks thought it shameful for <em>men</em> to be seen naked. Then the Spartans did it, and then everyone did, and the laughter stopped. What is useful is beautiful and what is harmful is ugly, and the man laughing at women in the gymnasium is picking unripe fruit from the tree of humour."}
    ], beneath: "<p><strong>It is the most radical page in ancient literature, and it is not feminism.</strong> Nothing here is about the women. Plato does not argue that they are wronged, or that they have a right to anything, or that the household is a cage. He argues from <strong>utility</strong>: the city needs the best guardians it can get, half of the best are female, and the present arrangement wastes them like a farmer refusing to breed from half his stock. He arrives at a radical conclusion by a route no modern egalitarian would take, and the route matters.</p><p><strong>And say the uncomfortable thing:</strong> the equality is purchased by [[community_children|the abolition of the family]], and the two proposals are one proposal. The female guardian is freed from the household by having the household destroyed. She will bear children she will never identify, in a rigged mating festival, and hand them to officers, and go back to work. Plato has not liberated women. He has abolished the private sphere \u2014 and women were the private sphere.</p>", beyond: "<p>Nobody in the ancient world had said this. Not the democrats \u2014 [[athenian_democracy|Athenian democracy]] was a men's club with a lottery. Not the poets, except as a joke: Aristophanes had already staged <em>Assemblywomen</em>, in which the women seize the assembly and institute common property and common sex, and it is played as farce. Scholars still argue about who was answering whom.</p><p>Aristotle, Plato's own student, rejected it flatly and wrote that the female is a deformed male and is naturally ruled \u2014 and it was <em>Aristotle</em> who was quoted for the next eighteen hundred years. That is worth pausing on. The most conservative philosopher in the tradition wrote the argument for women's exclusion; the most authoritarian one wrote the argument against it. And John Stuart Mill, arguing for women's suffrage in 1869, reached back over the whole intervening tradition to this page.</p>", rels: [
      {id: "three_waves", label: "the first of them"},
      {id: "community_children", label: "the price of the equality"},
      {id: "guardians", label: "the class she may enter"},
      {id: "kallipolis", label: "the only Greek city where a woman may rule"}
    ]},
  {id: "community_children", name: "The Abolition of the Family", pron: "", type: "concept", tier: "supporting", themes: [
      "t_power",
      "t_death"
    ], essence: "No marriages, no parents, no private children: rigged mating festivals, newborns taken to a common nursery \u2014 and one clause, at 460c, that the book states in a subordinate phrase and never returns to.", aka: "The second wave", sections: [
      {h: "The Machinery", body: "Among [[guardians|the guardians]], nobody has a wife, a husband, a house, or a child they can name.\n\nThe mechanism is agricultural and Socrates says so. We breed hunting dogs and gamebirds from the best stock, in their prime. How much more careful must we be with human beings \u2014 and how first-rate our rulers must be, if the same is true of the human herd.\n\nSo there are sacred marriage festivals, with hymns and sacrifice; the number of them regulated to keep the population steady. There is a lottery. And <strong>the lottery is rigged</strong> \u2014 ingeniously, Socrates says, so that the inferior men will blame their bad luck rather than the rulers when they are not matched with the best women. Young men who distinguish themselves in war get more frequent permission to father children. The best breed with the best, as often as possible; the inferior with the inferior, as rarely as possible.\n\nNewborns are taken by officers to a rearing quarter with nurses. Mothers are brought when their breasts are full, and every precaution is taken that no woman recognises her own child. Since nobody knows their parents, everyone of the right age is addressed as father, mother, brother, sister \u2014 and the incest rules are handled by arithmetic.\n\nAnd then, inside a sentence about administration:\n\n<em>The children of the inferior parents, and any of the others born defective, they will hide away, as is fitting, in an unspeakable and unseen place.</em>\n\nThat is the whole of it. [[glaucon|Glaucon]] says: yes \u2014 if the race of the guardians is to be kept pure. And Socrates moves on to the correct ages for childbearing.\n\nWe are not going to be clever about that sentence, and we are not going to pretend it says something else. Athens exposed unwanted infants; Plato's readers required no explanation and he gives none. There is a long tradition of translating the clause into something softer and hurrying past it. Be aware that the hurrying is happening."}
    ], beneath: "<p><strong>The aim is not cruelty. The aim is the destruction of the word <em>mine</em>.</strong> Socrates says it outright: the greatest evil for a city is whatever tears it apart, and nothing tears a city apart like men saying <em>mine</em> and <em>not mine</em> about different things. So take away the private house, the private wife, the private child, the private coin \u2014 and the city becomes one body, which feels an injury to a finger as an injury to the whole man.</p><p>It is the most complete vision of political unity ever written, and this is its price, stated in full, by its author, without flinching. Every communal experiment since \u2014 monastic, utopian, revolutionary \u2014 has been a partial and much less honest version of this page.</p><p><strong>And here is the wound the book leaves open.</strong> [[kallipolis|The city]] exists to answer a question about whether it is worth being a good person. To make it work, its rulers must deceive the citizens about who they sleep with, take their newborns in the night, and put some of them somewhere unspoken of. Nobody in the dialogue objects \u2014 not [[adeimantus|Adeimantus]], who objects to everything; not [[glaucon|Glaucon]], who could not bear to hear an unjust man praised. The silence in that room is the loudest thing in the Republic.</p>", rels: [
      {id: "women_guardians", label: "the wave before, and the same proposal"},
      {id: "guardians", label: "the only class subjected to it"},
      {id: "noble_lie", label: "the rigged lottery is the lie, operationalised"},
      {id: "kallipolis", label: "the unity it is meant to buy"}
    ]},
  {id: "censorship", name: "The Censorship of Poetry", pron: "", type: "concept", tier: "major", themes: [
      "t_art",
      "t_power"
    ], essence: "[[homer|Homer]] is crowned, anointed with myrrh, and escorted to the border \u2014 by a book that is itself a work of literature, told by a character, and ending in a fairy tale about the dead.", aka: "The ancient quarrel between poetry and philosophy", sections: [
      {h: "The First Purge", body: "It begins as childcare. The beginning of any work is the most important part, Socrates says, especially with a young and tender thing \u2014 that is when the character is being formed and the impression sinks deepest. So shall we let children hear any story anyone happens to invent, and take into their souls beliefs that are mostly the opposite of what we want them to hold as adults?\n\nWe shall not. So the story-makers must be supervised, and [[homer|Homer]] and Hesiod go under the knife.\n\nOut: gods at war, gods who lie, gods who change shape, gods who cause harm \u2014 because a god is good, and cannot be the cause of evil, and cannot need a falsehood. Out: heroes who weep, who fear death, who laugh uncontrollably, who take bribes. Out: Achilles dragging Hector's body around the tomb. Out \u2014 named, specifically, and it is the most beautiful line about death in Greek \u2014 Achilles saying from the underworld that he would rather be a landless man's slave on earth than king of all the dead. Cut, because it will make soldiers afraid to die."},
      {h: "The Second Purge", body: "In Book 10, with the argument already won, he comes back and does it again, harder \u2014 and this time the reasons change.\n\nThe metaphysical one: there is one Form of Bed, made by god; the carpenter imitates it; the painter paints the carpenter's bed, from one angle, in one light. The imitator is <strong>at three removes</strong>. And he knows nothing: [[homer|Homer]] wrote of generalship, medicine and law \u2014 name one battle he won, one patient he cured, one city he governed, one pupil he taught. Strip off the metre and look at what is left.\n\nAnd then the argument that Plato actually cares about, and it is not about knowledge at all.\n\nAt the theatre, when a great man howls with grief, <em>we enjoy it</em>. We surrender, and praise the poet who moves us most. And the same men would be ashamed to behave like that in their own losses \u2014 in real grief we pride ourselves on being quiet.\n\nSo the part of us we starve at our own funerals, we feed in the theatre. And what is fed grows. You cannot indulge a passion in someone else's sorrow and keep it caged in your own; the appetite for weeping is watered and nourished, and it is there, waiting, when the loss is yours. The same for laughter, for lust, for rage.\n\nSo: crown him, anoint him, and walk him to the gate."}
    ], beneath: "<p><strong>The emotional argument is the strong one, and it is not comfortable to dismiss.</strong> The metaphysics of imitation is easy to attack, and Aristotle demolished it within a generation. But the claim that <em>art trains the feelings, and the feelings become the man</em> is not easy to attack at all \u2014 and every censor since has stood on it, and so has every defender of art. Both sides agree that art does something to you. They disagree about what.</p><p><strong>And then there is the self-refutation, which the book never addresses.</strong> The Republic is literature. It is a story told in the first person by a character, full of invented cities, images, similes, and myths; it defeats [[athenian_democracy|democracy]] with two metaphors, wins its most famous victory with [[the_cave|an allegory]], and ends on [[myth_of_er|a story about the afterlife]] complete with singing Fates. Either Plato is blind to this \u2014 implausible \u2014 or the ban is narrower than it sounds, or the whole passage is a trap the reader is meant to fall into and then notice.</p><p><strong>The most personal sentence in the book is here:</strong> if poetry can make a defence of herself, he says, we shall gladly hear it, <em>for we are very conscious of her charm, and we know what it is to be under her spell</em>. And until then, he says, we must chant this argument to ourselves like an incantation, to keep from falling back in love.</p>", beyond: "<p>The ancient gossip \u2014 unverifiable and irresistible \u2014 is that the young Plato wrote tragedies and burned them the day he met [[socrates|Socrates]].</p><p>Aristotle's reply, twenty years later, is the one that stuck: tragedy does not <em>water</em> the passions, it <strong>drains</strong> them. Pity and fear are roused and purged, and you come out of the theatre lighter. Two men, same school, same texts, and diametrically opposed accounts of what happens to a person in an audience. Nobody has settled it, and every argument about whether violent films make violent people, or whether pornography changes what people want, is a rerun of Plato versus Aristotle with the names filed off.</p><p>And the passage has been useful to the wrong people for two thousand years. Every index of prohibited books, every state arts council with a moral remit, every regime that has decided which songs may be sung, has had someone in the building who could quote Book 3.</p>", verdicts: [
      {v: "Diagram", w: "the self-refuting reading", t: "A book that expels poetry using poetry, and then ends on a myth, is doing something other than legislating. Read it as a test."},
      {v: "Blueprint", w: "Book 10", t: "He returns to it after the argument is already won, and does it more harshly. Nobody revisits a throwaway."},
      {v: "Warning", w: "every censor since", t: "The claim that art shapes character and therefore the state must supervise it has never lacked users, and all of them could cite him."}
    ], rels: [
      {id: "homer", label: "the man being escorted out"},
      {id: "adeimantus", label: "whose complaint this answers"},
      {id: "noble_lie", label: "the one story the rulers may tell"},
      {id: "myth_of_er", label: "the poem the book ends on anyway"}
    ]},
  {id: "ship_of_state", name: "The Ship of State", pron: "", type: "concept", tier: "supporting", themes: [
      "t_power"
    ], essence: "A crew who never learned navigation, drugging the captain and fighting over the tiller, calling the one man who watches the stars a useless stargazer.", sections: [
      {h: "The Image", body: "The shipowner is bigger and stronger than anyone aboard \u2014 and short-sighted, hard of hearing, and no sailor. (He is the people.)\n\nThe crew are quarrelling over the helm, every one of them certain he should be steering, not one of them having ever studied navigation \u2014 and they insist it cannot be taught, and are ready to cut to pieces anyone who says it can. They beg the owner for the tiller; when he refuses, they kill the men who advised him, or throw them overboard. Then they drug him with drink or a sedative, take the ship, break into the stores, and sail on drinking and feasting.\n\nAnd the man they praise as a real seaman is whoever is best at helping them seize the helm by flattery or force.\n\nAnd the man who has actually studied the year, the seasons, the sky, the stars and the winds \u2014 who has learned the <em>craft</em> \u2014 they call a useless stargazer and a babbler.\n\nSo, says Socrates: the philosopher is not useless <em>to</em> the city. He is made useless <em>by</em> it. And it is not natural for the pilot to beg the sailors to be ruled by him."}
    ], beneath: "<p><strong>The image is beautiful and it begs the question, and it is worth being precise about how.</strong> It assumes there <em>is</em> a navigational science of ruling: an objective right answer, a body of knowledge, trained experts, and amateurs. Grant that, and democracy is obviously insane. But that is exactly what a democrat denies. If there is no expertise in the ends of politics \u2014 only in the means \u2014 then the crowd on deck is not a mutiny. It is a parliament, and arguing is not a failure of the system; it <em>is</em> the system.</p><p>Plato never considers this. He builds the ship so the question cannot be asked \u2014 and every subsequent defence of rule by the qualified has borrowed his hull.</p><p>He is also, and this is the uncomfortable part, describing something real. In 406 BC the Athenian assembly executed six of its own victorious generals in a single panicked vote, illegally, and regretted it within days. [[socrates|Socrates]] was presiding, and refused to put the motion. When he talks about sailors drugging the captain, his readers knew which ship.</p>", rels: [
      {id: "philosopher_king", label: "the navigator nobody wants"},
      {id: "athenian_democracy", label: "the ship"},
      {id: "great_beast", label: "its companion image, and the nastier one"}
    ]},
  {id: "great_beast", name: "The Great Beast", pron: "", type: "concept", tier: "supporting", themes: [
      "t_power",
      "t_art"
    ], essence: "Public opinion as an enormous animal whose keeper learns its moods and calls that wisdom \u2014 Plato's picture of what a democracy teaches its cleverest young men to do for a living.", sections: [
      {h: "The Keeper", body: "Everyone complains that [[the_sophists|the sophists]] corrupt the young. But the greatest sophist, says Socrates, is the public itself \u2014 the assembly, the law-court, the theatre, the crowd roaring approval and disapproval until the very stones echo.\n\nImagine a man in charge of a huge and powerful beast. He learns its moods and its appetites: how to approach it, when it is dangerous, what noises soothe it and what noises enrage it. After years of watching he writes it all down, calls it a science, and sets up to teach it.\n\nHe has no idea, in any of it, which of the beast's desires are <em>good</em> and which are shameful. He calls good whatever pleases the beast and bad whatever annoys it, <strong>because he has no other standard</strong>.\n\nThat, says Socrates, is what passes for political wisdom.\n\nAnd a gifted young man, watching where the honours go, learns that the road runs through the beast \u2014 and the philosophy that might have saved him is the one thing he will never find time for."}
    ], beneath: "<p><em>He calls good whatever pleases the beast, because he has no other standard.</em> It is the sharpest sentence Plato ever wrote about politics, and it has not aged one day. Anyone who has watched a poll drive a policy, a focus group write a manifesto, or an algorithm decide what a country is angry about this week, has watched the beast being fed by a man who knows exactly which noises it likes.</p><p>But hold the mirror up. The image assumes there <em>is</em> another standard \u2014 [[form_of_good|the Good]] \u2014 and that some people can see it. Take that away and the keeper is not a cynic; he is a democrat, doing the only thing anyone can do: finding out what people want. The Republic's contempt for public opinion is only as strong as its metaphysics, and its metaphysics is [[form_of_good|the one thing Socrates admits he cannot explain]].</p>", rels: [
      {id: "ship_of_state", label: "its twin, and the gentler one"},
      {id: "the_sophists", label: "the beast's professional keepers"},
      {id: "athenian_democracy", label: "the beast"}
    ]},
  {id: "five_regimes", name: "The Five Regimes", pron: "", type: "concept", tier: "major", themes: [
      "t_power",
      "t_soul"
    ], essence: "How a perfect city rots: honour, then money, then freedom, then terror \u2014 each stage produced by the sons of the stage before, and each with a matching kind of human being.", aka: "The decline of constitutions", sections: [
      {h: "The Sequence", body: "<strong>Aristocracy</strong> \u2014 [[kallipolis|the beautiful city]] \u2014 falls because everything that comes into being must decay, and because the rulers eventually mistime the breeding festivals. (The arithmetic Socrates gives for this is so extravagantly obscure that no one in twenty-four centuries has agreed what it means; it may be a joke at the expense of numerology.) The metals get mixed. Iron and silver approach each other. There is conflict.\n\n<strong>Timocracy</strong> \u2014 rule by the honour-lovers. The soldiers seize the land and enslave the farmers who were once their brothers. They are hard and brave and slightly stupid. They are ashamed of money, so they hide it \u2014 they keep treasuries in the dark and spend on themselves in private, and their wives complain, quietly, that other men have more.\n\n<strong>Oligarchy</strong> \u2014 the son heard his mother complaining, and hardened. Money becomes the qualification for office, and a property line is drawn across the city. And now there are literally <em>two cities</em>, says Socrates, the city of the rich and the city of the poor, in the same walls, plotting against each other. They cannot even fight a war, because arming the poor is more dangerous than the enemy. And they breed the men who will destroy them: the ruined, the dispossessed, armed and in debt and hating the men who did it to them.\n\n<strong>Democracy</strong> \u2014 the poor win, sometimes by arms, sometimes because the rich simply lose their nerve.\n\n<strong>Tyranny</strong> \u2014 and [[the_tyrant|the champion the people themselves nurse]]."},
      {h: "The Democratic Man", body: "Socrates' portrait of [[athenian_democracy|democracy]] is the most famous piece of political abuse ever written, and it is funny for two pages and then it is not.\n\nA beautiful constitution, he says, like a coat embroidered in every colour \u2014 the loveliest of all, if you like variety. Full of freedom. Nobody makes you rule and nobody makes you obey; you needn't go to war when the city does, or keep the peace when everyone else does. A man sentenced to death just stays, and strolls around like a ghost, and nobody notices.\n\nFathers get used to behaving like their sons and being afraid of them; sons imitate their fathers and respect nothing. The teacher fears his pupils and flatters them; the pupils despise the teacher. The old sit down with the young and imitate them, so as not to seem disagreeable. Even the horses and donkeys in the street, he says, have learned to walk about with such freedom and dignity that they barge into anyone who does not get out of the way.\n\nThe democratic man himself lives day to day: today wine and flutes, tomorrow water and diet; today philosophy, tomorrow politics, tomorrow business. All his desires are equal, and he calls that freedom.\n\nAnd then the joke stops. The city drinks freedom unmixed, and comes to see any authority at all as slavery; the leaders learn to feed [[great_beast|the beast]] and confiscate from the rich; the rich, attacked, become genuinely oligarchic; and out of the fight the people always \u2014 always \u2014 put forward <strong>one man</strong>, a champion, and nurse him, and make him great.\n\n<em>Out of the extreme of liberty comes the harshest and most complete slavery.</em>"}
    ], beneath: "<p><strong>The engine is generational, and that is Plato's real insight.</strong> Each regime is destroyed not by its enemies but by <em>its own sons</em> \u2014 boys who watched their fathers fail, and drew the wrong lesson in the dining room. Revolutions happen at home. It is a theory of politics in which the decisive institution is the family, which is worth remembering when you get to the man who [[community_children|abolished the family]].</p><p><strong>And it is revenge, and we should say so.</strong> The democracy being dismembered here is the one that killed [[socrates|Socrates]]. Plato watched it happen, having already watched [[thirty_tyrants|an oligarchy run by his own relatives]] murder fifteen hundred people. He has an axe. He is grinding it in public. The prose is magnificent and it is not disinterested.</p><p><strong>The steelman he never offers:</strong> the case for democracy is not that the crowd is wise. It is that <em>nobody</em> can be trusted with power, and a system that lets you throw the rascals out without bloodshed is worth more than one that installs the right rascal forever. Plato cannot consider it, because he is hunting the <em>best</em> constitution, and that argument is about the worst one you can survive.</p>", beyond: "<p>Plato has invented the decline narrative. Polybius formalises it into the cycle of constitutions; Machiavelli takes it up; Gibbon writes it at imperial scale; and every columnist announcing that the republic has entered its late phase is standing in Book 8 without knowing it.</p><p>The description of democratic license \u2014 the fathers afraid of their sons, the teachers flattering the pupils, the general collapse of deference \u2014 is quoted every few years by someone convinced it has only just become relevant. It has been quoted that way continuously since the fourth century BC, which is either evidence that Plato was right or evidence that every generation believes the barbarians arrived on its own watch.</p>", rels: [
      {id: "the_tyrant", label: "where it ends"},
      {id: "athenian_democracy", label: "the target, and the city that killed his teacher"},
      {id: "kallipolis", label: "the thing that decays first"},
      {id: "the_soul", label: "five regimes, five kinds of man"}
    ]},
  {id: "the_tyrant", name: "The Tyrant", pron: "", type: "concept", tier: "major", themes: [
      "t_power",
      "t_soul"
    ], essence: "The freest man alive and the most enslaved: a soul with its worst appetite on the throne, surrounded by people who would kill him, unable to leave his own house.", sections: [
      {h: "How He Arrives", body: "He begins as everyone's friend. Gentle to those he meets, full of promises \u2014 cancel the debts, redistribute the land \u2014 and genial to everyone he has not yet destroyed.\n\nHe asks for a bodyguard, so that the people's champion may be safe. And they give it to him, being afraid for him and unafraid for themselves.\n\nThen he needs a war, so that the people will need a leader; then another, because war makes men poor, and poor men are too busy to plot. And the men who helped him rise \u2014 the brave, the proud, the ones who speak freely \u2014 become a problem. So he must look around carefully and see who is courageous, who is intelligent, who is rich, and be their enemy, until he has cleaned the city out.\n\nA marvellous purge, says Socrates: the opposite of a doctor's. The physician removes the worst and leaves the best; the tyrant does the reverse.\n\nAnd the people, who fled the smoke of being ruled by free men, walk into the fire of being ruled by slaves."},
      {h: "The Beast in Every Man", body: "And then Socrates says something that stops the book dead.\n\nIn every one of us \u2014 even the most measured and respectable \u2014 there is a terrible, savage, lawless kind of desire. You can see it in <em>sleep</em>, when reason is off duty and the beast wakes: it will not shrink from anything. It will lie with a mother, or with any man, or god, or animal. It will commit any murder. It will eat anything. There is nothing, in a dream, it will not do.\n\nThe tyrant is the man in whom that thing is awake all day. He is the dream, walking.\n\nAnd so what is his life?\n\nHe cannot leave the house. He is surrounded by men who would kill him, so he never travels, never goes to a festival, never sees what any free citizen sees \u2014 he lives, says Socrates, shut indoors like a woman, and he is the only man in his own city who cannot go outside.\n\nHe is rich and always in want, because appetite is infinite. He is powerful and terrified. He is surrounded and friendless, because he has murdered anyone worth having. He flatters the worst men alive, and depends on them, and knows they are waiting.\n\nAnd he is not even master of himself: the same city inside him, a mob of desires, a tyrant on the throne of his soul, reason in chains."}
    ], beneath: "<p><strong>This is the answer to [[glaucon|Glaucon]], and the whole book has been built to deliver it.</strong> Injustice is not <em>punished</em> \u2014 injustice <em>is</em> the punishment. The unjust soul is not unlucky; it is diseased. And so [[glaucon|Glaucon]] awards the prize for happiness: the king first, and the tyrant, dead last, in fifth place.</p><p><strong>Now look hard at whether it answers the question that was asked.</strong> Glaucon's man had [[ring_of_gyges|a ring]] \u2014 he was an ordinary person with one unwatched opportunity, not a monster with a bodyguard. Nothing in the tyrant's misery explains why a decent man, offered a single invisible theft, should decline it. Socrates has answered a question about <em>a whole life surrendered to appetite</em>. Glaucon asked about <em>a moment</em>. The book has, over seven magnificent books, changed the subject \u2014 and this app is naming that rather than admiring the finish.</p><p>The best defence is Plato's own: there are no single moments. A man is what he repeatedly does, and the tyrant's soul is not a different substance from yours; it is your soul with the brakes off. The shepherd who takes the kingdom did not become a tyrant when he seized the throne. He became one when he twisted the ring the second time, to be sure.</p>", beyond: "<p><strong>Plato has just described the unconscious</strong>, twenty-three centuries before there was a word for it, and Freud \u2014 who cited this passage \u2014 did not pretend otherwise. The lawless desires that wake in sleep, unashamed of incest or murder, are the id in its cradle.</p><p>The political portrait has aged less than anyone would like. The champion of the poor; the promised debt relief; the requested bodyguard; the useful war; the purge of the competent; the surrounding by flatterers; the inability to walk down his own street. It has been read as a description of Athenian demagogues, of Roman emperors, of Renaissance princes, and of every strongman of the last hundred years. It is quoted every election cycle somewhere on earth, usually by people who think they have discovered it.</p>", rels: [
      {id: "ring_of_gyges", label: "the question he is meant to answer"},
      {id: "five_regimes", label: "the road that ends in him"},
      {id: "the_soul", label: "the same diagram, inverted"},
      {id: "eros", label: "the beast on his throne"},
      {id: "thrasymachus", label: "who called him the happiest man alive"}
    ]},
  {id: "myth_of_er", name: "The Myth of Er", pron: "AIR", type: "concept", tier: "major", themes: [
      "t_death",
      "t_justice"
    ], essence: "A soldier comes back from the dead to report what he saw: the judges, the spindle of Necessity, and the souls choosing their next lives \u2014 and the one who draws first pick chooses a tyranny.", sections: [
      {h: "What Er Saw", body: "Er, son of Armenius, was killed in battle. Ten days later his body was found undecayed among the dead. On the twelfth day, lying on the funeral pyre, he woke, and told them where he had been.\n\nHis soul had gone to a place with two openings in the earth and two in the sky, and judges sitting between them. The just were sent up to the right, through the sky, with a token of the verdict fastened on the front of them; the unjust down to the left, with their tokens behind. And out of the other openings, souls were arriving \u2014 some rising from the earth, filthy and dusty; some descending from the sky, clean \u2014 and they camped in the meadow like a festival crowd, and asked each other for news: those from below weeping as they remembered a thousand years underground, those from above describing beauty beyond words.\n\nThe arithmetic is exact and unsparing: every wrong repaid tenfold, in units of a hundred years. And there is a passage \u2014 about the very worst of the tyrants, seized at the mouth of the exit by fiery men, bound and flayed and dragged away over thorns \u2014 which Plato writes with no relish at all, and to which we shall add none."},
      {h: "The Choosing", body: "Then, after four days' journey, they come to the shaft of light that binds the heavens, and the <strong>spindle of Necessity</strong>, turning on her knees, with her three daughters seated round it in white, singing: Lachesis of what was, Clotho of what is, Atropos of what shall be.\n\nAn official climbs a platform and calls out:\n\n<em>Souls of a day. Here begins another circuit of mortal life. No daemon will be allotted to you \u2014 you will choose your daemon. Let him who draws the first lot choose first the life to which he will then be bound of necessity. Virtue has no master: each will have more or less of her as he honours or dishonours her. <strong>The responsibility is the chooser's. God is blameless.</strong></em>\n\nThe lots are scattered. The lives are laid out on the ground \u2014 more of them than there are souls \u2014 every kind of animal and every kind of human life: tyrannies that last to the end and tyrannies that collapse halfway; lives of fame, of beauty, of strength, of birth; lives of obscure men; lives of women.\n\nAnd here, says Socrates, is the whole risk of being human.\n\nThe man who drew the first lot came forward and immediately chose the greatest tyranny \u2014 grasping and glutting, not examining it \u2014 and did not notice that written into it was the eating of his own children. And when he read it at leisure he beat his breast and wailed, and blamed chance, and the gods, and everything but himself.\n\nHe had come <em>down from the sky</em>. He had been good in his previous life \u2014 in a well-ordered city, <strong>by habit, without philosophy</strong>.\n\nOdysseus drew the last lot of all. The memory of his labours had cured him of ambition, and he wandered for a long time looking for the life of a private man who minds his own business \u2014 and had trouble finding it, because it was lying neglected in a corner where no one else had wanted it. And he said that he would have chosen it even with the first lot, and took it gladly.\n\nThen they drank from the River of Forgetfulness on the Plain of Oblivion, and those without the sense to be careful drank more than the measure. And at midnight there was thunder and an earthquake, and they were swept up like shooting stars, to be born.\n\nEr was not permitted to drink."}
    ], beneath: "<p><strong>Here is the trap, and it is the last thing the book does to you.</strong> [[glaucon|Glaucon]] set one condition in Book 2, absolutely: prove that [[justice|justice]] is worth having <em>with every reward stripped off</em>. No reputation, no honours, no payment from gods or men. And Socrates accepted the terms, and kept them for eight books.</p><p>And then, on the last pages, he says: <em>now let us give justice back its wages</em> \u2014 and hands over the reputation, the honours, the prizes, and a thousand-year payout in the hereafter, at ten per cent.</p><p>Either the book pays its bill in a currency it swore not to use, or the debt was settled in Book 9 (the just soul is happy <em>in itself</em>; this is a bonus; everyone knows it is a bonus; Plato is allowed a curtain call). We are not going to decide for you \u2014 but do notice which of those two readings requires you to ignore the last twenty pages.</p><p><strong>And the finest thing in the book is here.</strong> The man with first pick was <em>good</em>. He came from heaven. He had lived decently in a well-run city \u2014 and he had been good <strong>by habit, without philosophy</strong>, and so, when eternity was laid out on the ground and he had first choice, he seized the shiniest thing on the table, and it contained the eating of his own children.</p><p>That is Plato's last word and it is aimed directly at you: <em>being a nice person who was brought up properly is not enough. You have to actually think about it.</em> It is why the book exists. It is what happened to Athens.</p>", beyond: "<p><strong>The Republic ends with a poem</strong> \u2014 one page after [[censorship|escorting Homer out of the city]] for telling untrue stories about the afterlife. Plato is not being careless. Whatever the ban was, it was not a ban on this. The best account of the difference is <em>direction</em>: Homer's underworld makes men afraid to die and the gods look arbitrary; Er's says one thing, over and over \u2014 <strong>the responsibility is the chooser's</strong>.</p><p>The vision travels. The judged souls, the two roads, the meadow, the thousand years, the river of forgetting: this is one of the founding texts of the Western afterlife, and it runs straight into Virgil's Book 6, and from Virgil into [[transmission|Dante]], who is standing on it every step down and every step up. Odysseus, quietly choosing an obscure life in a corner, is one of the strangest and most moving things in Greek literature \u2014 the most famous adventurer in the world, given his pick of eternity, asking for a quiet one.</p>", rels: [
      {id: "glaucon", label: "whose condition it may violate"},
      {id: "justice", label: "given its wages back at last"},
      {id: "the_tyrant", label: "what the good man chooses, having never thought"},
      {id: "censorship", label: "the ban this poem walks straight past"}
    ]},
  {id: "thumos", name: "Thumos", pron: "THOO-moss", type: "concept", tier: "supporting", themes: [
      "t_soul"
    ], essence: "Spirit, temper, the part of you that is <em>furious</em> when you are wronged \u2014 the middle of the soul, Plato's original contribution to psychology, and the part he thought politics was actually made of.", sections: [
      {h: "The Part That Takes Sides", body: "Reason and appetite are obvious enough. The third part is Plato's discovery, and he has to argue for it \u2014 which he does with [[the_soul|Leontius]], the man who is disgusted with himself for wanting to stare at corpses and shouts at his own eyes.\n\nThe point is that his <em>anger</em> is directed against his own <em>desire</em>. So anger cannot be desire. And it is not reason either, because children and animals are full of it long before they can calculate.\n\nSo <em>thumos</em> is a third thing: the part that gets indignant, that wants honour and hates being slighted, that goes to war, that feels shame, and that \u2014 crucially \u2014 <strong>naturally fights on reason's side</strong>, unless a bad upbringing has corrupted it. It is the good dog in the soul: fierce to what threatens you, obedient to what governs you.\n\nAnd it is what the [[auxiliaries|soldiers]] are, and it is what the whole [[paideia|education in music and gymnastics]] is designed to tune \u2014 too much gymnastics and it becomes savagery, too much music and it goes soft."}
    ], beneath: "<p>Nobody had put anger at the centre of politics before, and it is arguably Plato's most durable psychological claim. <em>Thumos</em> is not desire and not calculation \u2014 it is the need to be <em>recognised</em>, and the rage that comes when you are not. It explains the things economics cannot: why men die for flags, why an insult starts a war, why people vote against their own interests to punish someone who looked down on them.</p><p>Hegel calls it the struggle for recognition. Fukuyama, arguing about the end of history, borrowed the Greek word untranslated because no modern one would do. Every account of politics that reduces human beings to interests \u2014 to appetite and calculation, the first and third parts \u2014 keeps being ambushed by the middle one.</p>", rels: [
      {id: "the_soul", label: "the middle of it"},
      {id: "auxiliaries", label: "the class it corresponds to"},
      {id: "paideia", label: "the tuning of it"}
    ]},
  {id: "eros", name: "Eros and Appetite", pron: "AIR-oss", type: "concept", tier: "supporting", themes: [
      "t_soul"
    ], essence: "Hunger, thirst, sex, money \u2014 the many-headed beast at the bottom of the soul, the biggest part of most people, and the thing Socrates never quite says can be trusted.", sections: [
      {h: "The Many-Headed Beast", body: "Appetite is the largest part of the soul and the least discriminating. It wants; it does not ask what it wants or why. And Socrates gives it a body: imagine a creature with a many-headed beast at one end \u2014 heads of tame animals and wild ones, growing and changing at will \u2014 and a lion beside it, and a man, and then imagine the whole thing wrapped in a human skin, so that from outside it looks like one person.\n\nInjustice is feeding the beast and starving the man. [[justice|Justice]] is the inner man in charge, with the lion as his ally, farming the tame heads and preventing the wild ones from growing.\n\nAnd underneath appetite there is something worse: the lawless desires that surface in sleep, which will not shrink from anything at all \u2014 and which [[the_tyrant|the tyrant]] lives inside, awake."}
    ], beneath: "<p><strong>The Republic is unusually cold about desire, and it is worth noticing that Plato does not stay this way.</strong> Here, <em>eros</em> is the enemy: the beast, the mob, the thing that must be farmed. Reason rules by suppression, and the ideal is a man whose appetites are quiet.</p><p>But in the <em>Symposium</em> and the <em>Phaedrus</em> \u2014 the other two great dialogues \u2014 the same author says the opposite. There, <em>eros</em> is the <em>engine</em>: desire for a beautiful body is the first rung of a ladder that climbs to the desire for beauty itself, and the philosopher is not the man who has killed his longing but the man whose longing has found its real object. The soul in the <em>Phaedrus</em> is a charioteer with two horses, and he needs them <em>both</em>.</p><p>Read only the Republic and Plato is a puritan. Read the three together and he is something much stranger: a man who thought that what drags you down and what lifts you up are the same force, pointed differently.</p>", rels: [
      {id: "the_soul", label: "the bottom of it"},
      {id: "the_tyrant", label: "the man it finally rules"},
      {id: "producers", label: "the class it corresponds to"}
    ]},
  {id: "paideia", name: "Education", pron: "pie-DAY-uh", type: "concept", tier: "supporting", themes: [
      "t_know",
      "t_art"
    ], aka: "paideia", essence: "Not filling an empty mind but <em>turning a whole soul around</em> \u2014 which is why it starts with music and wrestling and ends, thirty years later, at the stars.", sections: [
      {h: "Turning the Soul", body: "Education, Socrates says, is not what its professors claim. They say they can put knowledge into a soul that lacks it, like putting sight into blind eyes.\n\nBut the prisoner in [[the_cave|the cave]] already has eyes. What he lacks is the <em>direction he is facing</em>. So the whole art of education is a <strong>turning</strong> \u2014 <em>periagoge</em> \u2014 the swivelling of the entire soul, together with the whole body, away from the world of becoming until it can bear to look at what is. You cannot teach anybody anything. You can only turn them round and make them do the walking.\n\nAnd so the curriculum is a machine for turning people. <strong>Music</strong> (which means poetry, story, rhythm and mode \u2014 everything the child hears) and <strong>gymnastics</strong> first, and they are not for the mind and the body respectively: <em>both are for the soul</em>. Gymnastics alone makes a man savage; music alone makes him soft. The two together tune the [[thumos|spirit]] like a lyre.\n\nThen ten years of mathematics, because number and geometry drag the mind away from what changes. Then [[dialectic|dialectic]] \u2014 and not before thirty. Then fifteen years of ordinary office, being tested. Then, at fifty, [[form_of_good|the Good]]."}
    ], beneath: "<p><strong>This is the most beautiful idea in the Republic and the most dangerous, and they are the same idea.</strong> If education is not the transfer of information but the <em>reorientation of a soul</em>, then everything a child sees and hears is education \u2014 every song, every story, every rhythm \u2014 and there is no such thing as harmless entertainment. Which is precisely why [[censorship|the poets have to go]]. The censorship is not an ugly appendix to the theory of education. It is the theory of education, followed through.</p><p>And every teacher who has ever said that the point is not to fill a bucket but to light a fire is quoting this passage, usually without knowing that the man who wrote it also banned most of the books.</p>", rels: [
      {id: "the_cave", label: "the turning, in a story"},
      {id: "censorship", label: "what the theory requires"},
      {id: "guardians", label: "the product of the machine"},
      {id: "dialectic", label: "the last thing taught, and the most feared"}
    ]},
  {id: "dialectic", name: "Dialectic", pron: "dye-uh-LEK-tik", type: "concept", tier: "supporting", themes: [
      "t_know"
    ], essence: "The final study: argument that climbs past its own assumptions to a first principle \u2014 and which Socrates will not let anyone under thirty touch, because it turns clever young men into wreckers.", sections: [
      {h: "The Only Road Up", body: "Every other discipline stops somewhere. The geometer starts from the odd and the even and the figures, treats them as obvious, and reasons <em>downwards</em>. He never looks under his own feet.\n\nDialectic goes the other way. It treats assumptions <em>as</em> assumptions \u2014 as steps and springboards \u2014 and climbs <em>up</em> through them to a first principle that needs nothing beneath it. It uses no images at all. It moves through [[the_forms|Forms]], by Forms, to Forms. And it is the only thing that can give an account of [[form_of_good|the Good]].\n\nAnd then Socrates says something extraordinary. It must not be given to the young.\n\nBoys who get hold of argument use it like puppies: they tear at everything within reach for the sheer pleasure of it. Contradicted by everyone, they learn to contradict everyone, and they end by believing nothing they were brought up to believe \u2014 and then they, and philosophy with them, fall into public contempt.\n\nSo: nothing before thirty. Five years, under supervision, for people whose characters have already been dyed."}
    ], beneath: "<p><strong>Read that clause again and hold it next to the charge sheet.</strong> [[socrates|Socrates]] was executed for <em>corrupting the young</em> \u2014 for teaching clever boys to question everything they had been brought up to believe, until they believed nothing. Alcibiades came out of his circle. So did Critias, who ran [[thirty_tyrants|the Thirty]].</p><p>And here is Plato, writing decades later, putting into his dead teacher's mouth a rule that would have <strong>banned Socrates from doing what Socrates did</strong>. The man killed for asking questions designs a city where asking them is licensed, supervised, age-restricted, and reserved for people whose beliefs are already fixed.</p><p><em>This app is taking a position:</em> that is not an oversight. It is Plato conceding, quietly, that the prosecution had a point \u2014 and it is the saddest passage in the Republic.</p>", rels: [
      {id: "divided_line", label: "the top segment"},
      {id: "form_of_good", label: "the only thing it can reach"},
      {id: "trial_of_socrates", label: "the charge this clause concedes"},
      {id: "paideia", label: "the last stage of the curriculum"}
    ]},
  {id: "kallipolis", name: "Kallipolis", pron: "kah-LIP-oh-liss", type: "place", tier: "major", themes: [
      "t_power",
      "t_justice"
    ], aka: "The beautiful city; the city in speech", essence: "The city built out of talk in a single night \u2014 an argument's diagram, an authoritarian blueprint, or a warning; and the whole fight over the Republic is a fight over which.", sections: [
      {h: "Why It Exists at All", body: "It is crucial to see that Socrates does not set out to design a state. He is asked a question about <em>one man's soul</em> and cannot answer it.\n\nSo he offers an excuse that is also a method. Imagine, he says, men with poor eyesight told to read small letters at a distance \u2014 and then someone notices the same letters, larger, somewhere else. They would read the big ones first, and then check the small.\n\n[[justice|Justice]] can exist in a city as well as a man, and a city is bigger. So: let us watch a city come into being, and we shall see justice being born, and injustice too.\n\nThe city is a magnifying glass. Everything monstrous in it arrives as a consequence of that decision \u2014 which is either the best defence the Republic has, or the most convenient one."},
      {h: "How It Is Built", body: "First the honest little city: farmers, a builder, a weaver, a shoemaker; barley cakes and figs and wine and a hymn to the gods. Men living to a peaceful old age.\n\n[[glaucon|Glaucon]] objects. This is a city of pigs. Where are the couches, the relishes, the pastries?\n\nVery well, says Socrates \u2014 and here is the hinge of the entire book \u2014 let us look at the <em>feverish</em> city. Add luxury: perfume, gold, actors, prostitutes, doctors. And now the land is too small, so we must take our neighbours' land, and they ours. And so <strong>we need an army</strong>.\n\nEverything else follows from that army. The soldiers must be selected, bred, educated, [[censorship|fed only on approved stories]], stripped of property, given [[noble_lie|a founding myth]], and ruled by [[philosopher_king|the best of them]]. The perfect city is built to house a standing army that exists because Glaucon wanted pastries."},
      {h: "What It Looks Like When It Is Finished", body: "Three classes with three metals in the blood. No private property for the rulers, no private families, no privacy at all. Marriages rigged by lottery. Children taken at birth and raised in common. Every story, song, rhythm and mode controlled from infancy. [[homer|Homer]] escorted to the gate. And to found the thing, everyone over the age of ten sent out into the fields.\n\nAnd yet: women rule as equals. There is no hereditary aristocracy, and a golden child born to bronze parents <em>must</em> be promoted. The rulers are the poorest people in the city and are forbidden to touch gold. Nobody in charge is permitted to want to be.\n\nIt is not a fascist state and it is not a liberal one. It is stranger than either, and both sides of the argument have to keep quoting past the parts they hate."}
